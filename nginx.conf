server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OJO con las expectativas: delante hay Cloudflare (el deploy publica por cloudflared,
    # ver .github/workflows/deploy.yml) y el edge YA sirve brotli y cachea los assets con
    # hash como immutable, así que esto NO cambia lo que recibe el navegador. Solo baja la
    # CPU del origen en los MISS del edge. Por eso tampoco se mete ngx_brotli: nginx:alpine
    # no lo trae y habría que cambiar de imagen base para ganar cero bytes en el cliente.
    gzip on;
    gzip_vary on;
    # El nivel por defecto es 1 (el más flojo). El 5 es el punto de equilibrio CPU/ratio;
    # por encima el retorno es marginal.
    gzip_comp_level 5;
    # Sirve el .gz precomprimido en el build (ver Dockerfile) en vez de comprimir por
    # request. La imagen oficial de nginx trae --with-http_gzip_static_module; se puede
    # comprobar dentro del contenedor con:
    #   nginx -V 2>&1 | tr ' ' '\n' | grep gzip_static
    gzip_static on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El mime.types por defecto de nginx NO mapea .mjs ni .wasm → los sirve como
    # application/octet-stream, y el navegador RECHAZA cargar el módulo (strict MIME
    # checking). Eso rompe el worker de pdf.js (/pdfjs/pdf.worker.min.mjs) y el render
    # de PDFs. Se fuerza el Content-Type correcto aquí (van ANTES del regex de assets
    # para ganar precedencia).
    # OJO: pdf.worker.min.mjs tiene nombre FIJO (sin hash), así que NO se marca
    # immutable — si no, el navegador se quedaría pegado a una copia vieja por un año.
    # Caché corta y revalidable: un cambio (o este fix) se toma pronto.
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Assets con hash en el nombre: cache larga e inmutable.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae a index.html (Angular rutea del lado del cliente).
    # Sin esto, un F5 en /login/verify o /find-office da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea, para que un deploy nuevo se tome al toque.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
