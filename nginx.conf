server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre: cache larga e inmutable.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae a index.html (Angular rutea del lado del cliente).
    # Sin esto, un F5 en /login/verify o /find-office da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea, para que un deploy nuevo se tome al toque.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
