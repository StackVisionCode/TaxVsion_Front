@if (transition.active()) {
  <!-- z-[90]: sobre los toasts (80) y debajo de los modales de sesión (100). -->
  <div
    class="login-transition fixed inset-0 z-[90] flex flex-col items-center justify-center overflow-hidden bg-[#F8F4ED]"
    [class.is-leaving]="transition.leaving()"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <!-- Escena decorativa: los módulos llegan desde los lados y se funden en el infinito. -->
    <div class="relative flex h-40 w-full max-w-xl items-center justify-center" aria-hidden="true">
      @for (chip of chips; track chip.icon) {
        <span class="chip" [style.--x]="chip.x" [style.--y]="chip.y" [style.--d]="chip.delay">
          <ion-icon [name]="chip.icon"></ion-icon>
        </span>
      }

      <svg class="flow" viewBox="0 0 64 32" fill="none">
        <path class="flow-base" [attr.d]="path" pathLength="100" />
        <path class="flow-trail" [attr.d]="path" pathLength="100" />
        <path class="flow-head" [attr.d]="path" pathLength="100" />
      </svg>

    </div>

    <p class="caption mt-6 text-sm font-semibold text-[#083645]">{{ transition.caption() }}</p>
    <div class="bar mt-4" aria-hidden="true"><span></span></div>
  </div>
}
