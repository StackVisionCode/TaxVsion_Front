<div>
  <!-- Method toggle -->
  <div class="inline-flex items-center rounded-full border border-gray-200 p-1">
    <button type="button" (click)="setMethod('draw')"
      class="flex items-center gap-1.5 rounded-full px-4 py-1.5 text-sm font-medium transition-colors"
      [ngClass]="method() === 'draw' ? 'bg-brand-bold text-white' : 'text-gray-500 hover:bg-gray-100'">
      <ion-icon name="pencil-outline" class="text-sm"></ion-icon>
      Draw
    </button>
    <button type="button" (click)="setMethod('type')"
      class="flex items-center gap-1.5 rounded-full px-4 py-1.5 text-sm font-medium transition-colors"
      [ngClass]="method() === 'type' ? 'bg-brand-bold text-white' : 'text-gray-500 hover:bg-gray-100'">
      <ion-icon name="text-outline" class="text-sm"></ion-icon>
      Type
    </button>
    <button type="button" (click)="setMethod('upload')"
      class="flex items-center gap-1.5 rounded-full px-4 py-1.5 text-sm font-medium transition-colors"
      [ngClass]="method() === 'upload' ? 'bg-brand-bold text-white' : 'text-gray-500 hover:bg-gray-100'">
      <ion-icon name="cloud-upload-outline" class="text-sm"></ion-icon>
      Upload
    </button>
  </div>

  <!-- Estilo: color de tinta (dibujo y texto) y grosor (dibujo) -->
  <div *ngIf="method() !== 'upload'" class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2">
    <div class="flex items-center gap-2" role="group" aria-label="Ink color">
      <span class="text-[11px] text-gray-400">Ink</span>
      <button *ngFor="let ink of inkOptions" type="button" (click)="setInk(ink.id)" [attr.aria-label]="ink.label + ' ink'"
        [attr.aria-pressed]="ink.id === inkId()" [title]="ink.label"
        class="h-6 w-6 rounded-full border-2 transition-shadow"
        [style.background-color]="ink.color"
        [ngClass]="ink.id === inkId() ? 'border-white ring-2 ring-gray-900/70' : 'border-white ring-1 ring-gray-200'"></button>
    </div>
    <div *ngIf="method() === 'draw'" class="flex items-center gap-2" role="group" aria-label="Stroke width">
      <span class="text-[11px] text-gray-400">Pen</span>
      <div class="inline-flex items-center rounded-full border border-gray-200 p-0.5">
        <button *ngFor="let stroke of strokeOptions" type="button" (click)="setStroke(stroke.id)"
          [attr.aria-label]="stroke.label + ' pen'" [attr.aria-pressed]="stroke.id === strokeId()" [title]="stroke.label"
          class="flex h-7 w-9 items-center justify-center rounded-full transition-colors"
          [ngClass]="stroke.id === strokeId() ? 'bg-gray-100' : 'hover:bg-gray-50'">
          <span class="block w-4 rounded-full" [style.height.px]="stroke.width + 0.5" [style.background-color]="inkColor()"></span>
        </button>
      </div>
    </div>
  </div>

  <!--
    Draw — se OCULTA (no se destruye) para no perder los trazos al cambiar de método.
    En pantalla completa el MISMO canvas pasa a ocupar la pantalla: el observer ajusta el
    buffer y redibuja los trazos guardados.
  -->
  <div [class.hidden]="method() !== 'draw'" class="mt-3">
    <div [ngClass]="expanded()
        ? 'pad-fullscreen fixed inset-0 z-[70] flex flex-col bg-white px-4 pt-[max(1rem,env(safe-area-inset-top))] pb-[max(1rem,env(safe-area-inset-bottom))]'
        : ''" [attr.role]="expanded() ? 'dialog' : null" [attr.aria-modal]="expanded() ? 'true' : null"
      [attr.aria-label]="expanded() ? 'Draw your signature' : null">
      <div *ngIf="expanded()" class="mb-3 flex items-center justify-between gap-2">
        <p class="text-base font-semibold text-gray-900">Sign here</p>
        <div class="flex items-center gap-1.5">
          <button type="button" (click)="undo()" [disabled]="!hasDrawing()"
            class="rounded-full px-3 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-100 disabled:opacity-40">Undo</button>
          <button type="button" (click)="clearCurrent()" [disabled]="!hasDrawing()"
            class="rounded-full px-3 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-100 disabled:opacity-40">Clear</button>
          <button type="button" (click)="collapse()"
            class="rounded-full bg-brand-bold px-4 py-1.5 text-sm font-semibold text-white hover:bg-brand-ink">Done</button>
        </div>
      </div>
      <p *ngIf="expanded() && isPortrait()"
        class="mb-2 flex items-center gap-1.5 rounded-xl bg-brand-white px-3 py-2 text-xs text-gray-500">
        <ion-icon name="phone-landscape-outline" class="shrink-0 text-sm"></ion-icon>
        Tip: turn your phone sideways for more room.
      </p>

      <div class="relative overflow-hidden rounded-2xl border-2 border-dashed border-gray-200 bg-brand-white"
        [ngClass]="expanded() ? 'min-h-0 flex-1' : 'h-48 sm:h-40'">
        <canvas #canvas class="absolute inset-0 h-full w-full touch-none" style="touch-action: none;"
          (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)"
          (pointercancel)="onPointerUp($event)" (lostpointercapture)="onPointerUp($event)"></canvas>
        <!-- Renglón de firma -->
        <div class="pointer-events-none absolute inset-x-6 bottom-7 flex items-end gap-2 text-gray-300">
          <span class="text-sm leading-none">✕</span>
          <span class="mb-0.5 h-px flex-1 bg-gray-300"></span>
        </div>
        <p *ngIf="!hasDrawing()" class="pointer-events-none absolute inset-0 flex items-center justify-center px-4 text-center text-sm text-gray-400">
          Sign with your finger, stylus or mouse
        </p>
      </div>
    </div>
  </div>

  <!-- Type -->
  <div *ngIf="method() === 'type'" class="mt-3 flex flex-col gap-3">
    <div class="flex h-11 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
      <input type="text" placeholder="Type your full name" [ngModel]="typedText()" name="typedText" autocomplete="name"
        (ngModelChange)="typedText.set($event)" maxlength="80"
        class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
    </div>

    <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Signature style">
      <button *ngFor="let font of fontOptions" type="button" (click)="selectFont(font.id)"
        class="rounded-full border px-4 py-1.5 text-sm transition-colors"
        [style.font-family]="font.fontFamily" [style.font-style]="font.fontStyle" [style.font-weight]="font.fontWeight"
        [attr.aria-pressed]="font.id === selectedFontId()"
        [ngClass]="font.id === selectedFontId() ? 'border-brand-bold bg-gray-50 text-gray-900' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
        {{ font.label }}
      </button>
    </div>

    <div class="flex h-32 items-center justify-center overflow-hidden rounded-2xl border-2 border-dashed border-gray-200 bg-brand-white px-4">
      <p *ngIf="typedText().trim(); else typePlaceholder" class="max-w-full truncate text-[clamp(1.5rem,7vw,2.25rem)] leading-normal"
        [style.font-family]="selectedFont().fontFamily" [style.font-style]="selectedFont().fontStyle"
        [style.font-weight]="selectedFont().fontWeight" [style.color]="inkColor()">
        {{ typedText() }}
      </p>
      <ng-template #typePlaceholder>
        <p class="text-sm text-gray-400">Your signature preview will appear here</p>
      </ng-template>
    </div>
  </div>

  <!-- Upload -->
  <div *ngIf="method() === 'upload'" class="mt-4">
    <div *ngIf="!uploadedDataUrl()" class="rounded-2xl border-2 border-dashed border-gray-200 bg-brand-white p-6 text-center">
      <ion-icon name="image-outline" class="text-3xl text-gray-300"></ion-icon>
      <p class="mt-2 text-sm text-gray-500">Upload an image of your signature</p>
      <p class="text-[11px] text-gray-400">PNG or JPEG, up to 4 MB</p>
      <label
        class="mt-3 inline-flex cursor-pointer items-center gap-2 rounded-full border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
        <ion-icon name="folder-open-outline" class="text-sm"></ion-icon>
        Choose file
        <input type="file" accept="image/png,image/jpeg" class="hidden" (change)="onFileSelected($event)" />
      </label>
    </div>

    <div *ngIf="uploadedDataUrl()" class="flex flex-col items-center gap-3 rounded-2xl border-2 border-dashed border-gray-200 bg-brand-white p-6">
      <img [src]="uploadedDataUrl()" alt="Uploaded signature preview" class="h-24 max-w-full object-contain" />
      <label
        class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
        <ion-icon name="swap-horizontal-outline" class="text-sm"></ion-icon>
        Choose different file
        <input type="file" accept="image/png,image/jpeg" class="hidden" (change)="onFileSelected($event)" />
      </label>
    </div>
    <p *ngIf="uploadError()" class="mt-2 text-xs text-red-500">{{ uploadError() }}</p>
  </div>

  <div class="mt-3 flex items-center justify-between gap-2">
    <button *ngIf="method() === 'draw'" type="button" (click)="expand()"
      class="flex items-center gap-1.5 rounded-full border border-gray-200 px-3 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors">
      <ion-icon name="expand-outline" class="text-sm"></ion-icon>
      Full screen
    </button>
    <span *ngIf="method() !== 'draw'"></span>
    <div class="flex items-center gap-1">
      <button *ngIf="method() === 'draw'" type="button" (click)="undo()" [disabled]="!hasDrawing()"
        class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors disabled:opacity-40">
        <ion-icon name="arrow-undo-outline" class="text-sm"></ion-icon>
        Undo
      </button>
      <button type="button" (click)="clearCurrent()"
        class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
        <ion-icon name="refresh-outline" class="text-sm"></ion-icon>
        Clear
      </button>
    </div>
  </div>
</div>
