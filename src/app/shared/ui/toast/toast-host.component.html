<div class="pointer-events-none fixed bottom-6 left-1/2 z-[60] flex -translate-x-1/2 flex-col items-center gap-2"
  role="status" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track trackById($index, toast)) {
    <div class="toast-item pointer-events-auto flex max-w-[92vw] items-center gap-2.5 rounded-full px-4 py-2.5 text-sm font-medium text-white shadow-lg"
      [class]="pillClass(toast.kind)">
      <ion-icon [name]="iconFor(toast.kind)" class="shrink-0 text-base"></ion-icon>
      <span class="min-w-0">{{ toast.message }}</span>
      <button type="button" (click)="dismiss(toast.id)" aria-label="Dismiss"
        class="ml-1 grid h-5 w-5 shrink-0 place-items-center rounded-full text-white/70 transition-colors hover:bg-white/20 hover:text-white">
        <ion-icon name="close-outline" class="text-sm"></ion-icon>
      </button>
    </div>
  }
</div>
