<section class="mx-auto flex min-h-screen max-w-xl flex-col items-center justify-center px-6 py-16 text-center">
  <span class="mb-6 inline-flex h-16 w-16 items-center justify-center rounded-full bg-amber-50 text-amber-600" aria-hidden="true">
    <ion-icon name="pause-circle-outline" class="text-4xl"></ion-icon>
  </span>

  <h1 class="text-2xl font-semibold text-gray-900">Your seat is suspended</h1>

  <p class="mt-3 max-w-md text-sm text-gray-600">
    An add-on seat your office owns is suspended due to unpaid balance, and your slot is above the current cap.
    The account owner needs to pay or reorder slots.
  </p>

  <p *ngIf="hasSlotInfo()" class="mt-4 rounded-full bg-gray-50 px-4 py-1.5 text-sm font-medium text-gray-700" data-testid="slot-info">
    Slot {{ state()!.slotIndex }} of {{ state()!.effectiveCap }} active
  </p>

  <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
    <a
      [href]="mailtoHref()"
      class="inline-flex items-center gap-2 rounded-xl bg-brand-bold px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-bold/90"
      data-testid="contact-admin"
    >
      <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
      Contact admin
    </a>
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-semibold text-gray-700 transition hover:border-gray-300 hover:bg-gray-50"
      data-testid="try-again"
      (click)="tryAgain()"
    >
      <ion-icon name="refresh-outline" aria-hidden="true"></ion-icon>
      Try again
    </button>
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-semibold text-gray-700 transition hover:border-gray-300 hover:bg-gray-50"
      data-testid="sign-out"
      (click)="signOut()"
    >
      <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
      Sign out
    </button>
  </div>
</section>
