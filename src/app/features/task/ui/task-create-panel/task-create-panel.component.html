<app-modal [isOpen]="isOpen" [heading]="isEditMode() ? 'Edit Task' : 'New Task'"
  [subheading]="isEditMode() ? 'Update the details of this task' : 'Add a task to the board'" size="lg"
  (closed)="close()">
  <div class="mt-5 flex flex-col gap-3">
      <!-- Title -->
      <div class="flex h-11 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
        <input type="text" placeholder="Task title" [ngModel]="title()" name="title"
          (ngModelChange)="title.set($event)"
          class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
      </div>

      <!-- Description -->
      <textarea rows="3" placeholder="Description" [ngModel]="description()" name="description"
        (ngModelChange)="description.set($event)"
        class="w-full resize-none rounded-2xl border border-gray-100 bg-brand-white p-4 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-300 transition-colors"></textarea>

      <!-- Client (picker sobre GET /customers: el backend guarda customerId) -->
      <div class="relative" data-dropdown="task-client">
        <button type="button" (click)="toggleClientDropdown()"
          class="flex h-11 w-full items-center justify-between rounded-full border border-gray-200 bg-white px-4 text-sm font-medium text-gray-900 hover:bg-gray-50 transition-colors">
          <span class="flex items-center gap-2">
            <span class="text-sm text-gray-400">Client</span>
            {{ selectedClient()?.displayName ?? 'No client' }}
          </span>
          <ion-icon name="chevron-down-outline" class="text-sm text-gray-500"></ion-icon>
        </button>
        <div *ngIf="isClientOpen()"
          class="absolute left-0 top-full z-20 mt-2 w-full overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
          <div class="border-b border-gray-100 p-2">
            <input type="text" placeholder="Search clients" [ngModel]="clientSearch()" name="clientSearch"
              (ngModelChange)="clientSearch.set($event)" (click)="$event.stopPropagation()"
              class="h-9 w-full rounded-full border border-gray-200 bg-white px-3 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none" />
          </div>
          <div class="max-h-52 overflow-y-auto">
            <button type="button" (click)="selectClient(null)"
              class="flex w-full items-center justify-between px-4 py-2.5 text-sm text-gray-500 hover:bg-gray-50 transition-colors">
              No client
              <ion-icon *ngIf="selectedClient() === null" name="checkmark-outline"
                class="text-sm text-gray-900"></ion-icon>
            </button>
            <button *ngFor="let client of filteredClients()" type="button" (click)="selectClient(client)"
              class="flex w-full items-center justify-between px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              <span class="min-w-0 truncate text-left">
                {{ client.displayName }}
                <span class="block truncate text-xs text-gray-400">{{ client.primaryEmail }}</span>
              </span>
              <ion-icon *ngIf="client.id === selectedClient()?.id" name="checkmark-outline"
                class="text-sm text-gray-900"></ion-icon>
            </button>
            <p *ngIf="filteredClients().length === 0" class="px-4 py-3 text-sm text-gray-400">No clients found</p>
          </div>
        </div>
      </div>

      <!-- Due date -->
      <label
        class="flex h-11 items-center gap-2 rounded-full border border-gray-200 bg-white px-4 cursor-pointer focus-within:border-gray-300 transition-colors">
        <span class="text-sm text-gray-400">Due</span>
        <input type="date" [ngModel]="dueDate()" name="dueDate" (ngModelChange)="dueDate.set($event)"
          class="w-full bg-transparent text-sm text-gray-700 focus:outline-none cursor-pointer" />
      </label>

      <div class="grid grid-cols-2 gap-3">
        <!-- Priority dropdown -->
        <div class="relative" data-dropdown="task-priority">
          <button type="button" (click)="togglePriorityDropdown()"
            class="flex h-11 w-full items-center justify-between rounded-full border border-gray-200 bg-white px-4 text-sm font-medium text-gray-900 hover:bg-gray-50 transition-colors">
            <span>{{ priority() }}</span>
            <ion-icon name="chevron-down-outline" class="text-sm text-gray-500"></ion-icon>
          </button>
          <div *ngIf="isPriorityOpen()"
            class="absolute left-0 top-full z-20 mt-2 w-full overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
            <button *ngFor="let option of priorities" type="button" (click)="selectPriority(option)"
              class="flex w-full items-center justify-between px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              {{ option }}
              <ion-icon *ngIf="option === priority()" name="checkmark-outline" class="text-sm text-gray-900"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Status dropdown -->
        <div class="relative" data-dropdown="task-status">
          <button type="button" (click)="toggleStatusDropdown()"
            class="flex h-11 w-full items-center justify-between rounded-full border border-gray-200 bg-white px-4 text-sm font-medium text-gray-900 hover:bg-gray-50 transition-colors">
            <span>{{ statusLabel(status()) }}</span>
            <ion-icon name="chevron-down-outline" class="text-sm text-gray-500"></ion-icon>
          </button>
          <div *ngIf="isStatusOpen()"
            class="absolute left-0 top-full z-20 mt-2 w-full overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
            <button *ngFor="let option of statuses" type="button" (click)="selectStatus(option.id)"
              class="flex w-full items-center justify-between px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              {{ option.label }}
              <ion-icon *ngIf="option.id === status()" name="checkmark-outline" class="text-sm text-gray-900"></ion-icon>
            </button>
          </div>
        </div>
      </div>

      <!-- Waiting on Client: el backend exige detallar lo pedido (viaja al correo del cliente) -->
      <div *ngIf="status() === 'waiting'" class="flex flex-col gap-1">
        <textarea rows="2" placeholder="What are you waiting for from the client? (required)"
          [ngModel]="expectedItems()" name="expectedItems" (ngModelChange)="expectedItems.set($event)"
          class="w-full resize-none rounded-2xl border border-gray-100 bg-brand-white p-4 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-300 transition-colors"></textarea>
        <p class="px-2 text-xs text-gray-400">
          "Waiting on Client" also requires a client selected — they get notified about the requested items.
        </p>
      </div>

      <!-- Assignee (type-ahead sobre el directorio de empleados) -->
      <div class="relative" data-dropdown="task-assignee">
        <button type="button" (click)="toggleAssigneeDropdown()"
          class="flex h-11 w-full items-center justify-between rounded-full border border-gray-200 bg-white px-4 text-sm font-medium text-gray-900 hover:bg-gray-50 transition-colors">
          <span class="flex items-center gap-2">
            <span class="flex h-6 w-6 items-center justify-center rounded-full text-[10px] font-semibold text-white"
              [ngClass]="assigneeColor()">
              {{ assigneeInitials() }}
            </span>
            {{ assignee()?.displayName ?? 'Unassigned' }}
          </span>
          <ion-icon name="chevron-down-outline" class="text-sm text-gray-500"></ion-icon>
        </button>
        <div *ngIf="isAssigneeOpen()"
          class="absolute left-0 top-full z-20 mt-2 w-full overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
          <div class="border-b border-gray-100 p-2">
            <input type="text" placeholder="Search team members" [ngModel]="assigneeSearch()" name="assigneeSearch"
              (ngModelChange)="onAssigneeSearch($event)" (click)="$event.stopPropagation()"
              class="h-9 w-full rounded-full border border-gray-200 bg-white px-3 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none" />
          </div>
          <div class="max-h-52 overflow-y-auto">
            <button type="button" (click)="selectAssignee(null)"
              class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-gray-500 hover:bg-gray-50 transition-colors">
              <span
                class="flex h-6 w-6 items-center justify-center rounded-full bg-gray-300 text-[10px] font-semibold text-white">—</span>
              Unassigned
              <ion-icon *ngIf="assignee() === null" name="checkmark-outline"
                class="ml-auto text-sm text-gray-900"></ion-icon>
            </button>
            <button *ngFor="let member of assigneeResults()" type="button"
              (click)="selectAssignee({ userId: member.userId, displayName: member.displayName })"
              class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              <span class="flex h-6 w-6 items-center justify-center rounded-full text-[10px] font-semibold text-white"
                [ngClass]="colorOf(member.userId)">
                {{ initialsOf(member.displayName) }}
              </span>
              <span class="min-w-0 truncate text-left">
                {{ member.displayName }}
                <span class="block truncate text-xs text-gray-400">{{ member.email }}</span>
              </span>
              <ion-icon *ngIf="member.userId === assignee()?.userId" name="checkmark-outline"
                class="ml-auto text-sm text-gray-900"></ion-icon>
            </button>
            <p *ngIf="assigneeSearch().trim() && assigneeResults().length === 0"
              class="px-4 py-3 text-sm text-gray-400">No matches</p>
            <p *ngIf="!assigneeSearch().trim() && assigneeResults().length === 0"
              class="px-4 py-3 text-sm text-gray-400">Type to search the directory</p>
          </div>
        </div>
      </div>

      <!-- Cancelar tarea (solo edición, razón obligatoria para el backend) -->
      <div *ngIf="isCancelOpen()" class="flex flex-col gap-2 rounded-2xl border border-red-100 bg-red-50 p-4">
        <p class="text-sm font-medium text-red-700">Cancel this task</p>
        <input type="text" placeholder="Reason (required)" [ngModel]="cancelReason()" name="cancelReason"
          (ngModelChange)="cancelReason.set($event)"
          class="h-10 w-full rounded-full border border-red-200 bg-white px-4 text-sm text-gray-700 placeholder-gray-400 focus:border-red-300 focus:outline-none" />
        <div class="flex justify-end gap-2">
          <button type="button" (click)="toggleCancelTask()"
            class="rounded-full px-4 py-1.5 text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
            Keep task
          </button>
          <button type="button" (click)="confirmCancelTask()" [disabled]="!cancelReason().trim() || busy"
            class="rounded-full bg-red-600 px-4 py-1.5 text-sm font-semibold text-white hover:bg-red-500 disabled:opacity-50 transition-colors">
            Cancel task
          </button>
        </div>
      </div>

      <!-- Error del último guardado/acción -->
      <p *ngIf="errorMessage" class="px-2 text-sm text-red-600">{{ errorMessage }}</p>
    </div>

  <div class="mt-5 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <ng-container *ngIf="isEditMode()">
        <button type="button" (click)="requestDelete()" [disabled]="busy"
          class="rounded-full px-4 py-2 text-sm font-medium transition-colors disabled:opacity-50"
          [ngClass]="isDeleteArmed() ? 'bg-red-600 text-white hover:bg-red-500' : 'text-red-600 hover:bg-red-50'">
          {{ isDeleteArmed() ? 'Confirm delete' : 'Delete' }}
        </button>
        <button *ngIf="canCancelTask() && !isCancelOpen()" type="button" (click)="toggleCancelTask()" [disabled]="busy"
          class="rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors disabled:opacity-50">
          Cancel task…
        </button>
      </ng-container>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" (click)="close()"
        class="rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
        Cancel
      </button>
      <button type="button" (click)="save()" [disabled]="!canSave() || busy"
        class="rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink disabled:opacity-50 disabled:hover:bg-brand-bold transition-colors">
        {{ busy ? 'Saving…' : isEditMode() ? 'Save changes' : 'Create task' }}
      </button>
    </div>
  </div>
</app-modal>
