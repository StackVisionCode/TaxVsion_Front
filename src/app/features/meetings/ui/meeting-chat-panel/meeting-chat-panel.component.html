<div class="flex h-full min-h-0 flex-col bg-white">
  <div class="flex items-center justify-between border-b border-gray-100 px-4 py-3">
    <h3 class="text-sm font-bold text-gray-900">Meeting chat</h3>
    <button type="button" (click)="closed.emit()" aria-label="Close chat"
      class="flex h-8 w-8 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 transition-colors">
      <ion-icon name="close-outline" class="text-lg"></ion-icon>
    </button>
  </div>

  <div #scroller class="flex-1 overflow-y-auto px-4 py-3">
    <div class="flex flex-col gap-3">
      @for (m of messages; track m.id) {
        <div class="flex flex-col" [class.items-end]="m.isMine">
          @if (!m.isMine) {
            <span class="mb-0.5 flex max-w-[85%] items-center gap-1.5 text-[11px] font-medium text-gray-500">
              <span class="truncate" [title]="m.senderName">{{ m.senderName }}</span>
              @if (m.senderRole) {
                <span class="shrink-0 rounded-full bg-indigo-50 px-1.5 py-px text-[10px] font-semibold text-brand-bold">{{ m.senderRole }}</span>
              }
            </span>
          }
          <div class="max-w-[85%] rounded-2xl px-3 py-2 text-sm"
            [class]="m.isMine ? 'rounded-br-md bg-brand-bold text-white' : 'rounded-bl-md border border-gray-100 bg-gray-50 text-gray-700'">
            <span class="whitespace-pre-line break-words">{{ m.text }}</span>
          </div>
          <span class="mt-0.5 text-[10px] text-gray-400">{{ m.time }}</span>
        </div>
      }
    </div>
    @if (messages.length === 0) {
      <p class="py-10 text-center text-xs text-gray-400">No messages yet. Say hi 👋</p>
    }
  </div>

  <form class="flex items-center gap-2 border-t border-gray-100 p-3" (ngSubmit)="submit()">
    <input type="text" name="chatDraft" placeholder="Message everyone…" [ngModel]="draft()"
      (ngModelChange)="draft.set($event)" autocomplete="off" maxlength="4000"
      class="h-10 min-w-0 flex-1 rounded-full border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-300" />
    <button type="submit" [disabled]="!draft().trim()" aria-label="Send message"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand-bold text-white hover:bg-brand-ink disabled:opacity-40 transition-colors">
      <ion-icon name="send-outline" class="text-base"></ion-icon>
    </button>
  </form>
</div>
