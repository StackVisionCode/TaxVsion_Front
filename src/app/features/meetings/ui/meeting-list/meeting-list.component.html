<div class="flex flex-col gap-3">
  <div *ngIf="meetings.length === 0" class="rounded-2xl border border-gray-100 p-8 text-center text-sm text-gray-500">
    No meetings found.
  </div>

  <div *ngFor="let meeting of meetings; trackBy: trackByMeetingId" (click)="onRowClick(meeting)"
    class="rounded-2xl border border-gray-100 p-4 transition-colors"
    [ngClass]="canManage(meeting) ? 'cursor-pointer hover:bg-gray-50' : ''">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-2">
          <p class="truncate text-sm font-semibold text-gray-900">{{ meeting.title }}</p>
          <span class="flex items-center rounded-full border px-2.5 py-0.5 text-xs font-medium"
            [ngClass]="{
              'border-indigo-200 text-indigo-600': meeting.status === 'upcoming',
              'border-emerald-200 text-emerald-600': meeting.status === 'live',
              'border-gray-200 text-gray-500': meeting.status === 'ended',
              'border-red-200 text-red-500': meeting.status === 'cancelled'
            }">
            <span *ngIf="meeting.status === 'live'"
              class="mr-1.5 h-1.5 w-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
            {{ statusLabel(meeting.status) }}
          </span>
        </div>

        <!-- Código de sala: es lo que se comparte para entrar por /by-code -->
        <button type="button" (click)="onCopyCodeClick(meeting, $event)" title="Copy meeting code"
          class="mt-1 flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 transition-colors">
          <span class="font-mono tracking-wide">{{ meeting.shortCode }}</span>
          <ion-icon name="copy-outline" class="text-sm"></ion-icon>
        </button>

        <div class="mt-2 flex flex-wrap items-center gap-3 text-xs text-gray-500">
          <span class="flex items-center gap-1">
            <ion-icon name="calendar-outline" class="text-sm"></ion-icon>
            {{ formatDateTime(meeting.scheduledAt) }}
          </span>
          <span *ngIf="meeting.durationMinutes !== null" class="flex items-center gap-1">
            <ion-icon name="time-outline" class="text-sm"></ion-icon>
            {{ formatDuration(meeting.durationMinutes) }}
          </span>
          <span *ngIf="meeting.joinedCount > 0" class="flex items-center gap-1">
            <ion-icon name="people-outline" class="text-sm"></ion-icon>
            {{ meeting.joinedCount }} joined
          </span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Start: host-only sobre un meeting Scheduled (POST /meetings/:id/start) -->
        <button *ngIf="meeting.status === 'upcoming' && meeting.isHost" type="button"
          (click)="onStartClick(meeting, $event)" [disabled]="isBusy(meeting)"
          class="rounded-full bg-brand-bold px-4 py-2 text-xs font-semibold text-white hover:bg-brand-ink disabled:opacity-50 transition-colors">
          {{ isBusy(meeting) ? 'Starting…' : 'Start' }}
        </button>

        <!-- Join: entra a la sala (Socket.IO), disponible para cualquiera en un meeting Live -->
        <button *ngIf="meeting.status === 'live'" type="button"
          (click)="onJoinClick(meeting, $event)"
          class="flex items-center gap-1.5 rounded-full bg-brand-bold px-4 py-2 text-xs font-semibold text-white hover:bg-brand-ink transition-colors">
          <ion-icon name="videocam-outline" class="text-sm"></ion-icon>
          Join
        </button>

        <!-- End: termina el meeting para todos (POST /meetings/:id/end) -->
        <button *ngIf="meeting.status === 'live' && meeting.isHost" type="button"
          (click)="onEndClick(meeting, $event)" [disabled]="isBusy(meeting)"
          class="rounded-full border border-red-200 px-4 py-2 text-xs font-semibold text-red-500 hover:bg-red-50 disabled:opacity-50 transition-colors">
          {{ isBusy(meeting) ? 'Ending…' : 'End meeting' }}
        </button>

        <!-- Transcript disponible (CloudStorage) en meetings terminadas -->
        <button *ngIf="meeting.status === 'ended' && meeting.transcriptFileId" type="button"
          (click)="onTranscriptClick(meeting, $event)" [disabled]="isBusy(meeting)"
          class="rounded-full border border-gray-200 px-4 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-100 disabled:opacity-50 transition-colors">
          Transcript
        </button>

        <!-- Menú: solo host + Scheduled (reschedule/cancel son host-only y solo desde Scheduled) -->
        <div *ngIf="canManage(meeting)" class="relative" data-dropdown="meeting-menu">
          <button type="button" (click)="toggleMenu(meeting, $event)"
            class="flex h-9 w-9 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-900 transition-colors"
            aria-label="Meeting options">
            <ion-icon name="ellipsis-horizontal-outline" class="text-base"></ion-icon>
          </button>
          <div *ngIf="openMenuId() === meeting.id"
            class="absolute right-0 top-full z-20 mt-2 w-44 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
            <button type="button" (click)="onManageClick(meeting, $event)"
              class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              <ion-icon name="create-outline" class="text-base"></ion-icon>
              Manage
            </button>
            <button type="button" (click)="onCancelClick(meeting, $event)"
              class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-red-500 hover:bg-gray-50 transition-colors">
              <ion-icon name="close-circle-outline" class="text-base"></ion-icon>
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
