<div class="min-h-full pt-3 pb-1 flex flex-col gap-6">
  <app-settings-module-grid [selectedId]="selectedModuleId()" (moduleSelected)="selectModule($event)">
  </app-settings-module-grid>

  @if (selectedModuleId(); as moduleId) {
    <app-settings-panel [moduleId]="moduleId" [moduleTitle]="selectedModuleTitle()"></app-settings-panel>
  }
</div>
