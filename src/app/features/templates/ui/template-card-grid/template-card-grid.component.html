<div class="grid gap-4 grid-cols-[repeat(auto-fill,minmax(240px,1fr))]">
  <div *ngFor="let template of templates; trackBy: trackByTemplateId" (click)="onPreviewClick(template)"
    class="group cursor-pointer rounded-2xl border border-gray-100 p-4 hover:border-gray-200 hover:shadow-sm transition">
    <div class="flex items-start justify-between">
      <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full"
        [ngClass]="categoryCircle(template.category)">
        <ion-icon [name]="categoryIcon(template.category)" class="text-lg text-gray-700"></ion-icon>
      </span>

      <!-- Las plantillas System son de plataforma: sin acciones para el tenant -->
      <app-dropdown-menu *ngIf="template.isEditable" ariaLabel="Template options" panelClass="w-40">
        <button appMenuItem type="button" (click)="editRequested.emit(template)">
          <ion-icon name="create-outline" class="text-base"></ion-icon>
          Edit
        </button>
        <!-- Publicar solo tiene sentido si aún no está activa -->
        <button *ngIf="template.status !== 'published'" appMenuItem type="button" (click)="publishRequested.emit(template)">
          <ion-icon name="cloud-upload-outline" class="text-base"></ion-icon>
          Publish
        </button>
        <button *ngIf="template.status !== 'archived'" appMenuItem [danger]="true" type="button"
          (click)="archiveRequested.emit(template)">
          <ion-icon name="archive-outline" class="text-base"></ion-icon>
          Archive
        </button>
      </app-dropdown-menu>

      <span *ngIf="!template.isEditable"
        class="rounded-full border border-gray-200 px-2.5 py-0.5 text-[10px] font-medium text-gray-400">
        System
      </span>
    </div>

    <p class="mt-3 text-sm font-semibold text-gray-900 truncate">{{ template.name }}</p>
    <p class="mt-0.5 text-xs text-gray-500 truncate">{{ template.subject }}</p>

    <div class="mt-2 flex flex-wrap items-center gap-1.5">
      <span class="inline-block rounded-full border px-2.5 py-0.5 text-xs font-medium"
        [ngClass]="categoryChip(template.category)">
        {{ template.category }}
      </span>
      <app-status-pill [tone]="statusPill[template.status].tone" [dotClass]="statusPill[template.status].dotClass ?? ''">
        {{ statusLabel[template.status] }}
      </app-status-pill>
    </div>

    <p class="mt-3 text-xs text-gray-400">Updated {{ formatDate(template.updatedAt) }}</p>
  </div>
</div>

<app-state-block *ngIf="templates.length === 0" [empty]="true" variant="inline" icon="search-outline"
  [emptyTitle]="emptyMessage" />
