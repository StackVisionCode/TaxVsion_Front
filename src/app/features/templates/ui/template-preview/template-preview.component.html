<div class="bg-white rounded-[28px] p-6" *ngIf="template as tpl">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <button type="button" (click)="goBack()"
        class="-ml-3 flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
        <ion-icon name="arrow-back-outline" class="text-base"></ion-icon>
        Back to templates
      </button>
      <h2 class="mt-3 text-2xl font-bold text-gray-900">{{ tpl.name }}</h2>
      <p class="mt-1 text-sm text-gray-500">{{ tpl.subject }}</p>
      <div class="mt-2 flex flex-wrap items-center gap-2">
        <span class="inline-block rounded-full border px-3 py-0.5 text-xs font-medium"
          [ngClass]="categoryChip(tpl.category)">
          {{ tpl.category }}
        </span>
        <span class="inline-flex items-center gap-2 rounded-full border px-3 py-0.5 text-xs font-medium"
          [ngClass]="statusChip(tpl.status)">
          <span class="h-1.5 w-1.5 rounded-full" [ngClass]="statusDot(tpl.status)"></span>
          {{ statusLabel(tpl.status) }}
        </span>
        <span *ngIf="!tpl.isEditable"
          class="inline-block rounded-full border border-gray-200 px-3 py-0.5 text-xs font-medium text-gray-400">
          System template
        </span>
      </div>
      <p class="mt-2 flex items-center gap-1 text-sm text-gray-500">
        <ion-icon name="time-outline" class="text-sm"></ion-icon>
        Updated {{ formatDate(tpl.updatedAt) }}
      </p>
    </div>

    <!-- Las System son de plataforma: no se editan desde el tenant -->
    <div class="flex items-center gap-2">
      <button *ngIf="tpl.isEditable" type="button" (click)="edit(tpl)"
        class="flex items-center gap-2 rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink transition-colors">
        <ion-icon name="create-outline" class="text-base"></ion-icon>
        Edit
      </button>
    </div>
  </div>

  <!-- Variables declaradas en la plantilla -->
  <div *ngIf="tpl.variables.length > 0" class="mt-5">
    <p class="text-xs font-semibold uppercase tracking-wide text-gray-400">Variables</p>
    <div class="mt-2 flex flex-wrap gap-1.5">
      <span *ngFor="let variable of tpl.variables"
        class="rounded-full bg-brand-white px-3 py-1 font-mono text-xs text-gray-600">
        {{ variable }}
      </span>
    </div>
  </div>

  <div *ngIf="tpl.description" class="mt-4 text-sm text-gray-600">{{ tpl.description }}</div>

  <!-- Cuerpo: se descarga de CloudStorage, por eso tiene estados propios -->
  <div class="mt-6 rounded-2xl border border-gray-100 bg-brand-white p-5">
    <p class="text-xs font-semibold uppercase tracking-wide text-gray-400">Body</p>

    <div *ngIf="bodyLoading" class="mt-3 flex items-center gap-2 text-sm text-gray-400">
      <ion-icon name="sync-outline" class="animate-spin text-base"></ion-icon>
      Loading content…
    </div>

    <div *ngIf="!bodyLoading && bodyError as err" class="mt-3 flex flex-col items-start gap-2">
      <p class="text-sm text-red-600">{{ err }}</p>
      <button type="button" (click)="retry(tpl)"
        class="rounded-full border border-gray-200 px-4 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
        Retry
      </button>
    </div>

    <ng-container *ngIf="!bodyLoading && !bodyError">
      <pre *ngIf="body"
        class="mt-2 max-h-[420px] overflow-auto whitespace-pre-wrap break-words font-mono text-sm leading-relaxed text-gray-700">{{ body }}</pre>
      <p *ngIf="!body" class="mt-2 text-sm text-gray-400">
        This template has no published content yet.
      </p>
    </ng-container>
  </div>
</div>
