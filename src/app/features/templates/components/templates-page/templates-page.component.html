<div class="min-h-full pt-3 pb-1 flex flex-col gap-6">
  <ng-container *ngIf="!previewTemplate(); else previewView">
    <a routerLink="/settings"
      class="-ml-3 flex w-fit items-center gap-1 rounded-full px-3 py-1.5 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
      <ion-icon name="arrow-back-outline" class="text-base"></ion-icon>
      Back to settings
    </a>

    <!-- Stats row -->
    <div class="grid gap-4 grid-cols-[repeat(auto-fit,minmax(170px,1fr))]">
      <div class="rounded-[24px] bg-indigo-50 p-5">
        <p class="text-sm text-gray-600">Total templates</p>
        <p class="mt-2 text-3xl font-bold text-gray-900">{{ totalCount() }}</p>
      </div>
      <div class="rounded-[24px] bg-indigo-100 p-5">
        <p class="text-sm text-gray-600">Published</p>
        <p class="mt-2 text-3xl font-bold text-gray-900">{{ publishedCount() }}</p>
      </div>
      <div class="rounded-[24px] bg-gray-200 p-5">
        <p class="text-sm text-gray-600">Drafts</p>
        <p class="mt-2 text-3xl font-bold text-gray-900">{{ draftCount() }}</p>
      </div>
    </div>

    <!-- Templates card -->
    <div class="bg-white rounded-[28px] p-6">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-gray-900">Templates</h2>
          <p class="mt-1 text-sm text-gray-500">Reusable email content for your firm's campaigns</p>
        </div>
        <button type="button" (click)="openCreatePanel()"
          class="flex items-center gap-2 rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink transition-colors">
          <ion-icon name="add-outline" class="text-base"></ion-icon>
          New template
        </button>
      </div>

      <!-- Filter bar (categorías reales; el backend las guarda como texto libre) -->
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button *ngFor="let filter of categoryFilters()" type="button" (click)="setCategoryFilter(filter)"
          class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
          [ngClass]="categoryFilter() === filter ? 'bg-brand-bold text-white' : 'border border-gray-200 text-gray-500 hover:bg-gray-100'">
          {{ filter }}
        </button>

        <div
          class="ml-auto flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
          <ion-icon name="search-outline" class="mr-2 text-base text-gray-400"></ion-icon>
          <input type="text" placeholder="Search templates" [ngModel]="search()" name="search"
            (ngModelChange)="search.set($event)"
            class="h-full w-48 bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
        </div>
      </div>

      <!-- Error transitorio de una acción (publicar/archivar) -->
      <div *ngIf="store.actionError() as actionErr"
        class="mt-4 flex items-center justify-between gap-3 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3">
        <p class="text-sm text-amber-800">{{ actionErr }}</p>
        <button type="button" (click)="dismissActionError()"
          class="shrink-0 text-sm font-medium text-amber-800 hover:text-amber-950 transition-colors">
          Dismiss
        </button>
      </div>

      <!-- Estados de carga / error -->
      <div *ngIf="store.loading()" class="mt-5 flex items-center justify-center gap-2 py-10 text-sm text-gray-400">
        <ion-icon name="sync-outline" class="animate-spin text-base"></ion-icon>
        Loading templates…
      </div>

      <div *ngIf="!store.loading() && store.error() as err"
        class="mt-5 flex flex-col items-center gap-3 rounded-2xl border border-red-100 bg-red-50 px-6 py-8 text-center">
        <p class="text-sm text-red-600">{{ err }}</p>
        <button type="button" (click)="retryLoad()"
          class="rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink transition-colors">
          Retry
        </button>
      </div>

      <!-- Grid -->
      <div *ngIf="!store.loading() && !store.error()" class="mt-5">
        <app-template-card-grid [templates]="visibleTemplates()" [emptyMessage]="emptyMessage()"
          (previewRequested)="openPreview($event)" (editRequested)="openEditPanel($event)"
          (publishRequested)="publishTemplate($event)"
          (archiveRequested)="archiveTemplate($event)"></app-template-card-grid>
      </div>
    </div>
  </ng-container>

  <ng-template #previewView>
    <app-template-preview [template]="previewTemplate()" [body]="activeBody()" [bodyLoading]="store.bodyLoading()"
      [bodyError]="store.bodyError()" (back)="closePreview()" (editRequested)="editFromPreview($event)"
      (retryBody)="reloadBody($event)"></app-template-preview>
  </ng-template>
</div>

<!-- Create / edit overlay (guardar crea una versión nueva) -->
<app-template-form-panel [isOpen]="isPanelOpen()" [template]="editingTemplate()" [body]="activeBody()"
  [bodyLoading]="store.bodyLoading()" [saving]="panelSaving()" [errorMessage]="panelError()" (closed)="closePanel()"
  (saved)="handleSaved($event)"></app-template-form-panel>

<!-- Archive confirmation (el backend no borra plantillas) -->
<app-confirm-dialog [isOpen]="!!pendingArchive()" heading="Archive template?" [message]="archiveMessage()"
  confirmLabel="Archive" (confirmed)="confirmArchive()"
  (cancelled)="pendingArchive.set(null)"></app-confirm-dialog>
