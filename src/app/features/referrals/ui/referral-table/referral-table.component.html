<div class="overflow-x-auto">
  <table class="w-full min-w-[720px] border-separate border-spacing-0 text-sm">
    <thead>
      <tr>
        <th class="rounded-l-2xl bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Name</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Email</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Date</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Status</th>
        <th class="rounded-r-2xl bg-brand-white px-4 py-3 text-right font-semibold text-gray-900">Reward</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let referral of referrals; trackBy: trackByReferralId; let last = last" class="group">
        <td class="rounded-l-2xl px-4 py-3.5 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          <span class="flex items-center gap-3">
            <app-avatar [name]="referral.name" [seed]="referral.id" [colorClass]="referral.avatarColor"
              sizeClass="h-9 w-9 text-xs"></app-avatar>
            <span class="font-medium text-gray-900">{{ referral.name }}</span>
          </span>
        </td>
        <td class="px-4 py-3.5 text-gray-500 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          {{ referral.email }}
        </td>
        <td class="px-4 py-3.5 text-gray-500 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          {{ referral.date }}
        </td>
        <td class="px-4 py-3.5 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          <app-status-pill [tone]="statusTone(referral.status)">{{ statusLabel(referral.status) }}</app-status-pill>
        </td>
        <td class="rounded-r-2xl px-4 py-3.5 text-right font-bold transition-colors group-hover:bg-gray-50"
          [class.border-b]="!last" [class.border-gray-100]="!last"
          [ngClass]="referral.amount > 0 ? 'text-gray-900' : 'text-gray-300'">
          {{ referral.amount > 0 ? (referral.amount | money: 'USD' : { minFraction: 0 }) : '—' }}
        </td>
      </tr>
    </tbody>
  </table>

  <app-state-block *ngIf="referrals.length === 0" variant="inline" [empty]="true" icon="people-outline"
    [emptyTitle]="emptyMessage"></app-state-block>
</div>
