<div class="bg-white rounded-[28px] p-6 h-full">
  <!-- Header -->
  <div class="flex flex-wrap items-start justify-between gap-2">
    <div>
      <h2 class="text-xl font-bold text-gray-900">Revenue Collected</h2>
      <p class="mt-1 text-sm text-gray-500">Last 6 months</p>
    </div>

    <div *ngIf="!loading() && !error() && !isEmpty()" class="text-right">
      <div class="text-3xl font-bold text-gray-900">{{ totalLabel() }}</div>
      <!-- El chip solo aparece cuando el mes anterior tuvo cobros: sin base no hay porcentaje -->
      <span *ngIf="growthPercent() !== null" class="mt-1 inline-flex items-center gap-1 text-sm font-medium"
        [ngClass]="growthPercent()! >= 0 ? 'text-emerald-600' : 'text-red-500'">
        <ion-icon [name]="growthPercent()! >= 0 ? 'trending-up-outline' : 'trending-down-outline'"
          class="text-sm"></ion-icon>
        {{ growthLabel() }}
      </span>
    </div>
  </div>

  <!-- Cargando / sin permiso o error de Billing / todavía sin facturas -->
  <app-dashboard-widget-state *ngIf="loading() || error() || isEmpty()" [loading]="loading()" [error]="error()"
    errorTitle="Revenue isn't available" icon="cash-outline" title="No revenue recorded yet"
    message="Once invoices are issued and paid, collected revenue shows up here."
    minHeight="15rem"></app-dashboard-widget-state>

  <ng-container *ngIf="!loading() && !error() && !isEmpty()">
    <!-- Pill bar chart: importes reales cobrados por mes -->
    <div #chartTrack class="relative mt-6 flex items-end justify-around gap-2 min-h-[13rem] pt-8">
      <div *ngFor="let bar of bars(); let i = index"
        class="flex h-full min-w-0 flex-1 flex-col items-center justify-end gap-2" (mouseenter)="onBarEnter(i)">
        <div #barBox class="relative flex h-44 w-full max-w-[2.75rem] items-end justify-center">
          <div class="w-full rounded-full revenue-bar" [ngClass]="barStyleClass(bar, i)"
            [style.height.%]="barHeight(bar)"></div>
        </div>

        <span class="text-sm text-gray-500">{{ bar.label }}</span>
      </div>

      <!-- Tooltip deslizante: un solo elemento persistente cuya posición se
           anima (mismo patrón que el pill activo del sidebar), en vez de
           montar/desmontar un tooltip nuevo por barra. -->
      <div *ngIf="tooltipReady() && tooltipBar() as bar"
        class="chart-tooltip pointer-events-none absolute z-10 flex -translate-x-1/2 -translate-y-full flex-col items-center"
        [style.left.px]="tooltipLeft()" [style.top.px]="tooltipTop()">
        <span class="whitespace-nowrap rounded-full bg-brand-bold px-3 py-1.5 text-xs font-semibold text-white shadow-md">
          {{ tooltipLabel(bar) }}
        </span>
        <span class="mt-1 h-2 w-2 rounded-full bg-white ring-2 ring-gray-900"></span>
      </div>
    </div>

    <!-- Collected / Outstanding / Drafts: las tres únicas categorías que el contrato de Billing permite derivar -->
    <div class="mt-6 flex flex-wrap items-center justify-around gap-4 border-t border-gray-100 pt-4">
      <div *ngFor="let item of summary()" class="flex items-center gap-2">
        <span class="h-1.5 w-1.5 rounded-full" [ngClass]="item.dot"></span>
        <span class="text-sm text-gray-500">{{ item.label }}</span>
        <span class="text-sm font-bold text-gray-900">{{ item.value }}</span>
      </div>
    </div>
  </ng-container>
</div>
