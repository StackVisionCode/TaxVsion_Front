<!-- Cargando: misma altura mínima que el contenido para que la grilla no salte -->
<div *ngIf="loading" class="flex flex-col items-center justify-center gap-2 px-6 text-center"
  [style.min-height]="minHeight">
  <ion-icon name="sync-outline" class="animate-spin text-base text-gray-400"></ion-icon>
  <p class="text-sm text-gray-400">Loading…</p>
</div>

<!-- Error del backend (permiso, servicio caído…): se muestra el mensaje real, sin datos de relleno -->
<div *ngIf="!loading && error" class="flex flex-col items-center justify-center gap-2 px-6 text-center"
  [style.min-height]="minHeight">
  <span class="flex h-11 w-11 items-center justify-center rounded-full bg-orange-50 text-orange-500">
    <ion-icon name="alert-circle-outline" class="text-xl"></ion-icon>
  </span>
  <p class="text-sm font-medium text-gray-500">{{ errorTitle }}</p>
  <p class="max-w-xs text-xs text-gray-400">{{ error }}</p>
</div>

<!-- Vacío: sin cifras inventadas, solo el hecho de que todavía no hay nada -->
<div *ngIf="!loading && !error" class="flex flex-col items-center justify-center gap-2 px-6 text-center"
  [style.min-height]="minHeight">
  <span class="flex h-11 w-11 items-center justify-center rounded-full bg-indigo-50 text-gray-500">
    <ion-icon [name]="icon" class="text-xl"></ion-icon>
  </span>
  <p class="text-sm font-medium text-gray-500">{{ title }}</p>
  <p *ngIf="message" class="max-w-xs text-xs text-gray-400">{{ message }}</p>
</div>
