<div class="flex flex-col gap-1">
  <div *ngFor="let notification of notifications; trackBy: trackByNotificationId"
    (click)="onRowClick(notification)"
    class="group relative flex cursor-pointer items-center gap-3 rounded-2xl border border-gray-100 px-4 py-3.5 transition-colors hover:bg-gray-50"
    [ngClass]="[notification.isRead ? 'bg-white' : 'bg-brand-white', isSelected(notification) ? 'ring-2 ring-brand-bold ring-offset-1' : '']">

    <!-- Selection checkbox (solo cuando selectable=true) -->
    <input *ngIf="selectable"
      type="checkbox"
      class="shrink-0 h-4 w-4 cursor-pointer rounded border-gray-300 text-brand-bold focus:ring-brand-bold"
      [checked]="isSelected(notification)"
      (click)="onCheckboxClick($event, notification)"
      [attr.aria-label]="'Select notification: ' + notification.title" />

    <!-- Icon / avatar circle: iniciales del actor cuando el backend las mandó, ion-icon si no.
         Mantiene el fondo gris/rojo del tipo para preservar el canal visual de "attention". -->
    <app-avatar *ngIf="actorPhotoFor(notification) as photo; else circleTpl" [name]="notification.actorDisplayName"
      [seed]="notification.actorUserId" [imageUrl]="photo" size="md" [attr.title]="notification.actorDisplayName || null" />
    <ng-template #circleTpl>
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
      [ngClass]="[iconBgFor(notification.type), iconTextFor(notification.type)]"
      [attr.aria-label]="notification.actorDisplayName || null"
      [attr.title]="notification.actorDisplayName || null">
      <ng-container *ngIf="initialsFor(notification) as initials; else iconTpl">
        <span class="text-xs font-bold tracking-wide">{{ initials }}</span>
      </ng-container>
      <ng-template #iconTpl>
        <ion-icon [name]="iconFor(notification.type)" class="text-lg"></ion-icon>
      </ng-template>
    </span>
    </ng-template>

    <!-- Info -->
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <span *ngIf="!notification.isRead" class="h-1.5 w-1.5 shrink-0 rounded-full bg-indigo-600"></span>
        <p class="truncate text-sm text-gray-900" [ngClass]="!notification.isRead ? 'font-bold' : 'font-medium'">
          {{ notification.title }}
        </p>
      </div>
      <p class="mt-0.5 truncate text-sm text-gray-500">{{ notification.message }}</p>
    </div>

    <!-- Relative time -->
    <time
      class="shrink-0 text-xs text-gray-400"
      [attr.datetime]="notification.occurredAtUtc || notification.createdAtUtc"
      [attr.title]="absoluteTime(notification)"
    >{{ relativeTime(notification) }}</time>

    <!-- Ghost "..." menu — solo para no leídas (la única acción HTTP del backend es mark-as-read) -->
    <app-dropdown-menu *ngIf="!notification.isRead" class="shrink-0" ariaLabel="Notification options" panelClass="w-48">
      <button appMenuItem type="button" (click)="onMarkReadClick(notification)">
        <ion-icon name="checkmark-outline" class="text-base"></ion-icon>
        Mark as read
      </button>
    </app-dropdown-menu>
  </div>

  <app-state-block *ngIf="notifications.length === 0" [empty]="true" variant="inline"
    icon="notifications-off-outline" emptyTitle="No notifications to show"></app-state-block>
</div>
