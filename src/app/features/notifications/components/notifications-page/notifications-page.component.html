<div class="min-h-full pt-3 pb-1 flex flex-col gap-6">
  <!-- Stats row -->
  <div class="grid gap-4 grid-cols-[repeat(auto-fit,minmax(170px,1fr))]">
    <div class="rounded-[24px] bg-[#E8F1FB] p-5">
      <p class="text-sm text-gray-600">Total</p>
      <p class="mt-2 text-3xl font-bold text-gray-900">{{ totalCount() }}</p>
    </div>
    <div class="rounded-[24px] bg-[#CFE2F7] p-5">
      <p class="text-sm text-gray-600">Unread</p>
      <p class="mt-2 text-3xl font-bold text-gray-900">{{ unreadCount() }}</p>
    </div>
    <div class="rounded-[24px] bg-[#E7EAEE] p-5">
      <p class="text-sm text-gray-600">Today</p>
      <p class="mt-2 text-3xl font-bold text-gray-900">{{ todayCount() }}</p>
    </div>
    <div class="rounded-[24px] bg-[#DDE9F5] p-5">
      <p class="text-sm text-gray-600">This week</p>
      <p class="mt-2 text-3xl font-bold text-gray-900">{{ thisWeekCount() }}</p>
    </div>
  </div>

  <!-- Notifications card -->
  <div class="bg-white rounded-[28px] p-6">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-bold text-gray-900">Notifications</h2>
        <p class="mt-1 text-sm text-gray-500">Stay on top of client activity, payments and documents</p>
      </div>
      <button type="button" (click)="markAllAsRead()" [disabled]="markingAll() || unreadCount() === 0"
        class="flex items-center gap-2 rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-brand-ink disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-brand-bold">
        <ion-icon name="checkmark-done-outline" class="text-base"></ion-icon>
        {{ markingAll() ? 'Marking…' : 'Mark all as read' }}
      </button>
    </div>

    <!-- Filter bar -->
    <div class="mt-4 flex flex-wrap items-center gap-2">
      <button *ngFor="let option of filters" type="button" (click)="setFilter(option)"
        class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
        [ngClass]="activeFilter() === option ? 'bg-brand-bold text-white' : 'border border-gray-200 text-gray-500 hover:bg-gray-100'">
        {{ filterLabel(option) }}
      </button>

      <div
        class="ml-auto flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 transition-colors focus-within:border-gray-300">
        <ion-icon name="search-outline" class="mr-2 text-base text-gray-400"></ion-icon>
        <input type="text" placeholder="Search notifications" [ngModel]="search()" name="search"
          (ngModelChange)="search.set($event)"
          class="h-full w-48 bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
      </div>
    </div>

    <!-- List + states -->
    <div class="mt-5">
      <!-- Error banner (con Retry; si ya hay filas cargadas, se muestran debajo) -->
      <div *ngIf="error()"
        class="mb-3 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-red-100 bg-red-50 px-4 py-3">
        <div class="flex min-w-0 items-center gap-2 text-sm text-red-600">
          <ion-icon name="alert-circle-outline" class="shrink-0 text-base"></ion-icon>
          <span class="truncate">{{ error() }}</span>
        </div>
        <button type="button" (click)="retry()"
          class="rounded-full border border-red-200 px-4 py-1.5 text-xs font-semibold text-red-600 transition-colors hover:bg-red-100">
          Retry
        </button>
      </div>

      <!-- Loading (página 1) -->
      <div *ngIf="loading()" class="px-4 py-12 text-center">
        <ion-icon name="sync-outline" class="animate-spin text-3xl text-gray-300"></ion-icon>
        <p class="mt-2 text-sm text-gray-500">Loading notifications…</p>
      </div>

      <ng-container *ngIf="!loading()">
        <!-- La lista trae su propio empty state ("No notifications to show") -->
        <app-notification-list *ngIf="!error() || totalCount() > 0" [notifications]="visibleNotifications()"
          (markRead)="markRead($event)"></app-notification-list>

        <!-- Server-side pagination -->
        <div *ngIf="hasMore() && !error()" class="mt-4 flex justify-center">
          <button type="button" (click)="loadMore()" [disabled]="loadingMore()"
            class="rounded-full border border-gray-200 px-5 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50">
            {{ loadingMore() ? 'Loading…' : 'Load more' }}
          </button>
        </div>
      </ng-container>
    </div>
  </div>
</div>
