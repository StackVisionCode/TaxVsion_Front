<app-modal [isOpen]="isOpen" heading="New conversation" subheading="Start a chat" size="sm"
  (closed)="closed.emit()">
  <!-- Audience toggle: Clients vs Team -->
  <app-segmented class="mt-4" [options]="audienceOptions" [value]="audience()" (valueChange)="setAudience($event)"></app-segmented>

  <!-- Direct/Group sub-toggle (solo equipo, y solo si puede crear grupos) -->
  <div *ngIf="audience() === 'team' && canCreateGroups" class="mt-3">
    <app-segmented [options]="modeOptions" [value]="mode()" (valueChange)="mode.set($event)"></app-segmented>
  </div>

  <!-- Group title -->
  <div *ngIf="audience() === 'team' && mode() === 'group'" class="mt-4">
    <input type="text" placeholder="Group name" [ngModel]="groupTitle()" (ngModelChange)="groupTitle.set($event)"
      class="h-10 w-full rounded-full border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-300" />
  </div>

  <!-- Search -->
  <app-search-input class="mt-4" widthClass="w-full"
    [placeholder]="audience() === 'clients' ? 'Search clients...' : 'Search teammates...'"
    [value]="searchTerm()" (valueChange)="onSearchChange($event)"></app-search-input>

  <p *ngIf="creationError" class="mt-3 rounded-2xl bg-red-50 border border-red-100 px-4 py-2.5 text-sm text-red-600">
    {{ creationError }}
  </p>
  <p *ngIf="error" class="mt-3 rounded-2xl bg-red-50 border border-red-100 px-4 py-2.5 text-sm text-red-600">
    {{ error }}
  </p>

  <!-- Results: Clients -->
  <div *ngIf="audience() === 'clients'" class="mt-3 max-h-72 overflow-y-auto flex flex-col gap-1">
    <ng-container *ngFor="let entry of customers">
      <!-- Chateable: cliente con cuenta de portal activa -->
      <button *ngIf="isChatable(entry)" type="button" (click)="selectCustomer(entry)" [disabled]="creating"
        class="flex items-center gap-3 rounded-2xl px-3 py-2.5 text-left hover:bg-gray-50 transition-colors disabled:opacity-50">
        <app-avatar [name]="entry.displayName" sizeClass="h-9 w-9 text-xs" colorClass="bg-brand-bold"></app-avatar>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium text-gray-900">{{ entry.displayName }}</span>
          <span class="block truncate text-xs text-gray-400">{{ entry.email }}</span>
        </span>
      </button>

      <!-- No chateable: cliente sin portal — se muestra pero deshabilitado -->
      <div *ngIf="!isChatable(entry)" class="flex items-center gap-3 rounded-2xl px-3 py-2.5 opacity-60"
        title="This client hasn't activated their portal yet, so they can't be messaged.">
        <app-avatar [name]="entry.displayName" sizeClass="h-9 w-9 text-xs" colorClass="bg-gray-300"></app-avatar>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium text-gray-700">{{ entry.displayName }}</span>
          <span class="block truncate text-xs text-gray-400">{{ entry.email }}</span>
        </span>
        <span class="shrink-0 rounded-full bg-gray-100 px-2.5 py-1 text-[11px] font-medium text-gray-500">
          Portal not activated
        </span>
      </div>
    </ng-container>

    <p *ngIf="!searching && customers.length === 0" class="px-3 py-6 text-center text-sm text-gray-400">
      {{ searchTerm().trim() ? 'No clients found' : 'Type a name to search' }}
    </p>
    <p *ngIf="searching" class="px-3 py-6 text-center text-sm text-gray-400">Searching…</p>
  </div>

  <!-- Results: Team -->
  <div *ngIf="audience() === 'team'" class="mt-3 max-h-72 overflow-y-auto flex flex-col gap-1">
    <button *ngFor="let entry of employees" type="button" (click)="selectEmployee(entry)"
      [disabled]="creating"
      class="flex items-center gap-3 rounded-2xl px-3 py-2.5 text-left hover:bg-gray-50 transition-colors disabled:opacity-50">
      <app-avatar [name]="entry.displayName" sizeClass="h-9 w-9 text-xs" colorClass="bg-brand-bold"></app-avatar>
      <span class="min-w-0 flex-1">
        <span class="block truncate text-sm font-medium text-gray-900">{{ entry.displayName }}</span>
        <span class="block truncate text-xs text-gray-400">{{ entry.email }}</span>
      </span>
      <ion-icon *ngIf="mode() === 'group' && isSelected(entry)" name="checkmark-circle" class="text-lg text-gray-900"></ion-icon>
    </button>

    <p *ngIf="!searching && employees.length === 0" class="px-3 py-6 text-center text-sm text-gray-400">
      {{ searchTerm().trim() ? 'No teammates found' : 'Type a name to search' }}
    </p>
    <p *ngIf="searching" class="px-3 py-6 text-center text-sm text-gray-400">Searching…</p>
  </div>

  <!-- Group create action (solo equipo) -->
  <div *ngIf="audience() === 'team' && mode() === 'group'" class="mt-4 flex justify-end">
    <button type="button" (click)="createGroup()" [disabled]="creating || !groupTitle().trim() || selectedMembers().length === 0"
      class="rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink transition-colors disabled:opacity-40 disabled:pointer-events-none">
      {{ creating ? 'Creating…' : 'Create group (' + selectedMembers().length + ')' }}
    </button>
  </div>
</app-modal>
