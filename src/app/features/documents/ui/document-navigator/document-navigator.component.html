<nav class="flex h-full w-full flex-col overflow-hidden" aria-label="Documents navigation">
  <div class="flex-1 overflow-y-auto px-2.5 pt-3.5 pb-1.5">
    <p class="px-2 pb-2.5 text-[10.5px] font-bold uppercase tracking-[0.09em] text-gray-400">Workspace</p>

    <button type="button" (click)="openOffice.emit()"
      class="flex w-full items-center gap-2.5 rounded-xl px-2.5 py-2 text-left text-sm font-medium transition-colors"
      [class]="section === 'office' ? 'bg-indigo-50 font-semibold text-indigo-700' : 'text-gray-700 hover:bg-gray-100'">
      <ion-icon name="business-outline" class="text-base"></ion-icon>
      <span>Office Files</span>
    </button>

    <!-- Abre el selector a pantalla completa. Antes esto desplegaba la lista aquí dentro,
         pero en un rail de 240px solo cabía la primera página: con más clientes había que
         acertar el nombre en el buscador para llegar a ellos. -->
    <button type="button" (click)="openClients.emit()"
      class="mt-0.5 flex w-full items-center gap-2.5 rounded-xl px-2.5 py-2 text-left text-sm font-medium transition-colors"
      [class]="section === 'clients' ? 'bg-indigo-50 font-semibold text-indigo-700' : 'text-gray-700 hover:bg-gray-100'">
      <ion-icon name="people-outline" class="text-base"></ion-icon>
      <span>Clients</span>
      @if (clientsTotal > 0) {
        <span class="ml-auto text-xs text-gray-400">{{ clientsTotal }}</span>
      }
    </button>

    <!-- El cliente abierto se queda a la vista: es el contexto en el que estás trabajando,
         y sin esto el rail no dice de quién son los archivos que tienes delante. -->
    @if (section === 'client' && activeClientName) {
      <div class="ml-2 mt-1 border-l border-gray-100 pl-2">
        <button type="button" (click)="openClients.emit()"
          class="flex w-full items-center gap-2 rounded-lg bg-indigo-50 px-1.5 py-1.5 text-left">
          <span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-indigo-600 text-[9.5px] font-bold text-white">
            {{ initials(activeClientName) }}
          </span>
          <span class="truncate text-xs font-semibold text-indigo-700">{{ activeClientName }}</span>
        </button>
      </div>
    }

    <button type="button" (click)="openShared.emit()"
      class="mt-0.5 flex w-full items-center gap-2.5 rounded-xl px-2.5 py-2 text-left text-sm font-medium transition-colors"
      [class]="section === 'shared' ? 'bg-indigo-50 font-semibold text-indigo-700' : 'text-gray-700 hover:bg-gray-100'">
      <ion-icon name="share-social-outline" class="text-base"></ion-icon>
      <span>Shared with Me</span>
    </button>

    <button type="button" (click)="openRecent.emit()"
      class="mt-0.5 flex w-full items-center gap-2.5 rounded-xl px-2.5 py-2 text-left text-sm font-medium transition-colors"
      [class]="section === 'recent' ? 'bg-indigo-50 font-semibold text-indigo-700' : 'text-gray-700 hover:bg-gray-100'">
      <ion-icon name="time-outline" class="text-base"></ion-icon>
      <span>Recent</span>
    </button>

    <p class="px-2 pt-3 pb-2.5 text-[10.5px] font-bold uppercase tracking-[0.09em] text-gray-400">Management</p>
    <button type="button" (click)="openTrash.emit()"
      class="flex w-full items-center gap-2.5 rounded-xl px-2.5 py-2 text-left text-sm font-medium transition-colors"
      [class]="section === 'trash' ? 'bg-indigo-50 font-semibold text-indigo-700' : 'text-gray-700 hover:bg-gray-100'">
      <ion-icon name="trash-outline" class="text-base"></ion-icon>
      <span>Recycle Bin</span>
    </button>
  </div>

  <button type="button" (click)="openStorage.emit()"
    class="flex flex-col gap-1.5 border-t border-gray-100 px-3.5 py-3 text-left transition-colors hover:bg-gray-50">
    <span class="flex items-center gap-1.5 text-[11px] font-bold text-gray-500">
      <ion-icon name="server-outline" class="text-xs"></ion-icon> Storage
    </span>
    <span class="h-1.5 overflow-hidden rounded-full bg-gray-100">
      <span class="block h-full rounded-full bg-brand-bold transition-all" [style.width.%]="usedPercent"></span>
    </span>
    <span class="text-[11px] text-gray-400">{{ usedGb }} GB of {{ maxGb }} GB used</span>
  </button>
</nav>
