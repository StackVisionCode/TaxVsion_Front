<div class="min-h-full pt-3 pb-1 flex flex-col">
  <app-client-picker *ngIf="view() === 'clients'" class="flex-1 min-h-0" [clients]="clients()"
    [loading]="clientsLoading()" [error]="clientsError()" (search)="onClientSearch($event)"
    (clientSelected)="onClientSelected($event)"></app-client-picker>

  <app-file-browser *ngIf="view() === 'browser'" class="flex-1 min-h-0"
    [clientName]="selectedClient()?.displayName ?? ''" [breadcrumbs]="breadcrumbs()" [subfolders]="subfolders()"
    [files]="files()" [loading]="folderLoading()" [error]="folderError()" [uploading]="uploading()"
    (back)="backToClients()" (openRecycleBin)="showRecycleBin()" (openFolder)="onOpenFolder($event)"
    (goToRoot)="onGoToRoot()" (goToBreadcrumb)="onGoToBreadcrumb($event)" (createFolder)="onCreateFolder($event)"
    (filesSelected)="onFilesSelected($event)" (downloadFile)="onDownloadFile($event)"
    (deleteFile)="onDeleteFile($event)"></app-file-browser>

  <app-recycle-bin *ngIf="view() === 'recycle-bin'" class="flex-1 min-h-0" [items]="recycleBinItems()"
    [loading]="recycleBinLoading()" [error]="recycleBinError()" (back)="backToBrowser()"
    (restore)="onRestoreFile($event)" (emptyBin)="onEmptyRecycleBin()"></app-recycle-bin>
</div>
