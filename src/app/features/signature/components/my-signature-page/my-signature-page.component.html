<div class="min-h-full pt-3 pb-6 flex flex-col gap-4">
  <!-- Header -->
  <div class="lg:pr-[var(--shell-notch-width)]">
    <a routerLink="/settings"
      class="inline-flex items-center gap-1 text-xs font-semibold text-gray-400 transition-colors hover:text-gray-600">
      <ion-icon name="arrow-back-outline" class="text-sm"></ion-icon>
      Settings
    </a>
    <h1 class="mt-1 text-2xl font-bold text-gray-900">My signature</h1>
    <p class="mt-1 text-sm text-gray-500">Your personal signatures, stamped on documents you prepare.</p>
  </div>

  <section class="rounded-[1.5rem] bg-white p-6 border border-gray-100 shadow-sm">
    @if (canManageOwn()) {
      <app-signature-profile-list scope="user"></app-signature-profile-list>
    } @else {
      <div class="flex items-start gap-2 rounded-2xl border border-dashed border-gray-200 px-4 py-4 text-xs text-gray-500">
        <ion-icon name="business-outline" class="mt-px shrink-0 text-sm text-gray-400"></ion-icon>
        <span>Your office uses a shared office signature. Personal signatures are turned off for employees — documents you prepare are stamped with the office signature.</span>
      </div>
    }
  </section>
</div>
