<app-modal [isOpen]="open()" heading="Select a client"
  subheading="Search by name, email or phone" size="2xl" (closed)="close()">
  <!-- Filter bar -->
  <div class="mt-1 flex flex-wrap items-center gap-2">
    <button *ngFor="let option of typeFilters" type="button" (click)="setTypeFilter(option)"
      class="rounded-full px-4 py-2 text-sm font-medium transition-colors"
      [ngClass]="typeFilter() === option ? 'bg-brand-bold text-white' : 'border border-gray-200 text-gray-500 hover:bg-gray-100'">
      {{ filterLabel(option) }}
    </button>

    <div class="ml-auto flex h-10 w-full items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors sm:w-56">
      <ion-icon name="search-outline" class="mr-2 text-base text-gray-400"></ion-icon>
      <input type="text" name="clientSearch" placeholder="Search name, email or phone"
        [ngModel]="search()" (ngModelChange)="search.set($event)"
        class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
    </div>
  </div>

  <p class="mt-3 text-xs text-gray-400">
    {{ filtered().length }} {{ filtered().length === 1 ? 'client' : 'clients' }}
  </p>

  <!-- Loading -->
  <div *ngIf="store.customersLoading()" class="mt-2 flex flex-col gap-1.5">
    <div *ngFor="let i of [1, 2, 3, 4, 5]" class="h-14 animate-pulse rounded-2xl bg-gray-100"></div>
  </div>

  <!-- Error -->
  <div *ngIf="!store.customersLoading() && store.customersError()"
    class="mt-2 flex flex-col items-center rounded-2xl border border-red-100 bg-red-50/50 px-4 py-8 text-center">
    <ion-icon name="cloud-offline-outline" class="text-3xl text-red-300"></ion-icon>
    <p class="mt-2 text-sm font-medium text-red-600">Could not load your clients</p>
    <p class="mt-1 text-xs text-red-400">{{ store.customersError() }}</p>
    <button type="button" (click)="retryLoad()"
      class="mt-3 rounded-full border border-red-200 px-4 py-1.5 text-xs font-medium text-red-600 hover:bg-red-50 transition-colors">
      Retry
    </button>
  </div>

  <!-- Client cards -->
  <div *ngIf="!store.customersLoading() && !store.customersError()"
    class="client-list mt-2 flex max-h-[24rem] flex-col gap-1.5 overflow-y-auto pr-1">
    <button *ngFor="let client of filtered(); trackBy: trackClient" type="button" (click)="select(client)"
      class="client-row flex items-center gap-3 rounded-2xl border px-3 py-2.5 text-left transition-colors"
      [ngClass]="client.id === selectedId ? 'border-brand-bold bg-gray-50' : 'border-gray-100 hover:bg-gray-50'">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-xs font-bold text-white"
        [ngClass]="avatarFor(client)">{{ initials(client.displayName) }}</span>

      <span class="min-w-0 flex-1">
        <span class="flex items-center gap-2">
          <span class="truncate text-sm font-medium text-gray-900">{{ client.displayName }}</span>
          <span class="inline-block shrink-0 rounded-full border px-2 py-0.5 text-[10px] font-medium"
            [ngClass]="typeBadge(client)">{{ client.type === 'company' ? 'Company' : 'Individual' }}</span>
        </span>
        <span class="mt-0.5 flex items-center gap-3 text-xs text-gray-500">
          <span class="truncate">{{ client.email }}</span>
          <span class="hidden shrink-0 sm:inline">{{ client.phone }}</span>
        </span>
      </span>

      <span class="hidden shrink-0 items-center gap-2 rounded-full border px-3 py-0.5 text-xs font-medium sm:inline-flex"
        [ngClass]="client.isActive ? 'border-emerald-200 text-emerald-600' : 'border-gray-300 text-gray-500'">
        <span class="h-1.5 w-1.5 rounded-full" [ngClass]="client.isActive ? 'bg-emerald-500' : 'bg-gray-400'"></span>
        {{ client.isActive ? 'Active' : 'Inactive' }}
      </span>

      <ion-icon *ngIf="client.id === selectedId" name="checkmark-circle" class="shrink-0 text-lg text-gray-900"></ion-icon>
    </button>

    <!-- Empty state -->
    <div *ngIf="filtered().length === 0" class="px-4 py-10 text-center">
      <ion-icon name="people-outline" class="text-4xl text-gray-300"></ion-icon>
      <p class="mt-2 text-sm font-medium text-gray-600">No clients found</p>
      <p class="mt-1 text-xs text-gray-400">Try another name, email or filter</p>
    </div>
  </div>
</app-modal>
