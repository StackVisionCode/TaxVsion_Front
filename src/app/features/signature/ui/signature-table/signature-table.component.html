<!-- overflow-x-auto fuerza overflow-y:auto: sin reservar espacio, el menú "..." absoluto de una fila cercana
     al fondo desborda y el contenedor lo recorta con un scrollbar. Al abrir un menú reservamos hueco
     inferior para que quepa completo (evita position:fixed, que rompe bajo ancestros con transform). -->
<div class="overflow-x-auto" [ngClass]="{ 'pb-[22rem]': openMenuId() !== null }">
  <table class="w-full min-w-[860px] border-separate border-spacing-0 text-sm">
    <thead>
      <tr>
        <th class="rounded-l-2xl bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Document name</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Client</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Signers</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Status</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Sent date</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Completed date</th>
        <th class="rounded-r-2xl bg-brand-white px-4 py-3"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let request of requests; trackBy: trackByRequestId; let last = last" (click)="onRowClick(request)"
        class="group cursor-pointer">
        <td class="rounded-l-2xl px-4 py-3.5 font-medium text-gray-900 transition-colors group-hover:bg-gray-50"
          [class.border-b]="!last" [class.border-gray-100]="!last">
          {{ request.documentName }}
        </td>
        <td class="px-4 py-3.5 text-gray-500 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          {{ request.client }}
        </td>
        <td class="px-4 py-3.5 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          <div class="flex -space-x-2">
            <app-avatar *ngFor="let signer of visibleSigners(request)" [name]="signer.name" [colorClass]="signer.color"
              [title]="signer.name" sizeClass="h-8 w-8 border-2 border-white text-[10px]" />
            <span *ngIf="extraSignersCount(request) > 0"
              class="flex h-8 w-8 items-center justify-center rounded-full border-2 border-white bg-gray-200 text-[10px] font-semibold text-gray-600">
              +{{ extraSignersCount(request) }}
            </span>
          </div>
        </td>
        <td class="px-4 py-3.5 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          <app-status-pill [tone]="statusPill[request.status].tone" [toneClass]="statusPill[request.status].toneClass ?? ''"
            [dotClass]="statusPill[request.status].dotClass ?? ''">{{ statusLabel[request.status] }}</app-status-pill>
        </td>
        <td class="px-4 py-3.5 text-gray-500 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          {{ formatDate(request.sentDate) }}
        </td>
        <td class="px-4 py-3.5 text-gray-500 transition-colors group-hover:bg-gray-50" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          {{ formatDate(request.completedDate) }}
        </td>
        <td class="rounded-r-2xl px-4 py-3.5 text-right transition-colors group-hover:bg-gray-50"
          [class.border-b]="!last" [class.border-gray-100]="!last">
          <app-dropdown-menu ariaLabel="Signature request options" panelClass="w-48"
            (openChange)="onMenuOpenChange(request, $event)">
            <button appMenuItem type="button" (click)="previewRequested.emit(request)">
              <ion-icon name="eye-outline" class="text-base"></ion-icon>
              View
            </button>
            <button *ngIf="canEditDraft(request)" appMenuItem type="button" class="font-medium !text-brand-bold"
              (click)="continueRequested.emit(request)">
              <ion-icon name="brush-outline" class="text-base"></ion-icon>
              Continue editing
            </button>
            <button *ngIf="canEditDraft(request)" appMenuItem type="button" (click)="editRequested.emit(request)">
              <ion-icon name="create-outline" class="text-base"></ion-icon>
              Edit details
            </button>
            <button *ngIf="canSendRow(request)" appMenuItem type="button" class="font-medium !text-brand-bold"
              (click)="sendRequested.emit(request)">
              <ion-icon name="paper-plane-outline" class="text-base"></ion-icon>
              Send to signers
            </button>
            <button *ngIf="canResend(request)" appMenuItem type="button" (click)="resendRequested.emit(request)">
              <ion-icon name="paper-plane-outline" class="text-base"></ion-icon>
              Resend reminder
            </button>
            <button *ngIf="canExtend(request)" appMenuItem type="button" (click)="extendRequested.emit(request)">
              <ion-icon name="time-outline" class="text-base"></ion-icon>
              Extend expiration
            </button>
            <!-- PIN del preparador: es la única verificación de identidad que
                 el backend exige al firmar, y solo se activa si el staff lo fija. -->
            <button *ngIf="canManagePin(request)" appMenuItem type="button" (click)="pinRequested.emit(request)">
              <ion-icon name="key-outline" class="text-base"></ion-icon>
              {{ request.requiresPractitionerPin ? 'Change or remove PIN' : 'Set signing PIN' }}
            </button>
            <button *ngIf="canManagePin(request)" appMenuItem type="button" (click)="preparerRequested.emit(request)">
              <ion-icon name="ribbon-outline" class="text-base"></ion-icon>
              Preparer (Form 8879)
            </button>
            <button *ngIf="hasSealed(request)" appMenuItem type="button" (click)="downloadSealedRequested.emit(request)">
              <ion-icon name="download-outline" class="text-base"></ion-icon>
              Download signed
            </button>
            <button *ngIf="hasCertificate(request)" appMenuItem type="button"
              (click)="downloadCertificateRequested.emit(request)">
              <ion-icon name="ribbon-outline" class="text-base"></ion-icon>
              Download certificate
            </button>
            <button *ngIf="canCancel(request)" appMenuItem [danger]="true" type="button" (click)="cancelRequested.emit(request)">
              <ion-icon name="close-circle-outline" class="text-base"></ion-icon>
              Cancel request
            </button>
            <button *ngIf="canEditDraft(request)" appMenuItem [danger]="true" type="button" (click)="deleteRequested.emit(request)">
              <ion-icon name="trash-outline" class="text-base"></ion-icon>
              Delete draft
            </button>
          </app-dropdown-menu>
        </td>
      </tr>
    </tbody>
  </table>

  <app-state-block *ngIf="requests.length === 0" [empty]="true" variant="inline" icon="create-outline"
    emptyTitle="No signature requests match your search" />
</div>
