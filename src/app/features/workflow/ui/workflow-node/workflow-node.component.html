<!--
  La altura viene del layout: los conectores se calcularon contra ella.
  La posición va por `translate3d` y NO por left/top: mover con left/top
  dispara layout+paint en cada frame del arrastre, mientras que un transform
  se resuelve en el compositor.
-->
<div class="wf-node" [style.transform]="'translate3d(' + node.x + 'px,' + node.y + 'px,0)'"
  [style.width.px]="node.width" [style.height.px]="node.height"
  [class.wf-node--dragging]="dragging" (click)="selectStep.emit(step.id)"
  (pointerdown)="dragStart.emit($event)" [attr.aria-current]="selected ? 'true' : null">
  <!-- Badge de la simulación: duración al terminar (ámbar si faltan datos). -->
  <span *ngIf="preview && (preview.status === 'done' || preview.status === 'running')"
    class="wf-run-badge absolute -top-2.5 right-2 z-10 flex items-center gap-1 rounded-full px-2 py-0.5 text-[10px] font-semibold shadow-sm"
    [ngClass]="preview.warning ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'"
    [title]="preview.warning ? 'Ran with missing inputs' : 'Estimated duration'">
    <ion-icon [name]="preview.warning ? 'alert-circle' : 'time-outline'" class="text-[11px]"></ion-icon>
    {{ preview.status === 'running' ? 'running…' : preview.durationLabel }}
  </span>

  <div class="wf-node__card"
    [ngClass]="[type.border, selected ? 'wf-node__card--selected' : '', dragging ? 'wf-node__card--dragging' : '',
      linking ? 'wf-node__card--target' : '', previewClass]">

  <!-- Cabecera: color por tipo -->
  <div class="flex items-center gap-2 px-3 py-2" [class]="type.accent">
    <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md" [class]="type.chip">
      <ion-icon [name]="type.icon" class="text-sm text-white"></ion-icon>
    </span>
    <span class="min-w-0 flex-1 truncate text-sm font-semibold">{{ type.label }}</span>

    <!-- A cuántas cartas está conectada. -->
    <span class="shrink-0 rounded-full bg-white/60 px-1.5 py-0.5 text-[10px] font-medium tabular-nums"
      [title]="'Connected to ' + degreeLabel">{{ degreeLabel }}</span>

    <!-- Necesita un dato que nadie aguas arriba produce. -->
    <span *ngIf="node.missing.length > 0" class="shrink-0 text-amber-600"
      [title]="'Missing input: ' + missingLabel">
      <ion-icon name="alert-circle" class="text-sm"></ion-icon>
    </span>

    <div class="relative shrink-0" [attr.data-dropdown]="'node-' + step.id">
      <button type="button" (click)="toggleMenu($event)" (pointerdown)="$event.stopPropagation()"
        [attr.aria-label]="'Actions for ' + step.title"
        class="flex h-6 w-6 items-center justify-center rounded-full hover:bg-black/10 transition-colors">
        <ion-icon name="ellipsis-vertical" class="text-sm"></ion-icon>
      </button>
      <div *ngIf="menuOpen()"
        class="wf-menu absolute right-0 top-7 z-30 w-40 overflow-hidden rounded-xl border border-gray-100 bg-white py-1 shadow-lg">
        <button type="button" (click)="onDuplicate($event)"
          class="flex w-full items-center gap-2 px-3 py-2 text-left text-xs text-gray-700 hover:bg-gray-50 transition-colors">
          <ion-icon name="copy-outline" class="text-sm"></ion-icon>
          Duplicate
        </button>
        <button type="button" (click)="onDelete($event)"
          class="flex w-full items-center gap-2 px-3 py-2 text-left text-xs text-red-600 hover:bg-red-50 transition-colors">
          <ion-icon name="trash-outline" class="text-sm"></ion-icon>
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Cuerpo -->
  <div class="flex items-start gap-2 px-3 py-2.5">
    <ion-icon name="checkmark-circle" class="mt-0.5 shrink-0 text-base text-emerald-500"></ion-icon>
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold text-gray-900">{{ step.title }}</p>
      <p class="truncate text-xs text-gray-500">{{ step.subtitle }}</p>
    </div>
    <span *ngIf="step.typeId === 'form-submitted'"
      class="shrink-0 rounded-md bg-gray-100 px-1.5 py-0.5 text-[10px] font-semibold tracking-wide text-gray-500">
      DATA
    </span>
  </div>

  <!-- Pie: pares clave/valor derivados de la configuración -->
  <div *ngIf="pairs.length > 0" class="border-t border-gray-100 px-3 py-1.5">
    <div *ngFor="let pair of pairs" class="flex items-center gap-3 py-0.5 text-xs">
      <span class="w-16 shrink-0 truncate text-gray-400">{{ pair.label }}</span>
      <span class="min-w-0 flex-1 truncate text-gray-600">{{ pair.value }}</span>
    </div>
  </div>
</div>
</div>
