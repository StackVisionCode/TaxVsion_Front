<div class="flex h-full flex-col rounded-[1.75rem] border border-[#E4DCCF] bg-white" [class.w-16]="collapsed()">
  <!-- Cabecera -->
  <div class="flex items-center justify-between gap-2 px-4 pt-4">
    <h2 *ngIf="!collapsed()" class="text-base font-bold text-[#083645]">Add step</h2>
    <button type="button" (click)="toggleCollapsed()"
      [attr.aria-label]="collapsed() ? 'Expand step catalog' : 'Collapse step catalog'"
      class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-[#3E5F6B] hover:bg-[#F8F4ED] hover:text-[#083645] transition-colors">
      <ion-icon [name]="collapsed() ? 'chevron-forward-outline' : 'chevron-back-outline'" class="text-base"></ion-icon>
    </button>
  </div>

  <ng-container *ngIf="!collapsed()">
    <!-- Buscador -->
    <div class="px-4 pt-3">
      <div
        class="flex h-[2.375rem] items-center rounded-full border border-[#E4DCCF] bg-[#F8F4ED] px-3 focus-within:border-[#057BC1] transition-colors">
        <ion-icon name="search-outline" class="mr-2 text-sm text-[#3E5F6B]"></ion-icon>
        <input #searchInput type="text" placeholder="Search Step" [ngModel]="search()"
          (ngModelChange)="search.set($event)" name="stepSearch" aria-label="Search steps"
          class="h-full min-w-0 flex-1 bg-transparent text-sm text-[#083645] placeholder-[#3E5F6B] focus:outline-none" />
        <span class="ml-2 shrink-0 rounded-md bg-white px-1.5 py-0.5 text-[0.625rem] font-medium text-[#3E5F6B]">⌘ K</span>
      </div>
    </div>

    <!-- Aviso cuando el canvas está esperando dónde insertar -->
    <p *ngIf="awaitingInsert" class="mx-4 mt-3 rounded-xl bg-[#F4EDE4] px-3 py-2 text-xs text-[#083645]">
      Pick a step to insert at the spot you chose.
    </p>

    <!-- Catálogo -->
    <div class="mt-2 flex-1 overflow-y-auto px-2 pb-4">
      <div *ngFor="let group of groups()" class="wf-group mt-3 first:mt-1">
        <p class="px-2 pb-1 text-[0.625rem] font-bold uppercase tracking-[0.08em] text-[#3E5F6B]">{{ group.label }}</p>

        <!-- Se puede pulsar (inserta en el punto marcado) o arrastrar al lienzo. -->
        <button *ngFor="let type of group.types" type="button" (click)="addStep.emit(type.id)" draggable="true"
          (dragstart)="onDragStart($event, type.id)"
          class="wf-item group flex w-full cursor-grab items-center gap-3 rounded-xl px-2 py-2 text-left hover:bg-[#F8F4ED] active:cursor-grabbing transition-colors">
          <span class="flex h-[1.875rem] w-[1.875rem] shrink-0 items-center justify-center rounded-[0.5625rem]" [class]="chipClass(type)">
            <ion-icon [name]="type.icon" class="text-base"></ion-icon>
          </span>
          <span class="min-w-0 flex-1 truncate text-[0.8125rem] font-medium text-[#083645]">{{ type.label }}</span>
          <ion-icon name="add-outline"
            class="shrink-0 text-base text-[#3E5F6B] group-hover:text-[#057BC1] transition-colors"></ion-icon>
        </button>
      </div>

      <p *ngIf="isEmpty()" class="px-2 py-8 text-center text-sm text-[#3E5F6B]">No steps match that search.</p>
    </div>
  </ng-container>
</div>
