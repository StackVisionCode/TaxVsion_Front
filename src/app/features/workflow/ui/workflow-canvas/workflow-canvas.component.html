<div class="relative h-full w-full overflow-hidden rounded-[1.75rem] bg-[#F4EDE4]">
  <!-- viewport: el pan es scroll nativo -->
  <div #viewport class="wf-viewport h-full w-full overflow-auto" [class.wf-viewport--pan]="tool() === 'pan'"
    [class.wf-viewport--place]="tool() === 'note' || tool() === 'text'"
    [class.wf-viewport--draw]="tool() === 'draw' || tool() === 'arrow' || tool() === 'rect'"
    [class.wf-viewport--erase]="tool() === 'eraser'" (click)="onCanvasClick($event)"
    (wheel)="onWheel($event)"
    (pointerdown)="startPan($event)" (dragover)="allowDrop($event)" (drop)="onDrop($event)">

    <!-- sizer: reserva el área desplazable ya escalada -->
    <div class="relative" [style.width.px]="layout.width * zoom()" [style.height.px]="layout.height * zoom()">

      <!-- stage: escala el dibujo sin tocar coordenadas -->
      <div class="wf-stage absolute left-0 top-0 origin-top-left" [style.width.px]="layout.width"
        [style.height.px]="layout.height" [style.transform]="'scale(' + zoom() + ')'">

        <!-- Anotaciones DEBAJO de todo lo demás: se dibujan sobre el diagrama, así que no
             deben taparlo ni robarle el clic a una carta.

             Dos capas por geometría, no por capricho: nota / imagen / texto son cajas y van
             como divs posicionados; trazo / flecha / marco son formas y van en un SVG con
             coordenadas absolutas — una flecha tiene delta NEGATIVO y no cabe en una caja. -->
        <svg class="absolute left-0 top-0 overflow-visible" [attr.width]="layout.width"
          [attr.height]="layout.height">
          <defs>
            <marker *ngFor="let annotation of arrowAnnotations(); trackBy: trackAnnotation"
              [attr.id]="'wf-arrow-' + annotation.id" markerWidth="6" markerHeight="6" refX="4.6" refY="3"
              orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L6,3 L0,6 z" [attr.fill]="annotation.stroke"></path>
            </marker>
          </defs>

          <g *ngFor="let annotation of inkAnnotations(); trackBy: trackAnnotation"
            class="wf-ink" [class.wf-ink--active]="annotation.id === activeAnnotationId()"
            [attr.opacity]="annotation.opacity ?? 1"
            (pointerdown)="startAnnotationDrag($event, annotation)"
            (click)="onAnnotationClick($event, annotation)">
            <ng-container [ngSwitch]="annotation.kind">
              <path *ngSwitchCase="'draw'" [attr.d]="toPath(annotation.points ?? [])"
                [attr.transform]="'translate(' + annotation.x + ',' + annotation.y + ')'"
                [attr.stroke]="annotation.stroke" [attr.stroke-width]="strokeWidth(annotation.size)"
                fill="none" stroke-linecap="round" stroke-linejoin="round" />

              <line *ngSwitchCase="'arrow'" [attr.x1]="annotation.x" [attr.y1]="annotation.y"
                [attr.x2]="annotation.x + annotation.width" [attr.y2]="annotation.y + annotation.height"
                [attr.stroke]="annotation.stroke" [attr.stroke-width]="strokeWidth(annotation.size)"
                stroke-linecap="round" [attr.marker-end]="'url(#wf-arrow-' + annotation.id + ')'" />

              <rect *ngSwitchCase="'rect'" [attr.x]="annotation.x" [attr.y]="annotation.y"
                [attr.width]="annotation.width" [attr.height]="annotation.height" rx="14"
                [attr.stroke]="annotation.stroke" [attr.stroke-width]="strokeWidth(annotation.size)"
                fill="none" />
            </ng-container>
          </g>

          <!-- Lo que se está dibujando ahora mismo, aún sin confirmar. -->
          <ng-container *ngIf="sketch() as current">
            <path *ngIf="current.tool === 'draw'" [attr.d]="sketchPath()" [attr.stroke]="ink()"
              [attr.stroke-width]="strokeWidth(inkSize())" fill="none" stroke-linecap="round"
              stroke-linejoin="round" />
            <line *ngIf="current.tool === 'arrow'" [attr.x1]="current.startX" [attr.y1]="current.startY"
              [attr.x2]="current.currentX" [attr.y2]="current.currentY" [attr.stroke]="ink()"
              [attr.stroke-width]="strokeWidth(inkSize())" stroke-linecap="round" />
            <rect *ngIf="current.tool === 'rect'" [attr.x]="min(current.startX, current.currentX)"
              [attr.y]="min(current.startY, current.currentY)"
              [attr.width]="abs(current.currentX - current.startX)"
              [attr.height]="abs(current.currentY - current.startY)" rx="14" [attr.stroke]="ink()"
              [attr.stroke-width]="strokeWidth(inkSize())" fill="none" stroke-dasharray="6 4" />
          </ng-container>
        </svg>

        <div *ngFor="let annotation of boxAnnotations(); trackBy: trackAnnotation"
          class="wf-annotation absolute" [style.left.px]="annotation.x" [style.top.px]="annotation.y"
          [style.width.px]="annotation.width" [style.height.px]="annotation.height"
          [style.opacity]="annotation.opacity ?? 1"
          [class.wf-annotation--active]="annotation.id === activeAnnotationId()"
          (pointerdown)="startAnnotationDrag($event, annotation)"
          (click)="onAnnotationClick($event, annotation)">

          <ng-container [ngSwitch]="annotation.kind">
            <!-- Nota: se escribe en el sitio, sin abrir ningún panel. -->
            <div *ngSwitchCase="'note'"
              class="flex h-full w-full flex-col rounded-[0.875rem] border p-3 shadow-sm"
              [ngClass]="noteClasses(annotation.color)">
              <textarea [value]="annotation.text ?? ''" (input)="onNoteInput(annotation, $event)"
                (focus)="editingAnnotationId.set(annotation.id)" (blur)="editingAnnotationId.set(null)"
                placeholder="Write a note…" aria-label="Note text"
                class="h-full w-full resize-none border-0 bg-transparent text-sm leading-6 outline-none placeholder:opacity-50"></textarea>
            </div>

            <!-- Texto suelto: sin papel ni marco, solo la letra sobre el lienzo. -->
            <textarea *ngSwitchCase="'text'" [value]="annotation.text ?? ''"
              (input)="onNoteInput(annotation, $event)"
              (focus)="editingAnnotationId.set(annotation.id)" (blur)="editingAnnotationId.set(null)"
              placeholder="Type…" aria-label="Text"
              [style.color]="annotation.stroke" [style.font-size.px]="fontSize(annotation.size)"
              [style.font-family]="fontFamily(annotation.textStyle)"
              class="h-full w-full resize-none border-0 bg-transparent font-semibold leading-tight outline-none placeholder:opacity-40"></textarea>

            <img *ngSwitchCase="'image'" [src]="annotation.src" [alt]="annotation.alt || 'Canvas image'"
              draggable="false"
              class="pointer-events-none h-full w-full rounded-[0.875rem] border border-[#E4DCCF] bg-white object-cover shadow-sm" />
          </ng-container>

          <!-- Borrado rápido de la seleccionada. El resto de ajustes están en Propiedades:
               tenerlos también aquí serían dos sitios que decidir lo mismo. -->
          <div *ngIf="annotation.id === activeAnnotationId()"
            class="absolute -top-9 left-0 flex items-center gap-1 rounded-full border border-[#E4DCCF] bg-white px-1.5 py-1 shadow-md"
            (pointerdown)="$event.stopPropagation()">
            <button type="button" (click)="removeAnnotation.emit(annotation.id)"
              class="grid h-6 w-6 place-items-center rounded-full text-[#3E5F6B] transition-colors hover:bg-[#F4EDE4] hover:text-[#083645]"
              aria-label="Delete annotation">
              <ion-icon name="trash-outline" class="text-sm"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Procesos -->
        @for (box of layout.boxes; track trackBox($index, box)) {
          <div class="wf-process absolute left-0 top-0" [class.wf-process--dragging]="draggingId() === box.process.id"
            [style.transform]="'translate3d(' + box.x + 'px,' + box.y + 'px,0)'">
            <app-workflow-process-card [box]="box" [selectedStepId]="selectedStepId"
              [selected]="selectedProcessId === box.process.id" [dragging]="draggingId() === box.process.id"
              [preview]="stepPreview" [targets]="targetsFor(box)" [pendingIndex]="pendingIndexFor(box)"
              (select)="selectProcess.emit(box.process.id)" (selectStep)="selectStep.emit($event)"
              (insertAt)="insertStep.emit($event)" (headerDown)="startProcessDrag($event, box)"
              (rename)="renameProcess.emit({ id: box.process.id, name: $event })"
              (toggleCollapsed)="toggleProcess.emit(box.process.id)"
              (duplicateProcess)="duplicateProcess.emit(box.process.id)"
              (deleteProcess)="deleteProcess.emit(box.process.id)"
              (duplicateStep)="duplicateStep.emit($event)" (deleteStep)="deleteStep.emit($event)"
              (moveStep)="moveStep.emit($event)" (connectExit)="connectExit.emit($event)"
              (disconnectExit)="deleteConnection.emit($event)"></app-workflow-process-card>
          </div>
        }

        <!-- Hilos entre procesos. Encima de las tarjetas para que la punta se vea, pero sin
             capturar el ratón salvo en el propio trazo. -->
        <svg class="wf-links absolute left-0 top-0 overflow-visible" [attr.width]="layout.width"
          [attr.height]="layout.height" aria-hidden="true">
          <defs>
            <marker id="wf-link-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"
              markerUnits="userSpaceOnUse">
              <path d="M1,1 L8,4.5 L1,8" fill="none" class="wf-link-head" />
            </marker>
          </defs>
          @for (link of layout.links; track trackLink($index, link)) {
            <g>
              <path [attr.d]="link.path" class="wf-edge-hit" fill="none" (click)="onLinkClick(link, $event)" />
              <path [attr.d]="link.path" class="wf-edge" fill="none" marker-end="url(#wf-link-arrow)"
                [class.wf-edge--selected]="link.id === selectedConnectionId" [ngClass]="edgeRunClass(link.id)" />
            </g>
          }
        </svg>

        @for (link of layout.links; track trackLink($index, link)) {
          @if (link.id === selectedConnectionId) {
            <button type="button" (click)="deleteConnection.emit(link.id); $event.stopPropagation()"
              class="wf-link-delete absolute grid h-6 w-6 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full border border-[#E4DCCF] bg-white text-[#083645] shadow-sm"
              [style.left.px]="link.midX" [style.top.px]="link.midY" aria-label="Disconnect these processes">
              <ion-icon name="close-outline" class="text-sm"></ion-icon>
            </button>
          }
        }

        <!-- Cursores de los demás. Van DENTRO del stage para seguir al zoom y al scroll sin
             recalcular nada, pero la flecha se contra-escala: un puntero que se agranda con
             el zoom deja de leerse como un puntero. -->
        <div *ngFor="let peer of peers; trackBy: trackPeer"
          class="wf-cursor pointer-events-none absolute" [style.left.px]="peer.x" [style.top.px]="peer.y"
          [style.transform]="'scale(' + 1 / zoom() + ')'" aria-hidden="true">
          <svg width="20" height="22" viewBox="0 0 20 22" fill="none">
            <path d="M2 1.5 L2 17 L6.2 13.2 L9 19.5 L11.6 18.3 L8.9 12.2 L14.5 12 Z"
              [attr.fill]="peer.color" stroke="white" stroke-width="1.4" stroke-linejoin="round" />
          </svg>
          <span class="ml-3.5 -mt-1 inline-block rounded-full px-2 py-0.5 text-[0.6875rem] font-semibold text-white"
            [ngClass]="peer.pill">{{ peer.name }}</span>
        </div>

      </div>
    </div>
  </div>

  <!-- Tinta y grosor de lo PRÓXIMO que se dibuje. Solo con una herramienta de trazo
       activa: fuera de ese momento no decide nada y sería ruido permanente. -->
  <div *ngIf="showInkBar()"
    class="absolute bottom-16 left-1/2 flex -translate-x-1/2 items-center gap-2 rounded-full border border-[#E4DCCF] bg-white px-3 py-2 shadow-lg">
    <div class="flex items-center gap-1.5">
      <button *ngFor="let color of inkColors" type="button" (click)="ink.set(color)" [style.background]="color"
        class="h-5 w-5 rounded-full ring-offset-2 transition-shadow"
        [class.ring-2]="ink() === color" [class.ring-[#083645]]="ink() === color"
        [attr.aria-label]="'Ink ' + color" [attr.aria-pressed]="ink() === color"></button>
    </div>
    <span class="h-5 w-px bg-[#E4DCCF]"></span>
    <div class="flex items-center gap-1">
      <button *ngFor="let size of inkSizes" type="button" (click)="inkSize.set(size)"
        class="h-6 min-w-6 rounded-full px-1.5 text-[0.6875rem] font-bold transition-colors"
        [ngClass]="inkSize() === size ? 'bg-[#083645] text-white' : 'text-[#3E5F6B] hover:bg-[#F4EDE4]'"
        [attr.aria-pressed]="inkSize() === size">{{ size }}</button>
    </div>
  </div>

  <!-- Barra de herramientas flotante -->
  <div
    class="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-1 rounded-full border border-[#E4DCCF] bg-white px-2 py-1.5 shadow-lg">
    <button type="button" (click)="setTool('select')" aria-label="Select tool"
      class="flex h-8 w-8 items-center justify-center rounded-full transition-colors"
      [ngClass]="tool() === 'select' ? 'bg-[#083645] text-white' : 'text-[#3E5F6B] hover:bg-[#F4EDE4]'">
      <ion-icon name="navigate-outline" class="text-base"></ion-icon>
    </button>
    <button type="button" (click)="setTool('pan')" aria-label="Pan tool"
      class="flex h-8 w-8 items-center justify-center rounded-full transition-colors"
      [ngClass]="tool() === 'pan' ? 'bg-[#083645] text-white' : 'text-[#3E5F6B] hover:bg-[#F4EDE4]'">
      <ion-icon name="hand-left-outline" class="text-base"></ion-icon>
    </button>
    <span class="mx-1 h-5 w-px bg-[#E4DCCF]"></span>
    <!-- Anotar y dibujar. Las de trazo se quedan activas (se dibuja en tandas); las de
         colocar vuelven a `select` en cuanto sueltan su objeto. -->
    <button *ngFor="let item of drawTools" type="button" (click)="tool.set(tool() === item.id ? 'select' : item.id)"
      [attr.aria-label]="item.label" [attr.aria-pressed]="tool() === item.id" [title]="item.label"
      class="flex h-8 w-8 items-center justify-center rounded-full transition-colors"
      [ngClass]="tool() === item.id ? 'bg-[#083645] text-white' : 'text-[#3E5F6B] hover:bg-[#F4EDE4]'">
      <ion-icon [name]="item.icon" class="text-base"></ion-icon>
    </button>
    <button type="button" (click)="requestImage()" aria-label="Add image" title="Add image"
      class="flex h-8 w-8 items-center justify-center rounded-full text-[#3E5F6B] hover:bg-[#F4EDE4] transition-colors">
      <ion-icon name="image-outline" class="text-base"></ion-icon>
    </button>
    <span class="mx-1 h-5 w-px bg-[#E4DCCF]"></span>
    <button type="button" (click)="fit()" aria-label="Fit to screen"
      class="flex h-8 w-8 items-center justify-center rounded-full text-[#3E5F6B] hover:bg-[#F4EDE4] transition-colors">
      <ion-icon name="scan-outline" class="text-base"></ion-icon>
    </button>
    <!-- Recolocar: rescata el lienzo cuando quedó desordenado a mano. -->
    <button type="button" (click)="tidy.emit()" aria-label="Tidy processes" title="Tidy processes"
      class="flex h-8 w-8 items-center justify-center rounded-full text-[#3E5F6B] hover:bg-[#F4EDE4] transition-colors">
      <ion-icon name="grid-outline" class="text-base"></ion-icon>
    </button>
  </div>

  <!-- Zoom -->
  <div
    class="absolute bottom-4 right-4 flex items-center gap-1 rounded-full border border-[#E4DCCF] bg-white px-2 py-1.5 shadow-lg">
    <button type="button" (click)="zoomBy(-0.1)" [disabled]="!canZoomOut()" aria-label="Zoom out"
      class="flex h-7 w-7 items-center justify-center rounded-full text-[#3E5F6B] hover:bg-[#F4EDE4] disabled:opacity-40 transition-colors">
      <ion-icon name="remove-outline" class="text-base"></ion-icon>
    </button>
    <span class="w-12 text-center text-xs font-medium text-[#083645]">{{ zoomPercent() }}%</span>
    <button type="button" (click)="zoomBy(0.1)" [disabled]="!canZoomIn()" aria-label="Zoom in"
      class="flex h-7 w-7 items-center justify-center rounded-full text-[#3E5F6B] hover:bg-[#F4EDE4] disabled:opacity-40 transition-colors">
      <ion-icon name="add-outline" class="text-base"></ion-icon>
    </button>
  </div>
</div>
