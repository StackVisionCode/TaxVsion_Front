<div *ngIf="status !== 'idle'"
  class="wf-hud pointer-events-auto flex items-center gap-3 rounded-full border border-gray-100 bg-white shadow-sm px-4 py-2 shadow-lg">

  <span class="flex items-center gap-2 text-sm">
    <span *ngIf="status === 'running'" class="h-2 w-2 animate-pulse rounded-full bg-[#057BC1]"></span>
    <span *ngIf="status === 'finished'" class="h-2 w-2 rounded-full bg-[#057BC1]"></span>
    <span *ngIf="status === 'stopped'" class="h-2 w-2 rounded-full bg-[#083645]"></span>
    <span class="font-medium text-[#083645]">
      {{ status === 'running' ? 'Running' : status === 'finished' ? 'Finished' : 'Stopped' }}
    </span>
    <span class="text-[#3E5F6B]">· {{ doneCount }}/{{ runCount }}</span>
    <span class="text-[#3E5F6B]">· {{ status === 'finished' ? totalLabel : elapsedLabel }} simulated</span>
  </span>

  <!-- Los tiempos largos se acortan en pantalla; el badge de cada carta lleva el real. -->
  <span class="hidden text-[0.625rem] text-[#3E5F6B] sm:inline" title="Long waits are shortened on screen; each card's badge shows the real estimate.">
    Compressed time
  </span>

  <span class="h-4 w-px bg-[#E4DCCF]"></span>

  <button *ngIf="status === 'running'" type="button" (click)="stopRun.emit()"
    class="rounded-full bg-[#083645] px-3 py-1 text-xs font-semibold text-white hover:bg-black transition-colors">
    Stop
  </button>
  <button *ngIf="status !== 'running'" type="button" (click)="rerun.emit()"
    class="rounded-full bg-[#057BC1] px-3 py-1 text-xs font-semibold text-white hover:bg-[#083645] transition-colors">
    Run again
  </button>
  <button *ngIf="status !== 'running'" type="button" (click)="closeHud.emit()" aria-label="Close preview"
    class="flex h-6 w-6 items-center justify-center rounded-full text-[#3E5F6B] hover:bg-[#F8F4ED] hover:text-[#083645] transition-colors">
    <ion-icon name="close-outline" class="text-sm"></ion-icon>
  </button>
</div>
