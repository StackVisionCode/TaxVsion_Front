<div class="overflow-x-auto">
  <table class="w-full min-w-[720px] border-separate border-spacing-0 text-sm">
    <thead>
      <tr>
        <th class="rounded-l-2xl bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Name</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Email</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Roles</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Status</th>
        <th class="bg-brand-white px-4 py-3 text-left font-semibold text-gray-900">Activity</th>
        <th class="rounded-r-2xl bg-brand-white px-4 py-3"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let member of members; let last = last" class="group">
        <td class="px-4 py-3.5 group-hover:bg-gray-50 transition-colors rounded-l-2xl" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          <span class="flex items-center gap-3">
            <app-avatar [name]="member.name" [colorClass]="member.avatarColor" sizeClass="h-9 w-9 text-xs" />
            <span class="flex flex-col items-start gap-1">
              <span class="font-medium text-gray-900">{{ member.name }}</span>
              <span class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-semibold"
                [ngClass]="actorTypeBadge(member.actorType)">
                {{ actorTypeLabel(member.actorType) }}
              </span>
            </span>
          </span>
        </td>
        <td class="px-4 py-3.5 text-gray-600 group-hover:bg-gray-50 transition-colors" [class.border-b]="!last"
          [class.border-gray-100]="!last">{{ member.email }}</td>
        <td class="px-4 py-3.5 group-hover:bg-gray-50 transition-colors" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          <span class="flex flex-wrap gap-1.5">
            <span *ngFor="let role of member.roleNames"
              class="inline-block rounded-full border px-3 py-0.5 text-xs font-medium" [ngClass]="roleChip(role)">
              {{ role }}
            </span>
            <span *ngIf="member.roleNames.length === 0" class="text-xs text-gray-400">—</span>
          </span>
        </td>
        <td class="px-4 py-3.5 group-hover:bg-gray-50 transition-colors" [class.border-b]="!last"
          [class.border-gray-100]="!last">
          <app-status-pill [tone]="statusTone(member.status)" [soft]="true">{{ statusLabel(member.status) }}</app-status-pill>
        </td>
        <td class="px-4 py-3.5 text-gray-500 group-hover:bg-gray-50 transition-colors" [class.border-b]="!last"
          [class.border-gray-100]="!last">{{ member.activity }}</td>
        <td class="px-4 py-3.5 text-right group-hover:bg-gray-50 transition-colors rounded-r-2xl relative"
          [class.border-b]="!last" [class.border-gray-100]="!last">
          <app-dropdown-menu *ngIf="member.id !== currentUserId && !(member.kind === 'user' && member.status === 'removed')"
            ariaLabel="Member actions" panelClass="w-48 text-left">
            <ng-container *ngIf="member.kind === 'user'">
              <button *ngIf="canManageRoles" appMenuItem type="button" (click)="editRoles.emit(member)">
                <ion-icon name="options-outline" class="text-sm text-gray-400"></ion-icon>
                Edit access
              </button>
              <button *ngIf="canManageUsers" appMenuItem type="button" (click)="toggleSuspend.emit(member)">
                <ion-icon [name]="member.status === 'suspended' ? 'play-circle-outline' : 'pause-circle-outline'"
                  class="text-sm text-gray-400"></ion-icon>
                {{ member.status === 'suspended' ? 'Reactivate' : 'Suspend' }}
              </button>
              <button *ngIf="canManageUsers" appMenuItem [danger]="true" type="button" class="border-t border-gray-100"
                (click)="offboard.emit(member)">
                <ion-icon name="person-remove-outline" class="text-sm text-red-400"></ion-icon>
                Remove from office
              </button>
            </ng-container>
            <ng-container *ngIf="member.kind === 'invitation'">
              <button *ngIf="canInvite" appMenuItem type="button" (click)="resendInvite.emit(member)">
                <ion-icon name="mail-outline" class="text-sm text-gray-400"></ion-icon>
                Resend invite
              </button>
              <button appMenuItem [danger]="true" type="button" (click)="cancelInvite.emit(member)">
                <ion-icon name="close-circle-outline" class="text-sm text-red-400"></ion-icon>
                Cancel invite
              </button>
            </ng-container>
          </app-dropdown-menu>
        </td>
      </tr>
    </tbody>
  </table>

  <app-state-block *ngIf="members.length === 0" variant="inline" [empty]="true" icon="people-outline"
    [emptyTitle]="emptyMessage" />
</div>
