<div class="min-h-full pt-3 pb-1 flex flex-col gap-6">
  <!-- Stats row -->
  <app-stat-cards [items]="stats()" />

  <!-- Team card -->
  <div class="bg-white rounded-[28px] p-6">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h2 class="text-xl font-bold text-gray-900">Team members</h2>
        <p class="mt-1 text-sm text-gray-500">Manage staff access and roles for your firm</p>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="mt-4 flex flex-wrap items-center gap-3">
      <!-- B9: la pestaña Roles es `roles.manage`, un permiso distinto de ver el equipo (ver tabOptions). -->
      <app-filter-chips size="sm" [options]="tabOptions()" [value]="tab()" (valueChange)="setTab($event)" />

      <app-search-input class="w-full sm:w-64" widthClass="w-full" placeholder="Search members..." [value]="search()"
        (valueChange)="onSearchChange($event)" />

      <div class="ml-auto flex items-center gap-2">
        <button *ngIf="can.canManageSeats()" type="button" (click)="openSeatModal()"
          class="flex items-center gap-2 rounded-full border border-brand-bold/30 px-4 py-2 text-sm font-semibold text-brand-bold hover:bg-brand-bold/5 transition-colors">
          <ion-icon name="ticket-outline" class="text-base"></ion-icon>
          Buy seats
        </button>
        <button *ngIf="can.canInvite()" type="button" (click)="openInvitePanel()"
          class="flex items-center gap-2 rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink transition-colors">
          <ion-icon name="person-add-outline" class="text-base"></ion-icon>
          Invite member
        </button>
      </div>
    </div>

    <!-- Members tab: GET /auth/users paginado en servidor -->
    <div *ngIf="tab() === 'members'" class="mt-5">
      <p *ngIf="membersLoading()" class="mb-3 text-sm text-gray-400">Loading members…</p>
      <p *ngIf="membersError()" class="mb-3 text-sm text-red-600">{{ membersError() }}</p>
      <app-user-table [members]="members()" [currentUserId]="currentUserId()"
        [canInvite]="can.canInvite()" [canManageUsers]="can.canManageUsers()" [canManageRoles]="can.canManageRoles()"
        emptyMessage="No team members match your search" (editRoles)="openAccessDrawer($event)"
        (toggleSuspend)="toggleSuspend($event)" (offboard)="offboard($event)"></app-user-table>
      <app-pagination [currentPage]="membersPage()" [totalItems]="membersTotal()" [pageSize]="pageSize"
        (pageChange)="onMembersPageChange($event)"></app-pagination>
    </div>

    <!-- Roles tab (B9): CRUD de roles de la oficina. -->
    <div *ngIf="tab() === 'roles'" class="mt-5">
      <app-roles-panel></app-roles-panel>
    </div>

    <!-- Invitations tab: GET /auth/invitations?status=Pending -->
    <div *ngIf="tab() === 'invitations'" class="mt-5">
      <p *ngIf="invitationsLoading()" class="mb-3 text-sm text-gray-400">Loading invitations…</p>
      <p *ngIf="invitationsError()" class="mb-3 text-sm text-red-600">{{ invitationsError() }}</p>
      <app-user-table [members]="visibleInvitations()" [currentUserId]="currentUserId()"
        [canInvite]="can.canInvite()" [canManageUsers]="can.canManageUsers()" [canManageRoles]="can.canManageRoles()"
        emptyMessage="No pending invitations" (resendInvite)="resendInvite($event)"
        (cancelInvite)="cancelInvite($event)"></app-user-table>
      <app-pagination [currentPage]="invitationsPage()" [totalItems]="invitationsTotal()" [pageSize]="pageSize"
        (pageChange)="onInvitationsPageChange($event)"></app-pagination>
    </div>

    <!-- Seats: quién ocupa cada asiento comprado. Comprar sigue siendo el botón de arriba. -->
    <div *ngIf="tab() === 'seats'" class="mt-5">
      <app-seats-panel [teammates]="members()"></app-seats-panel>
    </div>
  </div>
</div>

<!-- Invite / edit overlay -->
<app-user-invite-panel [isOpen]="isPanelOpen()" [member]="editingMember()" (closed)="closePanel()"
  (saved)="handleSaved($event)" (buySeats)="openSeatModal()"></app-user-invite-panel>

<!-- Buy seats modal (hybrid: charge card on file → hosted-checkout fallback) -->
<app-seat-purchase-modal [isOpen]="isSeatModalOpen()" [seatsInUse]="limits()?.activeUsers ?? null"
  [seatCap]="limits()?.maxUsers ?? null" (closed)="closeSeatModal()"
  (purchased)="handleSeatsPurchased()"></app-seat-purchase-modal>

<!-- Edit access drawer (per-user permission overrides) — created fresh per open so its store is clean -->
<app-edit-access-drawer *ngIf="accessMember() as member" [member]="member" [catalog]="permissions()"
  (closed)="closeAccessDrawer()" (saved)="handleAccessSaved()"
  (manageRoles)="handleManageRoles($event)"></app-edit-access-drawer>

<!-- Cancel invitation confirmation -->
<app-confirm-dialog [isOpen]="!!pendingCancel()" heading="Cancel invitation?" [message]="cancelMessage()"
  confirmLabel="Cancel invite" (confirmed)="confirmCancelInvite()"
  (cancelled)="pendingCancel.set(null)"></app-confirm-dialog>

<!-- Suspend confirmation (FE-1b) -->
<app-confirm-dialog [isOpen]="!!pendingSuspend()" heading="Suspend member?" [message]="suspendMessage()"
  confirmLabel="Suspend" (confirmed)="confirmSuspend()"
  (cancelled)="pendingSuspend.set(null)"></app-confirm-dialog>

<!-- Remove from office (offboard): preview de impacto (fan-out 7 servicios) + selector de sucesor -->
<app-offboard-dialog *ngIf="pendingOffboard() as member" [member]="member"
  (confirmed)="confirmOffboard($event)" (cancelled)="pendingOffboard.set(null)"></app-offboard-dialog>
