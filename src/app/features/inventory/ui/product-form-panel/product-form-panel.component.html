<app-modal [isOpen]="isOpen" [heading]="isEditMode() ? 'Edit Product' : 'New Product'"
  [subheading]="isEditMode() ? 'Update the details of this product' : 'Add a product to your inventory'" size="lg"
  (closed)="close()">

    <div class="mt-5 flex flex-col gap-3">
      <!-- Name -->
      <div class="flex h-11 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
        <input type="text" placeholder="Product name" [ngModel]="name()" name="name" (ngModelChange)="name.set($event)"
          class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
      </div>

      <!-- SKU (inmutable en el backend: solo editable al crear) -->
      <div class="flex h-11 items-center rounded-full border border-gray-200 px-4 focus-within:border-gray-300 transition-colors"
        [ngClass]="isEditMode() ? 'bg-[#FAFAFA]' : 'bg-white'">
        <span class="mr-2 text-sm text-gray-400">SKU</span>
        <input type="text" placeholder="e.g. SVC-1040" [ngModel]="sku()" name="sku" (ngModelChange)="sku.set($event)"
          [disabled]="isEditMode()"
          class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none disabled:text-gray-400" />
        <span *ngIf="isEditMode()" class="ml-2 shrink-0 text-xs text-gray-400">Can't be changed</span>
      </div>

      <!-- Category dropdown (id real del backend + alta inline) -->
      <div class="relative" data-dropdown="product-category">
        <button type="button" (click)="toggleCategoryDropdown()"
          class="flex h-11 w-full items-center justify-between rounded-full border border-gray-200 bg-white px-4 text-sm font-medium text-gray-900 hover:bg-gray-50 transition-colors">
          <span [class.text-gray-400]="!categoryId()">{{ categoryLabel() }}</span>
          <ion-icon name="chevron-down-outline" class="text-sm text-gray-500"></ion-icon>
        </button>
        <div *ngIf="isCategoryOpen()"
          class="absolute left-0 top-full z-20 mt-2 w-full overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
          <div class="max-h-52 overflow-y-auto">
            <button *ngFor="let option of categories" type="button" (click)="selectCategory(option.id)"
              class="flex w-full items-center justify-between px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
              {{ option.name }}
              <ion-icon *ngIf="option.id === categoryId()" name="checkmark-outline"
                class="text-sm text-gray-900"></ion-icon>
            </button>
            <p *ngIf="categories.length === 0" class="px-4 py-3 text-sm text-gray-400">
              No categories yet — create one below
            </p>
          </div>
          <div class="flex items-center gap-2 border-t border-gray-100 p-2">
            <input type="text" placeholder="New category name" [ngModel]="newCategoryName()" name="newCategoryName"
              (ngModelChange)="newCategoryName.set($event)" (click)="$event.stopPropagation()"
              class="h-9 min-w-0 flex-1 rounded-full border border-gray-200 bg-white px-3 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none" />
            <button type="button" (click)="createCategory(); $event.stopPropagation()"
              [disabled]="!newCategoryName().trim()"
              class="shrink-0 rounded-full bg-brand-bold px-3 py-1.5 text-xs font-semibold text-white hover:bg-brand-ink disabled:opacity-50 transition-colors">
              Add
            </button>
          </div>
        </div>
      </div>

      <!-- Price -->
      <div class="flex h-11 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
        <span class="mr-2 text-sm text-gray-400">Price ($)</span>
        <input type="number" min="0" step="0.01" placeholder="0.00" [ngModel]="price()" name="price"
          (ngModelChange)="price.set($event)"
          class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- Stock inicial: solo al crear (después se mueve con el stepper, que registra un movimiento real) -->
        <div *ngIf="!isEditMode()"
          class="flex h-11 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
          <span class="mr-2 text-sm text-gray-400">Stock</span>
          <input type="number" min="0" step="1" placeholder="0" [ngModel]="stockQuantity()" name="stockQuantity"
            (ngModelChange)="stockQuantity.set($event)"
            class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
        </div>

        <!-- Low-stock threshold -->
        <div class="flex h-11 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
          <span class="mr-2 text-sm text-gray-400">Low at</span>
          <input type="number" min="0" step="1" placeholder="0" [ngModel]="lowStockThreshold()" name="lowStockThreshold"
            (ngModelChange)="lowStockThreshold.set($event)"
            class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
        </div>
      </div>

      <!-- Active / inactive toggle -->
      <div class="flex items-center justify-between rounded-2xl border border-gray-100 bg-[#FAFAFA] px-4 py-3">
        <div>
          <p class="text-sm font-medium text-gray-900">{{ status() === 'active' ? 'Active' : 'Inactive' }}</p>
          <p class="text-xs text-gray-500">Inactive products stay hidden from clients</p>
        </div>
        <button type="button" (click)="toggleStatus()" role="switch" [attr.aria-checked]="status() === 'active'"
          class="relative flex h-6 w-11 items-center rounded-full transition-colors"
          [ngClass]="status() === 'active' ? 'bg-brand-bold' : 'bg-gray-300'" aria-label="Toggle active status">
          <span class="inline-block h-5 w-5 transform rounded-full bg-white shadow transition-transform"
            [ngClass]="status() === 'active' ? 'translate-x-5' : 'translate-x-0.5'"></span>
        </button>
      </div>

      <p *ngIf="errorMessage" class="px-2 text-sm text-red-600">{{ errorMessage }}</p>
    </div>

  <div class="mt-5 flex items-center justify-end gap-2">
    <button type="button" (click)="close()"
      class="rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
      Cancel
    </button>
    <button type="button" (click)="save()" [disabled]="!canSave()"
      class="rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink disabled:opacity-50 disabled:hover:bg-brand-bold transition-colors">
      {{ saving ? 'Saving…' : isEditMode() ? 'Save changes' : 'Add product' }}
    </button>
  </div>
</app-modal>
