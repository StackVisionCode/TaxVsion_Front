<div class="min-h-screen w-full flex items-center justify-center bg-indigo-50 p-4 sm:p-8 relative overflow-hidden">
  <div class="pointer-events-none absolute -top-32 -left-32 w-96 h-96 bg-indigo-300/40 rounded-full blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-24 w-96 h-96 bg-brand-light/30 rounded-full blur-3xl"></div>

  <div class="relative w-full max-w-md bg-white rounded-[2rem] shadow-2xl shadow-brand-light/40 px-8 py-12 text-center">
    @if (!failed()) {
      <span class="mx-auto flex h-14 w-14 items-center justify-center">
        <span class="w-8 h-8 border-[3px] border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></span>
      </span>
      <h1 class="mt-6 text-2xl font-bold text-gray-900">Signing you in...</h1>
      <p class="mt-2 text-sm text-gray-500">Taking you to your office.</p>
    } @else {
      <h1 class="text-2xl font-bold text-gray-900">This sign-in link has expired</h1>
      <p class="mt-2 text-sm text-gray-500">
        For your security, sign-in links can only be used once and expire quickly. Please sign in again.
      </p>
      <button type="button" (click)="backToLogin()"
        class="mt-8 w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-colors">
        Back to sign in
      </button>
    }
  </div>
</div>
