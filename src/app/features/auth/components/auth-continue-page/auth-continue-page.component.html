<div class="min-h-screen w-full flex items-center justify-center bg-[#F8F4ED] p-4 sm:p-8 relative overflow-hidden text-[#083645]">
  <div class="pointer-events-none absolute -top-32 -left-32 w-96 h-96 bg-[#057BC1]/10 rounded-full blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-24 w-96 h-96 bg-[#083645]/10 rounded-full blur-3xl"></div>

  <div class="relative w-full max-w-[24rem] rounded-[1.75rem] border border-[#E4DCCF] bg-white px-8 py-10 shadow-[0_24px_60px_-12px_rgba(8,54,69,0.2)] text-center">
    <!-- Camino feliz: tapada por <app-login-transition /> (raíz). Se conserva como respaldo por si
         la escena se retira por su tope de seguridad antes de que el shell pinte. -->
    @if (!failed()) {
      <span class="mx-auto flex h-14 w-14 items-center justify-center">
        <app-infinity-loader size="md" />
      </span>
      <h1 class="mt-6 text-[1.625rem] font-semibold tracking-tight text-[#083645]">Signing you in...</h1>
      <p class="mt-2 text-sm text-[#3E5F6B]">Taking you to your office.</p>
    } @else {
      <h1 class="text-[1.625rem] font-semibold tracking-tight text-[#083645]">This sign-in link has expired</h1>
      <p class="mt-2 text-sm text-[#3E5F6B]">
        For your security, sign-in links can only be used once and expire quickly. Please sign in again.
      </p>
      <button type="button" (click)="backToLogin()"
        class="mt-7 flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-[#083645] text-sm font-semibold text-white transition-colors hover:bg-[#057BC1]">
        Back to sign in
      </button>
    }
  </div>
</div>
