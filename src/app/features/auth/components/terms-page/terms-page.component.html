<div class="min-h-screen w-full flex items-center justify-center bg-indigo-50 p-4 sm:p-8 relative overflow-hidden">
  <div class="pointer-events-none absolute -top-32 -left-32 w-96 h-96 bg-indigo-300/40 rounded-full blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-24 w-96 h-96 bg-brand-light/30 rounded-full blur-3xl"></div>

  <div class="relative w-full max-w-md bg-white rounded-[2rem] shadow-2xl shadow-brand-light/40 px-8 sm:px-10 py-10">
    <span class="text-indigo-600 text-3xl font-bold leading-none">*</span>

    <h1 class="mt-4 text-2xl font-bold text-gray-900">Review &amp; accept</h1>
    <p class="mt-2 text-sm text-gray-500">
      We've updated our Terms of Service / Acceptable Use Policy. Please review and accept to keep
      using your workspace.
    </p>

    <div class="mt-6 space-y-2">
      @if (tosUrl(); as url) {
        <a [href]="url" target="_blank" rel="noopener noreferrer"
          class="flex items-center justify-between gap-3 rounded-xl border border-gray-200 px-4 py-3 text-sm font-medium text-gray-800 hover:bg-indigo-50/60 transition-colors">
          <span>Terms of Service &amp; Acceptable Use</span>
          <svg class="w-4 h-4 text-indigo-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5m0-5L10 14M9 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-3" />
          </svg>
        </a>
      }
      @if (privacyUrl(); as url) {
        <a [href]="url" target="_blank" rel="noopener noreferrer"
          class="flex items-center justify-between gap-3 rounded-xl border border-gray-200 px-4 py-3 text-sm font-medium text-gray-800 hover:bg-indigo-50/60 transition-colors">
          <span>Privacy Policy</span>
          <svg class="w-4 h-4 text-indigo-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5m0-5L10 14M9 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-3" />
          </svg>
        </a>
      }
    </div>

    <button type="button" (click)="toggleAgreed()" class="mt-6 flex w-full items-start gap-3 text-left">
      <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border transition-colors"
        [class.bg-indigo-600]="agreed()" [class.border-indigo-600]="agreed()" [class.border-gray-300]="!agreed()">
        @if (agreed()) {
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        }
      </span>
      <span class="text-sm text-gray-600">
        I have read and agree to the Terms of Service / Acceptable Use Policy and the Privacy Policy.
      </span>
    </button>

    @if (formError()) {
      <p class="mt-4 text-sm font-medium text-red-600">{{ formError() }}</p>
    }

    <button type="button" (click)="accept()" [disabled]="submitting() || !agreed()"
      class="mt-6 w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white text-sm font-semibold transition-colors">
      @if (submitting()) {
        <span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
        <span>Saving...</span>
      } @else {
        <span>Accept &amp; continue</span>
      }
    </button>

    <p class="mt-4 text-center">
      <button type="button" (click)="logout()" class="text-sm font-medium text-gray-500 hover:text-gray-700">
        Not now, sign out
      </button>
    </p>
  </div>
</div>
