<div class="relative flex min-h-screen w-full items-center justify-center bg-[#F8F4ED] px-5 py-10 text-[#083645]">
  <!-- La escena de carga post-login no vive acá: es <app-login-transition /> en la raíz (sobrevive al cambio
       de ruta). Esta página solo hunde la tarjeta. -->
  <div class="auth-card w-full max-w-[340px]" [class.login-sink]="isSunk()">
    <div class="flex flex-col items-center text-center">
      <!-- Logo de la oficina (si el subdominio tiene uno); si no, la marca Taxoffix. -->
      <img
        *ngIf="logoUrl() && !showLogoFallback(); else taxoffixMark"
        [src]="logoUrl()"
        alt="Logo"
        class="h-9 max-w-[180px] object-contain"
        (error)="showLogoFallback.set(true)"
      />
      <ng-template #taxoffixMark>
        <span class="inline-flex items-center gap-2" [attr.aria-label]="brand">
          <ion-icon name="infinite-outline" class="text-[28px] text-[#057BC1]"></ion-icon>
          <span class="text-[22px] font-extrabold tracking-tight">Tax<span class="text-[#057BC1]">offix</span></span>
        </span>
      </ng-template>

      <h1 class="mt-5 text-[30px] font-semibold leading-tight tracking-tight">Sign in</h1>
      <p class="mt-2 text-sm leading-relaxed text-[#3E5F6B]">Enter your work email and we'll take you to your office.</p>
    </div>

    <form [formGroup]="form" class="mt-6 space-y-3.5" (ngSubmit)="onSubmit()" (input)="onTyping()">
      <div>
        <label for="email" class="sr-only">Email</label>
        <input type="email" id="email" formControlName="email" autocomplete="username" placeholder="Email"
          class="block h-12 w-full rounded-xl border border-[#E4DCCF] bg-white px-4 text-sm text-[#083645] placeholder-[#3E5F6B]/70 transition-colors focus:border-[#083645] focus:outline-none" />
      </div>

      <div>
        <label for="password" class="sr-only">Password</label>
        <div class="relative">
          <input [type]="showPassword() ? 'text' : 'password'" id="password" formControlName="password" autocomplete="current-password" placeholder="Password"
            class="block h-12 w-full rounded-xl border border-[#E4DCCF] bg-white px-4 pr-11 text-sm text-[#083645] placeholder-[#3E5F6B]/70 transition-colors focus:border-[#083645] focus:outline-none" />
          <button type="button" (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-[#3E5F6B] hover:text-[#083645]"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <ion-icon [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'" class="text-lg"></ion-icon>
          </button>
        </div>
      </div>

      @if (notice(); as sessionNotice) {
        <p class="rounded-xl bg-[#083645]/5 px-3 py-2 text-sm text-[#083645]" role="status">{{ sessionNotice }}</p>
      }

      @if (formError()) {
        <p class="text-sm font-medium text-red-600" role="alert">{{ formError() }}</p>
      }

      <button type="submit" [disabled]="isLoggingIn()"
        class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-[#083645] text-sm font-semibold text-white transition-colors hover:bg-[#057BC1] disabled:opacity-70">
        @if (isLoggingIn()) {
          <app-infinity-loader size="xs" tone="light" />
          <span>Signing in...</span>
        } @else {
          <span>Continue</span>
        }
      </button>
    </form>

    <div class="mt-6 flex flex-col items-center gap-2.5 text-[13px] text-[#3E5F6B]">
      <a routerLink="/forgot-password" class="font-medium hover:text-[#083645]">Forgot your password?</a>
      <!-- Sign-up y "encuentra tu oficina" son de sistema (app.<baseDomain>): se ocultan en el
           subdominio de una oficina concreta, donde no aplican. -->
      @if (!isOfficeSubdomain) {
        <p>
          Don't have an account?
          <button type="button" (click)="openPlanPicker()" class="font-semibold text-[#083645] hover:underline">Sign up</button>
        </p>
        <p>
          Can't sign in?
          <a routerLink="/find-office" class="font-semibold text-[#083645] hover:underline">Find your office by email</a>
        </p>
      }
    </div>
  </div>
</div>

<!-- Catálogo de planes: elegir antes de arrancar el alta (los precios vienen de GET /plans) -->
<app-plan-picker-modal [isOpen]="isPlanPickerOpen()" (closed)="closePlanPicker()"
  (planChosen)="startSignup($event)"></app-plan-picker-modal>
