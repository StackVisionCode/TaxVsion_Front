<form class="flex items-center gap-2" (ngSubmit)="submit()">
  <div class="h-11 flex-1 rounded-full border border-gray-200 bg-white flex items-center focus-within:border-gray-300 transition-colors"
    [class.opacity-60]="disabled">
    <input type="text" placeholder="Write a text message..." [ngModel]="draft()" name="draft"
      (ngModelChange)="draft.set($event)" [disabled]="disabled || busy" [attr.maxlength]="maxLength"
      class="w-full h-full bg-transparent px-4 text-sm text-gray-700 placeholder-gray-400 rounded-full focus:outline-none disabled:cursor-not-allowed" />
  </div>

  <button type="submit" [disabled]="disabled || busy"
    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-brand-bold text-white hover:bg-brand-ink transition-colors disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-brand-bold"
    aria-label="Send message">
    <ion-icon [name]="busy ? 'sync-outline' : 'send-outline'" class="text-base" [class.animate-spin]="busy"></ion-icon>
  </button>
</form>
