<div>
  <!-- Search pill -->
  <div class="mb-3 flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
    <ion-icon name="search-outline" class="mr-2 text-base text-gray-400"></ion-icon>
    <input type="text" placeholder="Search contacts or numbers" [ngModel]="search()" name="search"
      (ngModelChange)="search.set($event)"
      class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
  </div>

  <!-- Contact list (clientes del despacho; sin badge de no leídos: no hay feed de entrantes) -->
  <div class="flex flex-col gap-1">
    <button *ngFor="let contact of filteredContacts" type="button" (click)="select(contact.id)"
      class="flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left transition-colors"
      [ngClass]="contact.id === selectedId ? 'bg-brand-bold text-white' : 'hover:bg-gray-50 text-gray-700'"
      [class.opacity-60]="!contact.phoneE164 && contact.id !== selectedId">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-semibold text-white"
        [ngClass]="contact.avatarColor">{{ initials(contact.name) }}</span>

      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <span class="truncate text-sm font-semibold">{{ contact.name }}</span>
          <span class="shrink-0 text-[11px]" [ngClass]="contact.id === selectedId ? 'text-gray-300' : 'text-gray-400'">{{ contact.lastTime }}</span>
        </div>
        <p class="truncate text-xs" [ngClass]="contact.id === selectedId ? 'text-gray-300' : 'text-gray-400'">
          {{ contact.phoneRaw || 'No phone on file' }}
        </p>
        <div class="mt-0.5 flex items-center justify-between gap-2">
          <span class="truncate text-xs" [ngClass]="contact.id === selectedId ? 'text-gray-300' : 'text-gray-500'">{{ contact.preview }}</span>
        </div>
      </div>
    </button>

    <p *ngIf="filteredContacts.length === 0" class="px-3 py-6 text-center text-sm text-gray-400">No contacts found</p>
  </div>
</div>
