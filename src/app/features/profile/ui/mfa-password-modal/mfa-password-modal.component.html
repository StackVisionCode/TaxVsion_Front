<app-modal [isOpen]="isOpen" [heading]="heading" size="sm" (closed)="cancelled.emit()">
  <div class="password-body">
    <div class="mt-4 flex items-start gap-3">
      <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full"
        [ngClass]="destructive ? 'bg-red-50' : 'bg-indigo-50'">
        <ion-icon [name]="destructive ? 'alert-outline' : 'key-outline'" class="text-xl"
          [ngClass]="destructive ? 'text-red-500' : 'text-indigo-600'"></ion-icon>
      </span>
      <p class="pt-1 text-sm leading-relaxed text-gray-600">{{ message }}</p>
    </div>

    <label for="mfa-password" class="mt-5 block text-sm font-medium text-gray-900">
      Current password
    </label>
    <div class="mt-2 flex h-11 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
      <input id="mfa-password" type="password" autocomplete="current-password" name="mfaPassword"
        placeholder="Your password" [ngModel]="password()" (ngModelChange)="password.set($event)"
        (keyup.enter)="submit()"
        class="h-full w-full bg-transparent text-sm text-gray-900 placeholder-gray-400 focus:outline-none" />
    </div>

    @if (localError() || error) {
      <p class="mt-2 text-xs text-red-600">{{ localError() ?? error }}</p>
    }

    <div class="mt-6 flex items-center justify-end gap-2">
      <button type="button" (click)="cancelled.emit()"
        class="rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
        Cancel
      </button>
      <button type="button" (click)="submit()" [disabled]="busy"
        class="inline-flex items-center gap-2 rounded-full px-5 py-2 text-sm font-semibold text-white transition-colors disabled:opacity-50"
        [ngClass]="destructive ? 'bg-red-500 hover:bg-red-600' : 'bg-brand-bold hover:bg-brand-ink'">
        @if (busy) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
        }
        {{ busy ? busyLabel : confirmLabel }}
      </button>
    </div>
  </div>
</app-modal>
