<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
  <!-- Pendiente de cobro: saldo de todo lo emitido (los borradores no deben nada todavía) -->
  <div class="rounded-[28px] bg-white p-5">
    <div class="flex items-center justify-between">
      <p class="text-[11px] font-semibold uppercase tracking-wide text-gray-400">Outstanding</p>
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-amber-50">
        <ion-icon name="hourglass-outline" class="text-base text-amber-600"></ion-icon>
      </span>
    </div>
    <p class="mt-3 text-2xl font-bold text-gray-900" [class.opacity-40]="loading">
      {{ money(metrics.outstandingCents) }}
    </p>
    <p class="mt-1 text-xs text-gray-400">Issued and not fully paid</p>
  </div>

  <div class="rounded-[28px] bg-white p-5">
    <div class="flex items-center justify-between">
      <p class="text-[11px] font-semibold uppercase tracking-wide text-gray-400">Collected</p>
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-50">
        <ion-icon name="cash-outline" class="text-base text-emerald-600"></ion-icon>
      </span>
    </div>
    <p class="mt-3 text-2xl font-bold text-gray-900" [class.opacity-40]="loading">
      {{ money(metrics.collectedCents) }}
    </p>
    <p class="mt-1 text-xs text-gray-400">Across the invoices loaded</p>
  </div>

  <div class="rounded-[28px] bg-white p-5">
    <div class="flex items-center justify-between">
      <p class="text-[11px] font-semibold uppercase tracking-wide text-gray-400">Drafts</p>
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-gray-100">
        <ion-icon name="document-outline" class="text-base text-gray-500"></ion-icon>
      </span>
    </div>
    <p class="mt-3 text-2xl font-bold text-gray-900" [class.opacity-40]="loading">{{ metrics.draftCount }}</p>
    <p class="mt-1 text-xs text-gray-400">Not issued yet</p>
  </div>

  <div class="rounded-[28px] bg-white p-5">
    <div class="flex items-center justify-between">
      <p class="text-[11px] font-semibold uppercase tracking-wide text-gray-400">Average time to get paid</p>
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-50">
        <ion-icon name="time-outline" class="text-base text-brand-bold"></ion-icon>
      </span>
    </div>
    <p class="mt-3 text-2xl font-bold text-gray-900" [class.opacity-40]="loading">{{ averageLabel }}</p>
    <p class="mt-1 text-xs text-gray-400">From created to paid</p>
  </div>
</div>
