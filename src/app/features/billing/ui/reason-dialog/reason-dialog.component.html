<app-modal [isOpen]="isOpen" [heading]="heading" size="sm" (closed)="cancelled.emit()">
  <div class="mt-4 flex items-start gap-3">
    <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full"
      [ngClass]="tone === 'danger' ? 'bg-red-50' : 'bg-indigo-50'">
      <ion-icon [name]="tone === 'danger' ? 'alert-outline' : 'information-outline'" class="text-xl"
        [ngClass]="tone === 'danger' ? 'text-red-500' : 'text-brand-bold'"></ion-icon>
    </span>
    <p class="pt-2 text-sm leading-relaxed text-gray-600">{{ message }}</p>
  </div>

  <div class="mt-4">
    <label for="reasonText" class="block text-[11px] font-semibold uppercase tracking-wide text-gray-400">
      {{ reasonLabel }}
      <span *ngIf="!required" class="normal-case font-normal text-gray-400">(optional)</span>
    </label>
    <textarea id="reasonText" name="reasonText" rows="3" [attr.maxlength]="maxLength" [placeholder]="placeholder"
      [ngModel]="reason()" (ngModelChange)="reason.set($event ?? '')"
      class="mt-1 w-full resize-none rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none transition-colors"></textarea>
    <p *ngIf="required && !canConfirm" class="mt-1 text-xs text-gray-400">
      A reason of at least {{ minLength }} characters is required.
    </p>
  </div>

  <div class="mt-6 flex items-center justify-end gap-2">
    <button type="button" (click)="cancelled.emit()"
      class="rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
      Cancel
    </button>
    <button type="button" (click)="confirm()" [disabled]="!canConfirm"
      class="rounded-full px-5 py-2 text-sm font-semibold text-white disabled:opacity-40 transition-colors"
      [ngClass]="tone === 'danger' ? 'bg-red-500 hover:bg-red-600' : 'bg-brand-bold hover:bg-brand-ink'">
      {{ confirmLabel }}
    </button>
  </div>
</app-modal>
