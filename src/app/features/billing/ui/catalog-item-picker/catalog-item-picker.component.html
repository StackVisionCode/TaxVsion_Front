<app-modal [isOpen]="isOpen" heading="Add from catalog"
  subheading="Products and services from your catalog" size="lg" (closed)="close()">
  <div class="mt-5">
    <!-- Modo LISTA: buscar y elegir del catálogo -->
    <ng-container *ngIf="!showCreate()">
    <div class="relative">
      <ion-icon name="search-outline"
        class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-base text-gray-400"></ion-icon>
      <input type="text" name="catalogSearch" autocomplete="off" placeholder="Search by name…"
        [ngModel]="query()" (ngModelChange)="onQuery($event)"
        class="h-11 w-full rounded-full border border-gray-200 bg-white pl-11 pr-4 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none transition-colors" />
    </div>

    <div class="mt-4 max-h-80 overflow-y-auto">
      <div *ngIf="searching && items.length === 0" class="flex items-center gap-2 px-1 py-6 text-sm text-gray-400">
        <ion-icon name="sync-outline" class="animate-spin text-base"></ion-icon>
        Searching…
      </div>

      <button *ngFor="let item of items" type="button" (click)="itemPicked.emit(item)"
        class="flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left transition-colors hover:bg-gray-50">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
          [ngClass]="item.kind === 'Product' ? 'bg-emerald-50' : 'bg-indigo-50'">
          <ion-icon [name]="item.kind === 'Product' ? 'cube-outline' : 'briefcase-outline'" class="text-base"
            [ngClass]="item.kind === 'Product' ? 'text-emerald-600' : 'text-brand-bold'"></ion-icon>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium text-gray-900">{{ item.name }}</span>
          <span class="block truncate text-xs text-gray-400">
            {{ item.sku || item.description || item.kind }}
          </span>
        </span>
        <span class="shrink-0 text-sm font-semibold text-gray-900">{{ price(item) }}</span>
      </button>

      <div *ngIf="!searching && items.length === 0" class="px-4 py-10 text-center">
        <ion-icon name="cube-outline" class="text-3xl text-gray-300"></ion-icon>
        <p class="mt-2 text-sm text-gray-500">No catalog items match that search</p>
        <p class="mt-1 text-xs text-gray-400">You can still type the line by hand.</p>
      </div>
    </div>

    <div class="mt-5 flex items-center justify-between border-t border-gray-100 pt-4">
      <button type="button" (click)="openCreate()"
        class="inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold text-brand-bold hover:bg-indigo-50 transition-colors">
        <ion-icon name="add-outline" class="text-base"></ion-icon>
        New product/service
      </button>
      <button type="button" (click)="close()"
        class="rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
        Cancel
      </button>
    </div>
    </ng-container>

    <!-- Modo ALTA RÁPIDA: crear un producto/servicio sin salir a Products/Services -->
    <form *ngIf="showCreate()" (ngSubmit)="submitCreate()">
      <p class="text-sm font-semibold text-gray-900">New product/service</p>
      <p class="mt-0.5 text-xs text-gray-400">Saved to your catalog and added to this invoice.</p>

      <label class="mt-4 block text-xs font-medium text-gray-500">Name</label>
      <input type="text" name="newName" autocomplete="off" placeholder="e.g. Tax preparation"
        [ngModel]="newName()" (ngModelChange)="newName.set($event)" [disabled]="creating"
        class="mt-1 h-11 w-full rounded-2xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none transition-colors" />

      <div class="mt-4 grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500">Type</label>
          <div class="mt-1 grid grid-cols-2 gap-1 rounded-full bg-gray-100 p-1">
            <button type="button" (click)="newKind.set('Service')" [disabled]="creating"
              class="rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
              [ngClass]="newKind() === 'Service' ? 'bg-white text-brand-bold shadow-sm' : 'text-gray-500'">
              Service
            </button>
            <button type="button" (click)="newKind.set('Product')" [disabled]="creating"
              class="rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
              [ngClass]="newKind() === 'Product' ? 'bg-white text-emerald-600 shadow-sm' : 'text-gray-500'">
              Product
            </button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500">Price</label>
          <input type="number" name="newPrice" min="0" step="0.01" placeholder="0.00"
            [ngModel]="newPrice()" (ngModelChange)="newPrice.set($event)" [disabled]="creating"
            class="mt-1 h-11 w-full rounded-2xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none transition-colors" />
        </div>
      </div>

      <label class="mt-4 block text-xs font-medium text-gray-500">Tax rate</label>
      <div class="mt-1 flex items-center rounded-2xl border border-gray-200 bg-white pr-4">
        <input type="number" name="newTax" min="0" max="100" step="0.01" placeholder="0"
          [ngModel]="newTaxPercent()" (ngModelChange)="newTaxPercent.set($event)" [disabled]="creating"
          class="h-11 w-full rounded-2xl bg-transparent px-4 text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
        <span class="shrink-0 text-sm text-gray-400">% tax</span>
      </div>

      <!-- Detalles solo de PRODUCTO (un servicio es intangible: sin SKU/costo/unidad/stock) -->
      <div *ngIf="isProduct()" class="mt-4 rounded-2xl bg-gray-50 p-3">
        <p class="text-xs font-semibold text-gray-500">Product details</p>
        <div class="mt-2 grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-500">SKU</label>
            <input type="text" name="newSku" autocomplete="off" placeholder="Optional"
              [ngModel]="newSku()" (ngModelChange)="newSku.set($event)" [disabled]="creating"
              class="mt-1 h-11 w-full rounded-2xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none transition-colors" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500">Unit</label>
            <input type="text" name="newUnit" autocomplete="off" placeholder="e.g. each, box"
              [ngModel]="newUnit()" (ngModelChange)="newUnit.set($event)" [disabled]="creating"
              class="mt-1 h-11 w-full rounded-2xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none transition-colors" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500">Cost</label>
            <input type="number" name="newCost" min="0" step="0.01" placeholder="0.00"
              [ngModel]="newCost()" (ngModelChange)="newCost.set($event)" [disabled]="creating"
              class="mt-1 h-11 w-full rounded-2xl border border-gray-200 bg-white px-4 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none transition-colors" />
          </div>
          <div class="flex flex-col justify-center">
            <label class="block text-xs font-medium text-gray-500">Track inventory</label>
            <button type="button" (click)="newTrackInventory.set(!newTrackInventory())" [disabled]="creating"
              class="relative mt-2 inline-flex h-6 w-11 items-center rounded-full transition-colors"
              [ngClass]="newTrackInventory() ? 'bg-brand-bold' : 'bg-gray-300'" aria-label="Toggle inventory tracking">
              <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
                [ngClass]="newTrackInventory() ? 'translate-x-6' : 'translate-x-1'"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-5 flex items-center justify-end gap-2 border-t border-gray-100 pt-4">
        <button type="button" (click)="cancelCreate()" [disabled]="creating"
          class="rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
          Back
        </button>
        <button type="submit" [disabled]="!canCreate()"
          class="inline-flex items-center gap-1.5 rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white transition-colors hover:opacity-90 disabled:opacity-40">
          <ion-icon *ngIf="creating" name="sync-outline" class="animate-spin text-base"></ion-icon>
          {{ creating ? 'Creating…' : 'Create & add' }}
        </button>
      </div>
    </form>
  </div>
</app-modal>
