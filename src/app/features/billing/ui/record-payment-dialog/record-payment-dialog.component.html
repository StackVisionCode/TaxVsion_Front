<app-modal [isOpen]="isOpen" heading="Record payment" size="md"
  [subheading]="invoice?.invoiceNumber ? 'Invoice ' + invoice!.invoiceNumber : 'Offline payment'"
  (closed)="close()">
  <div *ngIf="invoice as inv" class="mt-5">
    <!-- Estado actual del saldo -->
    <div class="rounded-[1.375rem] bg-[#083645] p-6">
      <p class="text-[0.6875rem] font-semibold uppercase tracking-[0.18em] text-[#4DD8FF]">Outstanding</p>
      <p class="mt-2 font-display text-[2.75rem] font-bold leading-none text-white">{{ money(inv.amountDueCents) }}</p>
      <div class="my-4 h-px bg-white/15"></div>
      <div class="flex items-center justify-between text-[0.8125rem]">
        <span class="text-[#4DD8FF]">Invoice total</span>
        <span class="font-semibold text-white">{{ money(inv.totalCents) }}</span>
      </div>
      <div *ngIf="inv.amountPaidCents > 0" class="mt-2 flex items-center justify-between text-[0.8125rem]">
        <span class="text-[#4DD8FF]">Already paid</span>
        <span class="font-semibold text-white">{{ money(inv.amountPaidCents) }}</span>
      </div>
    </div>

    <!-- Método -->
    <label class="mt-5 block text-[0.8125rem] font-semibold text-[#083645]">Payment method</label>
    <div class="mt-2 flex flex-wrap gap-1 rounded-full border border-[#E4DCCF] bg-[#F8F4ED] p-1">
      <button *ngFor="let option of methods" type="button" (click)="method.set(option)" [disabled]="saving"
        class="min-w-0 flex-1 rounded-full px-4 py-2 text-[0.8125rem] font-semibold transition-colors disabled:opacity-50"
        [ngClass]="method() === option
          ? 'bg-[#083645] text-white'
          : 'text-[#3E5F6B] hover:text-[#083645]'">
        {{ methodLabel(option) }}
      </button>
    </div>

    <!-- Importe recibido ahora -->
    <div class="mt-5">
      <div class="flex items-center justify-between">
        <label for="paymentAmount" class="text-[0.8125rem] font-semibold text-[#083645]">
          Amount received now
        </label>
        <button type="button" (click)="payFullBalance()" [disabled]="saving"
          class="text-[0.8125rem] font-medium text-[#057BC1] hover:underline disabled:opacity-50 transition-colors">
          Full balance
        </button>
      </div>
      <div
        class="mt-2 flex h-[3.25rem] items-center rounded-full border-[0.09375rem] border-[#083645] bg-[#F8F4ED] px-[1.125rem]">
        <span class="mr-2 text-[0.8125rem] font-semibold text-[#3E5F6B]">{{ inv.currency }}</span>
        <input id="paymentAmount" type="number" min="0" step="0.01" name="paymentAmount" [disabled]="saving"
          [ngModel]="amount()" (ngModelChange)="amount.set($event)"
          class="h-full w-full bg-transparent font-display text-base font-semibold text-[#083645] focus:outline-none" />
      </div>
      <p class="mt-2 flex items-center gap-1.5 text-xs text-[#3E5F6B]">
        <ion-icon name="checkmark-circle-outline" class="text-sm text-[#057BC1]"></ion-icon>
        {{ settlesInvoice ? 'This settles the invoice in full.' : 'The invoice will stay partially paid.' }}
      </p>
    </div>

    <!-- Pie -->
    <div class="mt-6 flex items-center gap-3">
      <button type="button" (click)="close()" [disabled]="saving"
        class="h-12 flex-1 rounded-full border border-[#E4DCCF] bg-white text-[0.8125rem] font-semibold text-[#083645] hover:bg-[#F8F4ED] disabled:opacity-50 transition-colors">
        Cancel
      </button>
      <button type="button" (click)="submit()" [disabled]="!canSubmit"
        class="flex h-12 flex-1 items-center justify-center gap-2 rounded-full bg-[#083645] text-[0.8125rem] font-semibold text-white hover:bg-[#057BC1] disabled:opacity-50 disabled:hover:bg-[#083645] transition-colors">
        @if (saving) {
          <app-infinity-loader size="xs" tone="light" />
        } @else {
          <ion-icon name="checkmark-outline" class="text-base text-[#4DD8FF]"></ion-icon>
        }
        {{ saving ? 'Recording…' : 'Record payment' }}
      </button>
    </div>
  </div>
</app-modal>
