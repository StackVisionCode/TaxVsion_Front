<form class="mt-4 flex flex-col gap-4" (ngSubmit)="submit()" data-role="support-ticket-form">
  <div>
    <label for="support-subject" class="block text-sm font-medium text-gray-800">Subject</label>
    <input id="support-subject" type="text" placeholder="What do you need help with?" [ngModel]="subject()" name="subject"
      [attr.maxlength]="subjectMax" autocomplete="off" (ngModelChange)="subject.set($event)"
      class="mt-1.5 h-10 w-full rounded-full border border-gray-200 px-4 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none" />
  </div>

  <div>
    <span class="block text-sm font-medium text-gray-800">Category</span>
    <div class="mt-1.5 flex flex-wrap gap-2" role="radiogroup" aria-label="Category">
      <button *ngFor="let option of categories" type="button" role="radio" [attr.aria-checked]="option.value === category()"
        (click)="category.set(option.value)"
        class="rounded-full border px-3.5 py-1.5 text-xs font-semibold transition-colors"
        [ngClass]="option.value === category() ? 'border-brand-bold bg-brand-bold text-white' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
        {{ option.label }}
      </button>
    </div>
  </div>

  <div>
    <label for="support-message" class="block text-sm font-medium text-gray-800">Describe the issue</label>
    <textarea id="support-message" rows="5" placeholder="What happened, and what did you expect?" [ngModel]="message()" name="message"
      [attr.maxlength]="messageMax" (ngModelChange)="message.set($event)"
      class="mt-1.5 w-full resize-none rounded-2xl border border-gray-200 px-4 py-3 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none"></textarea>
    <p class="mt-1 text-right text-xs tabular-nums text-gray-400">{{ message().length }}/{{ messageMax }}</p>
  </div>

  <p *ngIf="errorMessage" class="flex items-center gap-2 rounded-2xl border border-red-200 px-3 py-2 text-xs font-medium text-red-600" role="alert">
    <ion-icon name="alert-circle-outline" class="text-sm"></ion-icon> {{ errorMessage }}
  </p>

  <div class="flex justify-end gap-2">
    <button type="button" (click)="cancel.emit()" [disabled]="submitting"
      class="rounded-full border border-gray-200 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50 disabled:opacity-50">Cancel</button>
    <button type="submit" [disabled]="!canSubmit() || submitting"
      class="flex items-center gap-2 rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink disabled:opacity-50 disabled:hover:bg-brand-bold">
      <ion-icon name="send-outline" class="text-base"></ion-icon>
      {{ submitting ? 'Sending…' : 'Send ticket' }}
    </button>
  </div>
</form>
