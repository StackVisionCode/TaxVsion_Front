<div class="flex h-full min-h-0 flex-col">
  <app-search-input class="block w-full" widthClass="w-full" placeholder="Search tickets" [value]="search" (valueChange)="searchChange.emit($event)"></app-search-input>

  <!-- Pestañas: el punto azul dice en cuál está el mensaje nuevo aunque se mire la otra -->
  <div class="mt-3 grid grid-cols-2 gap-1 rounded-full bg-gray-100 p-1" role="tablist" aria-label="Ticket status">
    <button type="button" role="tab" [attr.aria-selected]="filter === 'active'" (click)="filterChange.emit('active')" data-role="tab-active"
      class="flex items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
      [ngClass]="filter === 'active' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-700'">
      Active <span class="text-gray-400">{{ activeCount }}</span>
      <span *ngIf="activeUnread > 0" class="h-2 w-2 rounded-full bg-brand-bold" aria-label="New messages"></span>
    </button>
    <button type="button" role="tab" [attr.aria-selected]="filter === 'closed'" (click)="filterChange.emit('closed')" data-role="tab-closed"
      class="flex items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
      [ngClass]="filter === 'closed' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-700'">
      Closed <span class="text-gray-400">{{ closedCount }}</span>
      <span *ngIf="closedUnread > 0" class="h-2 w-2 rounded-full bg-brand-bold" aria-label="New messages"></span>
    </button>
  </div>

  <div class="mt-3 min-h-0 flex-1 overflow-y-auto">
    <div *ngIf="loading" class="flex flex-col gap-2">
      <div *ngFor="let row of skeletonRows" class="animate-pulse rounded-2xl px-3 py-3">
        <div class="h-3.5 w-2/3 rounded-full bg-gray-100"></div>
        <div class="mt-2 h-3 w-full rounded-full bg-gray-100"></div>
      </div>
    </div>

    <div *ngIf="!loading && error" class="px-2 py-6 text-center">
      <p class="text-sm text-red-600">{{ error }}</p>
      <button type="button" (click)="retry.emit()" class="mt-2 text-xs font-semibold text-brand-bold hover:underline">Try again</button>
    </div>

    <p *ngIf="!loading && !error && tickets.length === 0" class="px-2 py-8 text-center text-sm text-gray-400" data-role="inbox-empty">
      {{ search ? 'No tickets match your search.' : filter === 'active' ? 'No active tickets.' : 'No closed tickets.' }}
    </p>

    <ul *ngIf="!loading && !error" class="flex flex-col gap-1">
      <li *ngFor="let ticket of tickets; trackBy: trackTicket">
        <button type="button" (click)="selectTicket.emit(ticket)" data-role="ticket-row" [attr.aria-current]="ticket.id === selectedId ? 'true' : null"
          class="w-full rounded-2xl px-3 py-2.5 text-left transition-colors"
          [ngClass]="ticket.id === selectedId ? 'bg-brand-bold text-white' : unread(ticket) > 0 ? 'bg-brand-border/40 hover:bg-brand-border/60' : 'hover:bg-gray-50'">
          <span class="flex items-center justify-between gap-2">
            <span class="truncate text-sm" [ngClass]="unread(ticket) > 0 || ticket.id === selectedId ? 'font-bold' : 'font-semibold text-gray-800'">{{ ticket.subject }}</span>
            <span class="shrink-0 text-[0.6875rem]" [ngClass]="ticket.id === selectedId ? 'text-gray-300' : 'text-gray-400'">{{ when(ticket) }}</span>
          </span>
          <span class="mt-0.5 flex items-center justify-between gap-2">
            <span class="truncate text-xs" [ngClass]="ticket.id === selectedId ? 'text-gray-200' : unread(ticket) > 0 ? 'font-medium text-gray-800' : 'text-gray-500'" data-role="ticket-preview">{{ preview(ticket) }}</span>
            <span *ngIf="unread(ticket) > 0" data-role="ticket-unread"
              class="flex h-5 min-w-5 shrink-0 items-center justify-center rounded-full px-1.5 text-[0.6875rem] font-bold"
              [ngClass]="ticket.id === selectedId ? 'bg-white text-brand-bold' : 'bg-brand-bold text-white'"
              [attr.aria-label]="unread(ticket) + ' new messages'">{{ unread(ticket) > 9 ? '9+' : unread(ticket) }}</span>
          </span>
          <span class="mt-1 block text-[0.6875rem]" [ngClass]="ticket.id === selectedId ? 'text-gray-300' : 'text-gray-400'">
            <span [ngClass]="ticket.id === selectedId ? '' : statusClass(ticket)">{{ statusLabel(ticket) }}</span> · {{ ticket.category }} · #{{ ticket.id.slice(0, 8) }}
          </span>
        </button>
      </li>
    </ul>

    <app-load-more *ngIf="!loading && !error && !search" [hasMore]="hasMore" [loading]="loadingMore" (load)="loadMore.emit()"></app-load-more>
  </div>
</div>
