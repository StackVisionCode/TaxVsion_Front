<!-- Panel sin ticket elegido: cómo funciona Support (solo el flujo real de tickets; no hay teléfono ni buzón). -->
<div>
  <span class="flex h-14 w-14 items-center justify-center rounded-3xl bg-brand-bold/10 text-brand-bold">
    <ion-icon name="headset-outline" class="text-3xl"></ion-icon>
  </span>
  <h2 class="mt-4 text-xl font-bold text-gray-900">How can we help?</h2>
  <p class="mt-1 max-w-xl text-sm text-gray-500">
    Pick a ticket on the left to keep the conversation going, or open a new one. Our team answers right here.
  </p>

  <ol class="mt-5 grid grid-cols-1 gap-3 md:grid-cols-3">
    <li *ngFor="let step of steps" class="rounded-2xl border border-gray-100 p-4">
      <span class="flex h-9 w-9 items-center justify-center rounded-full" [ngClass]="step.circleClass">
        <ion-icon [name]="step.icon" class="text-lg"></ion-icon>
      </span>
      <h3 class="mt-3 text-sm font-bold text-gray-900">{{ step.title }}</h3>
      <p class="mt-1 text-sm leading-relaxed text-gray-600">{{ step.description }}</p>
    </li>
  </ol>
</div>
