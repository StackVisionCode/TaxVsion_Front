<div class="bg-white rounded-[28px] p-6">
  <!-- Header. Se quitó el chip "Support team online": no hay señal de presencia real del equipo. -->
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="max-w-2xl">
      <h2 class="text-xl font-bold text-gray-900">Support</h2>
      <p class="mt-1 text-sm text-gray-500">
        Support requests are handled through tickets in this workspace — there is no support phone
        line or inbox to write to yet.
      </p>
    </div>
  </div>

  <!-- Pasos del flujo real de tickets (sin datos de contacto ni botones inertes). -->
  <div class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-3">
    <div *ngFor="let step of steps" class="flex flex-col overflow-hidden rounded-2xl border border-gray-100">
      <div class="flex items-center gap-3 bg-gray-50/80 px-4 py-3">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full" [ngClass]="step.circleClass">
          <ion-icon [name]="step.icon" class="text-lg"></ion-icon>
        </span>
        <h3 class="text-sm font-bold text-gray-900">{{ step.title }}</h3>
      </div>

      <div class="flex flex-1 flex-col px-4 py-3">
        <p class="text-sm leading-relaxed text-gray-600">{{ step.description }}</p>
      </div>
    </div>
  </div>
</div>
