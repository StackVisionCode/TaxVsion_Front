<div class="min-h-full pt-3 pb-1 flex flex-col gap-4">
  <app-support-contact-options></app-support-contact-options>

  <div class="grid grid-cols-1 items-start gap-4 xl:grid-cols-2">
    <app-support-faq></app-support-faq>
    <app-support-ticket-form
      [submitting]="store.submitting()"
      [submittedTicketId]="store.lastTicketId()"
      [errorMessage]="store.submitError()"
      (submitTicket)="store.submitTicket($event)"
      (dismissConfirmation)="store.dismissConfirmation()">
    </app-support-ticket-form>
  </div>

  <app-support-ticket-list
    [tickets]="store.tickets()"
    [loading]="store.loading()"
    [error]="store.error()"
    [page]="store.page()"
    [totalPages]="store.totalPages()"
    [totalCount]="store.totalCount()"
    [reopeningId]="store.reopeningId()"
    [reopenError]="store.reopenError()"
    (reopenTicket)="store.reopenTicket($event)"
    (pageChange)="store.loadTickets($event)"
    (retry)="store.loadTickets()">
  </app-support-ticket-list>
</div>
