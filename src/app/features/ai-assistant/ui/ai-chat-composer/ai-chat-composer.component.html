<form class="flex items-center gap-2" (ngSubmit)="submit()">
  <div
    class="h-11 flex-1 rounded-full border border-gray-200 bg-white flex items-center focus-within:border-gray-300 transition-colors"
    [class.bg-gray-50]="disabled">
    <input type="text" [placeholder]="placeholder" [ngModel]="draft()" name="draft"
      (ngModelChange)="draft.set($event)" [disabled]="disabled"
      class="w-full h-full bg-transparent px-4 text-sm text-gray-700 placeholder-gray-400 rounded-full focus:outline-none disabled:cursor-not-allowed" />
  </div>
  <button type="submit" [disabled]="disabled"
    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-brand-bold text-white hover:bg-brand-ink disabled:cursor-not-allowed disabled:opacity-50 transition-colors"
    aria-label="Send message">
    <ion-icon name="send-outline" class="text-base"></ion-icon>
  </button>
</form>
