<form (ngSubmit)="onSubmit()" class="mt-5 text-left">
  <!-- Identidad: el buzón es SIEMPRE el email de login (guard del backend) -->
  <label class="block text-[11px] font-semibold uppercase tracking-wide text-gray-400">Email address</label>
  <div class="mt-1 flex items-center gap-2 rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2.5">
    <ion-icon name="lock-closed-outline" class="shrink-0 text-base text-gray-400"></ion-icon>
    <span class="min-w-0 truncate text-sm font-medium text-gray-700">{{ loginEmail || '—' }}</span>
  </div>
  <p class="mt-1 text-xs text-gray-400">You can only connect your own mailbox — the one you signed in with.</p>

  <label class="mt-4 block text-[11px] font-semibold uppercase tracking-wide text-gray-400">
    Display name <span class="font-normal normal-case tracking-normal text-gray-300">(optional)</span>
  </label>
  <input type="text" [(ngModel)]="displayName" name="displayName" placeholder="Front Office"
    class="mt-1 w-full rounded-2xl border border-gray-200 px-4 py-2.5 text-sm text-gray-900 focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />

  <!-- IMAP (correo entrante) -->
  <div class="mt-5 rounded-2xl border border-gray-100 p-4">
    <p class="flex items-center gap-2 text-sm font-semibold text-gray-900">
      <ion-icon name="download-outline" class="text-base text-brand-bold"></ion-icon> Incoming mail (IMAP)
    </p>
    <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-3">
      <div class="sm:col-span-2">
        <label class="block text-xs font-medium text-gray-500">Server</label>
        <input type="text" [(ngModel)]="imapHost" name="imapHost" placeholder="imap.example.com"
          class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500">Port</label>
        <input type="number" [(ngModel)]="imapPort" name="imapPort"
          class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />
      </div>
    </div>
    <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
      <div>
        <label class="block text-xs font-medium text-gray-500">Username</label>
        <input type="text" [(ngModel)]="imapUsername" name="imapUsername" autocomplete="off"
          class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500">Password</label>
        <input type="password" [(ngModel)]="imapPassword" name="imapPassword" autocomplete="new-password"
          class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />
      </div>
    </div>
    <label class="mt-3 flex items-center gap-2 text-sm text-gray-600">
      <input type="checkbox" [(ngModel)]="imapUseSsl" name="imapUseSsl" class="h-4 w-4 rounded border-gray-300 text-brand-bold focus:ring-brand-bold" />
      Use SSL/TLS
    </label>
  </div>

  <!-- SMTP (correo saliente) -->
  <div class="mt-4 rounded-2xl border border-gray-100 p-4">
    <p class="flex items-center gap-2 text-sm font-semibold text-gray-900">
      <ion-icon name="send-outline" class="text-base text-brand-bold"></ion-icon> Outgoing mail (SMTP)
    </p>
    <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-3">
      <div class="sm:col-span-2">
        <label class="block text-xs font-medium text-gray-500">Server</label>
        <input type="text" [(ngModel)]="smtpHost" name="smtpHost" placeholder="smtp.example.com"
          class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500">Port</label>
        <input type="number" [(ngModel)]="smtpPort" name="smtpPort"
          class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />
      </div>
    </div>
    <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
      <div>
        <label class="block text-xs font-medium text-gray-500">Username</label>
        <input type="text" [(ngModel)]="smtpUsername" name="smtpUsername" autocomplete="off"
          class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500">Password</label>
        <input type="password" [(ngModel)]="smtpPassword" name="smtpPassword" autocomplete="new-password"
          class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:border-brand-bold focus:outline-none focus:ring-1 focus:ring-brand-bold" />
      </div>
    </div>
    <label class="mt-3 flex items-center gap-2 text-sm text-gray-600">
      <input type="checkbox" [(ngModel)]="smtpUseStartTls" name="smtpUseStartTls" class="h-4 w-4 rounded border-gray-300 text-brand-bold focus:ring-brand-bold" />
      Use STARTTLS
    </label>
  </div>

  <p *ngIf="error" class="mt-4 rounded-2xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-600">
    {{ error }}
  </p>

  <div class="mt-5 flex items-center justify-end gap-3">
    <button type="button" (click)="cancel.emit()" [disabled]="busy"
      class="rounded-full px-4 py-2 text-sm font-semibold text-gray-500 hover:text-gray-900 disabled:opacity-50 transition-colors">
      Cancel
    </button>
    <button type="submit" [disabled]="!isValid || busy"
      class="flex items-center gap-2 rounded-full bg-brand-bold px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-ink disabled:opacity-50 disabled:hover:bg-brand-bold transition-colors">
      <ion-icon *ngIf="busy" name="sync-outline" class="animate-spin text-base"></ion-icon>
      {{ busy ? 'Connecting…' : 'Connect mailbox' }}
    </button>
  </div>
</form>
