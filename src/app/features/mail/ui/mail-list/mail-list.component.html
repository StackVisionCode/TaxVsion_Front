<div class="flex flex-col h-full">
  <!-- Search pill (filtra client-side lo ya cargado: el listado del backend no acepta término) -->
  <div class="mb-3 shrink-0 flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
    <ion-icon name="search-outline" class="mr-2 text-base text-gray-400"></ion-icon>
    <input type="text" placeholder="Search loaded mail" [ngModel]="search()" name="search"
      (ngModelChange)="onSearchChange($event)"
      class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
  </div>

  <!-- Carga inicial -->
  <div *ngIf="loading && filteredRows().length === 0"
    class="flex flex-1 min-h-0 items-center justify-center gap-2 text-sm text-gray-400">
    <ion-icon name="sync-outline" class="animate-spin text-base"></ion-icon>
    Loading…
  </div>

  <!-- Error del listado con reintento -->
  <div *ngIf="!loading && error as listError"
    class="flex flex-1 min-h-0 flex-col items-center justify-center gap-3 rounded-2xl border border-red-100 bg-red-50 px-5 py-6 text-center">
    <p class="text-sm text-red-600">{{ listError }}</p>
    <button type="button" (click)="retryRequested.emit()"
      class="rounded-full bg-brand-bold px-5 py-2 text-sm font-semibold text-white hover:bg-brand-ink transition-colors">
      Retry
    </button>
  </div>

  <!-- Listado -->
  <div *ngIf="!error && !(loading && filteredRows().length === 0)" #listScroll
    class="relative flex flex-1 min-h-0 flex-col gap-1 overflow-y-auto">
    <!-- Pill deslizante de la fila seleccionada -->
    <div *ngIf="indicatorReady()"
      class="mail-list-indicator absolute rounded-2xl bg-brand-bold pointer-events-none"
      [style.top.px]="indicatorTop()" [style.left.px]="indicatorLeft()" [style.width.px]="indicatorWidth()"
      [style.height.px]="indicatorHeight()"></div>

    <button #rowButton *ngFor="let row of filteredRows(); trackBy: trackByRowId" type="button" (click)="select(row.id)"
      class="relative z-10 flex w-full items-start gap-3 rounded-2xl px-3 py-3 text-left transition-colors"
      [ngClass]="row.id === selectedId ? 'text-white' : 'hover:bg-gray-50 text-gray-700'">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-semibold text-white"
        [ngClass]="row.avatarColor">{{ row.initials }}</span>

      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <span class="truncate text-sm font-semibold"
            [ngClass]="row.id === selectedId ? 'text-white' : 'text-gray-900'">{{ row.title }}</span>
          <span class="shrink-0 text-[11px]" [ngClass]="row.id === selectedId ? 'text-gray-300' : 'text-gray-400'">{{ row.time }}</span>
        </div>

        <div class="mt-0.5 flex items-center justify-between gap-2">
          <span class="truncate text-xs" [ngClass]="row.id === selectedId ? 'text-gray-300' : 'text-gray-500'">{{ row.subtitle }}</span>
          <span *ngIf="row.badge"
            class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-semibold"
            [ngClass]="row.id === selectedId ? 'bg-white/15 text-white' : 'bg-gray-100 text-gray-500'">{{ row.badge }}</span>
        </div>
      </div>
    </button>

    <p *ngIf="filteredRows().length === 0" class="px-3 py-6 text-center text-sm text-gray-400">{{ emptyText }}</p>

    <!-- Paginación incremental del listado activo -->
    <div *ngIf="hasMore" class="mt-2 flex justify-center pb-1">
      <button type="button" (click)="loadMoreRequested.emit()" [disabled]="loading || loadingMore"
        class="rounded-full border border-gray-200 px-5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 disabled:opacity-50 transition-colors">
        {{ loading || loadingMore ? 'Loading…' : 'Load more' }}
      </button>
    </div>
  </div>
</div>
