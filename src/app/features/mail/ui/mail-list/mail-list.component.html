<div class="flex flex-col h-full">
  <!-- Search pill: en el servidor (Inbox/Archived) o sobre lo ya cargado (resto de carpetas) -->
  <app-search-input class="mb-3 shrink-0" widthClass="w-full" [placeholder]="searchPlaceholder" [value]="search()"
    (valueChange)="onSearchChange($event)"></app-search-input>

  <!-- Carga inicial / error del listado con reintento -->
  <div *ngIf="(loading && filteredRows().length === 0) || (!loading && error)"
    class="flex flex-1 min-h-0 flex-col justify-center">
    <app-state-block [loading]="loading" [error]="error" variant="inline" (retry)="retryRequested.emit()"></app-state-block>
  </div>

  <!-- Listado -->
  <div *ngIf="!error && !(loading && filteredRows().length === 0)" #listScroll
    class="relative flex flex-1 min-h-0 flex-col gap-1 overflow-y-auto" role="list">
    <!-- Pill deslizante de la fila seleccionada -->
    <div *ngIf="indicatorReady()"
      class="mail-list-indicator absolute rounded-2xl bg-brand-bold pointer-events-none"
      [style.top.px]="indicatorTop()" [style.left.px]="indicatorLeft()" [style.width.px]="indicatorWidth()"
      [style.height.px]="indicatorHeight()"></div>

    <div *ngFor="let row of filteredRows(); trackBy: trackByRowId" class="relative z-10" role="listitem">
    <button #rowButton type="button" (click)="select(row.id)"
      [attr.aria-current]="row.id === selectedId ? 'true' : null" [attr.aria-label]="rowLabel(row)"
      class="relative flex w-full items-start gap-3 rounded-2xl px-3 py-3 text-left transition-colors"
      [ngClass]="[row.id === selectedId ? 'text-white' : 'hover:bg-gray-50 text-gray-700', showTrashActions && canManage ? 'pb-9' : '']">
      <app-avatar [name]="row.avatarName" size="md" [colorClass]="row.avatarColor"></app-avatar>

      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <span class="flex min-w-0 items-center gap-1.5">
            <!-- Punto de no-leído: solo cuando el hilo tiene correos sin leer y no está seleccionado -->
            <span *ngIf="row.unreadCount > 0 && row.id !== selectedId"
              class="h-2 w-2 shrink-0 rounded-full bg-brand-bold"></span>
            <span class="truncate text-sm"
              [ngClass]="[
                row.id === selectedId ? 'text-white' : 'text-gray-900',
                row.unreadCount > 0 ? 'font-bold' : 'font-semibold'
              ]">{{ row.title }}</span>
          </span>
          <span class="shrink-0 text-[0.6875rem]" [ngClass]="row.id === selectedId ? 'text-gray-300' : 'text-gray-400'">{{ row.time }}</span>
        </div>

        <div class="mt-0.5 flex items-center justify-between gap-2">
          <span class="truncate text-xs"
            [ngClass]="row.id === selectedId ? 'text-gray-200' : (row.unreadCount > 0 ? 'font-semibold text-gray-800' : 'text-gray-600')">{{ row.subtitle }}</span>
          <span class="flex shrink-0 items-center gap-1.5">
            <!-- Clip de adjuntos: icono + número (o solo el icono en un hilo) -->
            <span *ngIf="(row.attachmentCount ?? 0) > 0 || row.hasAttachments"
              class="flex items-center gap-0.5 text-[0.625rem] font-medium leading-none"
              [ngClass]="row.id === selectedId ? 'text-gray-300' : 'text-gray-400'" aria-label="Has attachments">
              <ion-icon name="attach-outline" class="text-xs"></ion-icon>{{ (row.attachmentCount ?? 0) > 0 ? row.attachmentCount : '' }}
            </span>
            <!-- Globo con el número de no-leídos -->
            <span *ngIf="row.unreadCount > 0"
              class="rounded-full px-1.5 py-0.5 text-[0.625rem] font-bold leading-none"
              [ngClass]="row.id === selectedId ? 'bg-white/20 text-white' : 'bg-brand-bold text-white'">{{ row.unreadCount }}</span>
            <span *ngIf="row.badge"
              class="rounded-full px-2 py-0.5 text-[0.625rem] font-semibold"
              [ngClass]="row.id === selectedId ? 'bg-white/15 text-white' : 'bg-gray-100 text-gray-500'">{{ row.badge }}</span>
          </span>
        </div>

        <!-- Cliente del correo + vista previa del último entrante -->
        <div *ngIf="row.tag || row.preview" class="mt-1 flex min-w-0 items-center gap-1.5">
          <span *ngIf="row.tag as tag"
            class="max-w-[50%] shrink-0 truncate rounded-full px-2 py-0.5 text-[0.625rem] font-semibold"
            [ngClass]="row.id === selectedId
              ? 'bg-white/15 text-white'
              : (tag.muted ? 'bg-gray-100 text-gray-500' : 'bg-brand-bold/10 text-brand-bold')">{{ tag.label }}</span>
          <span *ngIf="row.preview" class="truncate text-xs"
            [ngClass]="row.id === selectedId ? 'text-gray-300' : 'text-gray-400'">{{ row.preview }}</span>
        </div>
      </div>
    </button>
    <!-- Papelera: botones propios (no dentro de la fila) para que el teclado y los lectores lleguen a ellos -->
    <div *ngIf="showTrashActions && canManage" class="absolute bottom-2 right-3 flex items-center gap-1">
      <button type="button" (click)="restoreRequested.emit(row.id)" title="Restore" aria-label="Restore"
        class="flex h-7 items-center gap-1 rounded-full px-2 text-xs font-medium transition-colors"
        [ngClass]="row.id === selectedId ? 'text-white/80 hover:bg-white/15' : 'text-gray-500 hover:bg-gray-100 hover:text-gray-800'">
        <ion-icon aria-hidden="true" name="arrow-undo-outline" class="text-sm"></ion-icon> Restore
      </button>
      <button type="button" (click)="purgeRequested.emit(row.id)" title="Delete forever" aria-label="Delete forever"
        class="flex h-7 items-center gap-1 rounded-full px-2 text-xs font-medium transition-colors"
        [ngClass]="row.id === selectedId ? 'text-white/80 hover:bg-white/15' : 'text-gray-500 hover:bg-red-50 hover:text-red-600'">
        <ion-icon aria-hidden="true" name="trash-outline" class="text-sm"></ion-icon> Delete forever
      </button>
    </div>
    </div>

    <app-state-block *ngIf="filteredRows().length === 0" [empty]="true" variant="inline" icon="mail-outline"
      [emptyTitle]="emptyText"></app-state-block>

    <!-- Paginación incremental del listado activo -->
    <app-load-more class="pb-1" [hasMore]="hasMore" [loading]="loading || loadingMore" (load)="loadMoreRequested.emit()"></app-load-more>
  </div>
</div>
