<div class="flex flex-col h-full">
  <!-- Search pill (filtra client-side lo ya cargado: el listado del backend no acepta término) -->
  <app-search-input class="mb-3 shrink-0" widthClass="w-full" placeholder="Search loaded mail" [value]="search()"
    (valueChange)="onSearchChange($event)"></app-search-input>

  <!-- Carga inicial / error del listado con reintento -->
  <div *ngIf="(loading && filteredRows().length === 0) || (!loading && error)"
    class="flex flex-1 min-h-0 flex-col justify-center">
    <app-state-block [loading]="loading" [error]="error" variant="inline" (retry)="retryRequested.emit()"></app-state-block>
  </div>

  <!-- Listado -->
  <div *ngIf="!error && !(loading && filteredRows().length === 0)" #listScroll
    class="relative flex flex-1 min-h-0 flex-col gap-1 overflow-y-auto">
    <!-- Pill deslizante de la fila seleccionada -->
    <div *ngIf="indicatorReady()"
      class="mail-list-indicator absolute rounded-2xl bg-brand-bold pointer-events-none"
      [style.top.px]="indicatorTop()" [style.left.px]="indicatorLeft()" [style.width.px]="indicatorWidth()"
      [style.height.px]="indicatorHeight()"></div>

    <button #rowButton *ngFor="let row of filteredRows(); trackBy: trackByRowId" type="button" (click)="select(row.id)"
      class="relative z-10 flex w-full items-start gap-3 rounded-2xl px-3 py-3 text-left transition-colors"
      [ngClass]="row.id === selectedId ? 'text-white' : 'hover:bg-gray-50 text-gray-700'">
      <app-avatar [name]="row.avatarName" size="md" [colorClass]="row.avatarColor"></app-avatar>

      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <span class="flex min-w-0 items-center gap-1.5">
            <!-- Punto de no-leído: solo cuando el hilo tiene correos sin leer y no está seleccionado -->
            <span *ngIf="row.unreadCount > 0 && row.id !== selectedId"
              class="h-2 w-2 shrink-0 rounded-full bg-brand-bold"></span>
            <span class="truncate text-sm"
              [ngClass]="[
                row.id === selectedId ? 'text-white' : 'text-gray-900',
                row.unreadCount > 0 ? 'font-bold' : 'font-semibold'
              ]">{{ row.title }}</span>
          </span>
          <span class="shrink-0 text-[11px]" [ngClass]="row.id === selectedId ? 'text-gray-300' : 'text-gray-400'">{{ row.time }}</span>
        </div>

        <div class="mt-0.5 flex items-center justify-between gap-2">
          <span class="truncate text-xs" [ngClass]="row.id === selectedId ? 'text-gray-300' : 'text-gray-500'">{{ row.subtitle }}</span>
          <span class="flex shrink-0 items-center gap-1.5">
            <!-- Clip de adjuntos (carpeta Sent): icono + número -->
            <span *ngIf="(row.attachmentCount ?? 0) > 0"
              class="flex items-center gap-0.5 text-[10px] font-medium leading-none"
              [ngClass]="row.id === selectedId ? 'text-gray-300' : 'text-gray-400'">
              <ion-icon name="attach-outline" class="text-xs"></ion-icon>{{ row.attachmentCount }}
            </span>
            <!-- Globo con el número de no-leídos -->
            <span *ngIf="row.unreadCount > 0"
              class="rounded-full px-1.5 py-0.5 text-[10px] font-bold leading-none"
              [ngClass]="row.id === selectedId ? 'bg-white/20 text-white' : 'bg-brand-bold text-white'">{{ row.unreadCount }}</span>
            <span *ngIf="row.badge"
              class="rounded-full px-2 py-0.5 text-[10px] font-semibold"
              [ngClass]="row.id === selectedId ? 'bg-white/15 text-white' : 'bg-gray-100 text-gray-500'">{{ row.badge }}</span>

            <!-- Papelera: restaurar / borrar permanente -->
            <ng-container *ngIf="showTrashActions && canManage">
              <span (click)="$event.stopPropagation(); restoreRequested.emit(row.id)" title="Restore"
                class="flex h-6 w-6 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-700 cursor-pointer">
                <ion-icon name="arrow-undo-outline" class="text-sm"></ion-icon>
              </span>
              <span (click)="$event.stopPropagation(); purgeRequested.emit(row.id)" title="Delete forever"
                class="flex h-6 w-6 items-center justify-center rounded-full text-gray-400 hover:bg-red-50 hover:text-red-600 cursor-pointer">
                <ion-icon name="trash-outline" class="text-sm"></ion-icon>
              </span>
            </ng-container>
          </span>
        </div>
      </div>
    </button>

    <app-state-block *ngIf="filteredRows().length === 0" [empty]="true" variant="inline" icon="mail-outline"
      [emptyTitle]="emptyText"></app-state-block>

    <!-- Paginación incremental del listado activo -->
    <app-load-more class="pb-1" [hasMore]="hasMore" [loading]="loading || loadingMore" (load)="loadMoreRequested.emit()"></app-load-more>
  </div>
</div>
