<div class="compose-root flex h-full flex-col">
  <!-- Header -->
  <div class="flex items-start justify-between gap-4 border-b border-gray-100 pb-4">
    <div class="min-w-0">
      <h2 class="text-xl font-bold text-gray-900">{{ state.draft ? 'Continue draft' : 'New message' }}</h2>
      <!-- Contexto real del envío: el draft cuelga de una cuenta de buzón y de un cliente. -->
      <p class="mt-1 truncate text-sm text-gray-500">
        <ng-container *ngIf="accountEmail">From {{ accountEmail }}</ng-container>
        <ng-container *ngIf="accountEmail && customerName"> · </ng-container>
        <ng-container *ngIf="customerName">Client {{ customerName }}</ng-container>
      </p>
    </div>
    <button type="button" (click)="close()" [disabled]="state.sending"
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-gray-200 text-gray-400 hover:bg-gray-50 hover:text-gray-900 disabled:opacity-50 transition-colors"
      aria-label="Close compose">
      <ion-icon name="close-outline" class="text-lg"></ion-icon>
    </button>
  </div>

  <!-- Carga del draft retomado -->
  <div *ngIf="state.loadingDraft" class="flex flex-1 items-center justify-center gap-2 text-sm text-gray-400">
    <ion-icon name="sync-outline" class="animate-spin text-base"></ion-icon>
    Loading draft…
  </div>

  <div *ngIf="state.loadError as loadErr"
    class="mt-4 flex items-center justify-between gap-3 rounded-2xl border border-red-100 bg-red-50 px-4 py-3">
    <p class="text-sm text-red-600">{{ loadErr }}</p>
    <button type="button" (click)="close()"
      class="shrink-0 text-sm font-medium text-red-700 hover:text-red-900 transition-colors">Close</button>
  </div>

  <ng-container *ngIf="!state.loadingDraft && !state.loadError">
    <!-- Destinatarios (Bcc no se expone: el store no lo incluye en su payload de envío).
         To y Cc autocompletan contra /customers: se elige el cliente y se pega su dirección,
         o se usa tal cual lo tecleado cuando ya es un correo. -->
    <div class="mt-4 flex flex-col gap-2">
      <div class="relative">
        <div class="flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
          <span class="mr-2 w-14 shrink-0 text-sm text-gray-400">To</span>
          <input type="text" placeholder="Search a client or type an email" [ngModel]="to()" name="to"
            autocomplete="off" [disabled]="state.sending" (ngModelChange)="onRecipientInput('to', $event)"
            (focus)="onRecipientFocus('to')" (blur)="closeRecipientPickerSoon()"
            class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
        </div>
        <ng-container *ngIf="showRecipientPicker('to')" [ngTemplateOutlet]="recipientPicker"
          [ngTemplateOutletContext]="{ $implicit: 'to' }"></ng-container>
      </div>

      <div class="relative">
        <div class="flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
          <span class="mr-2 w-14 shrink-0 text-sm text-gray-400">Cc</span>
          <input type="text" placeholder="Search a client or type an email" [ngModel]="cc()" name="cc"
            autocomplete="off" [disabled]="state.sending" (ngModelChange)="onRecipientInput('cc', $event)"
            (focus)="onRecipientFocus('cc')" (blur)="closeRecipientPickerSoon()"
            class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
        </div>
        <ng-container *ngIf="showRecipientPicker('cc')" [ngTemplateOutlet]="recipientPicker"
          [ngTemplateOutletContext]="{ $implicit: 'cc' }"></ng-container>
      </div>

      <div class="flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
        <span class="mr-2 w-14 shrink-0 text-sm text-gray-400">Subject</span>
        <input type="text" placeholder="Subject" [ngModel]="subject()" name="subject" [disabled]="state.sending"
          (ngModelChange)="subject.set($event)"
          class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
      </div>
    </div>

    <!-- Barra del editor: formato del cuerpo, enlaces, imágenes embebidas y adjuntos reales.
         `mousedown` cancelado en cada control para no perder la selección del cuerpo al pulsarlo. -->
    <div class="mt-4 rounded-2xl border border-gray-100 bg-brand-white px-2 py-2">
      <div class="flex flex-wrap items-center gap-1">
        <button type="button" title="Bold" aria-label="Bold" [disabled]="state.sending"
          (mousedown)="$event.preventDefault()" (click)="exec('bold')"
          class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-bold disabled:opacity-40 transition-colors"
          [ngClass]="isMarkActive('bold') ? 'bg-white text-gray-900' : 'text-gray-500 hover:bg-white hover:text-gray-900'">
          B
        </button>
        <button type="button" title="Italic" aria-label="Italic" [disabled]="state.sending"
          (mousedown)="$event.preventDefault()" (click)="exec('italic')"
          class="flex h-9 w-9 items-center justify-center rounded-full font-serif text-base italic disabled:opacity-40 transition-colors"
          [ngClass]="isMarkActive('italic') ? 'bg-white text-gray-900' : 'text-gray-500 hover:bg-white hover:text-gray-900'">
          I
        </button>
        <button type="button" title="Underline" aria-label="Underline" [disabled]="state.sending"
          (mousedown)="$event.preventDefault()" (click)="exec('underline')"
          class="flex h-9 w-9 items-center justify-center rounded-full text-sm underline disabled:opacity-40 transition-colors"
          [ngClass]="isMarkActive('underline') ? 'bg-white text-gray-900' : 'text-gray-500 hover:bg-white hover:text-gray-900'">
          U
        </button>

        <span class="mx-1 h-5 w-px bg-gray-200"></span>

        <button type="button" title="Bulleted list" aria-label="Bulleted list" [disabled]="state.sending"
          (mousedown)="$event.preventDefault()" (click)="exec('insertUnorderedList')"
          class="flex h-9 w-9 items-center justify-center rounded-full disabled:opacity-40 transition-colors"
          [ngClass]="isMarkActive('insertUnorderedList') ? 'bg-white text-gray-900' : 'text-gray-500 hover:bg-white hover:text-gray-900'">
          <svg viewBox="0 0 16 16" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="2.5" cy="4" r="1.1" fill="currentColor" stroke="none" />
            <circle cx="2.5" cy="8" r="1.1" fill="currentColor" stroke="none" />
            <circle cx="2.5" cy="12" r="1.1" fill="currentColor" stroke="none" />
            <path d="M6 4h8M6 8h8M6 12h8" />
          </svg>
        </button>
        <button type="button" title="Numbered list" aria-label="Numbered list" [disabled]="state.sending"
          (mousedown)="$event.preventDefault()" (click)="exec('insertOrderedList')"
          class="flex h-9 w-9 items-center justify-center rounded-full disabled:opacity-40 transition-colors"
          [ngClass]="isMarkActive('insertOrderedList') ? 'bg-white text-gray-900' : 'text-gray-500 hover:bg-white hover:text-gray-900'">
          <svg viewBox="0 0 16 16" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M6 4h8M6 8h8M6 12h8" />
            <text x="0" y="5.6" font-size="5.5" fill="currentColor" stroke="none">1</text>
            <text x="0" y="9.6" font-size="5.5" fill="currentColor" stroke="none">2</text>
            <text x="0" y="13.6" font-size="5.5" fill="currentColor" stroke="none">3</text>
          </svg>
        </button>

        <span class="mx-1 h-5 w-px bg-gray-200"></span>

        <button type="button" title="Insert link" aria-label="Insert link" [disabled]="state.sending"
          (mousedown)="$event.preventDefault()" (click)="openLinkEditor()"
          class="flex h-9 w-9 items-center justify-center rounded-full disabled:opacity-40 transition-colors"
          [ngClass]="linkEditorOpen() ? 'bg-white text-gray-900' : 'text-gray-500 hover:bg-white hover:text-gray-900'">
          <ion-icon name="link-outline" class="text-lg"></ion-icon>
        </button>
        <label title="Insert image in the message"
          class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-full text-gray-500 hover:bg-white hover:text-gray-900 transition-colors"
          [class.opacity-40]="state.sending">
          <ion-icon name="image-outline" class="text-lg"></ion-icon>
          <span class="sr-only">Insert image</span>
          <input type="file" accept="image/*" multiple class="hidden" [disabled]="state.sending"
            (change)="onImagesSelected($event)" />
        </label>

        <span class="mx-1 h-5 w-px bg-gray-200"></span>

        <label
          class="flex h-9 cursor-pointer items-center gap-2 rounded-full px-3 text-sm font-medium text-gray-500 hover:bg-white hover:text-gray-900 transition-colors"
          [class.opacity-40]="state.sending" title="Attach files">
          <ion-icon name="attach-outline" class="text-lg"></ion-icon>
          Attach files
          <input type="file" multiple class="hidden" [disabled]="state.sending" (change)="onFilesSelected($event)" />
        </label>
      </div>

      <!-- Alta de enlace: la selección del cuerpo se guardó antes de abrir esto y se restaura al aplicar. -->
      <div *ngIf="linkEditorOpen()" class="mt-2 flex items-center gap-2 border-t border-gray-100 pt-2">
        <input #linkInput type="url" name="linkUrl" placeholder="https://example.com" [ngModel]="linkUrl()"
          (ngModelChange)="linkUrl.set($event)" (keydown.enter)="applyLink()" (keydown.escape)="cancelLink()"
          class="h-9 flex-1 rounded-full border border-gray-200 bg-white px-3 text-sm text-gray-700 placeholder-gray-400 focus:border-gray-300 focus:outline-none transition-colors" />
        <button type="button" (mousedown)="$event.preventDefault()" (click)="applyLink()"
          class="h-9 shrink-0 rounded-full bg-brand-bold px-4 text-xs font-semibold text-white hover:bg-brand-ink transition-colors">
          Add link
        </button>
        <button type="button" (click)="cancelLink()"
          class="h-9 shrink-0 rounded-full px-3 text-xs font-medium text-gray-500 hover:text-gray-900 transition-colors">
          Cancel
        </button>
      </div>
    </div>

    <!-- Cuerpo enriquecido: el html del contenteditable es lo que viaja como HtmlBody del draft. -->
    <div class="mt-4 flex min-h-[12rem] flex-1 flex-col">
      <p *ngIf="bodyNotice() as notice"
        class="mb-2 rounded-2xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800">
        {{ notice }}
      </p>
      <div #bodyEditor role="textbox" aria-multiline="true" aria-label="Message body"
        [attr.contenteditable]="state.sending ? 'false' : 'true'" [attr.data-placeholder]="'Write your message...'"
        [class.is-empty]="bodyIsEmpty()" (input)="onBodyInput()" (keyup)="onBodySelectionChange()"
        (mouseup)="onBodySelectionChange()" (focus)="onBodySelectionChange()" (blur)="onBodyBlur()"
        (paste)="onPaste($event)" (drop)="onDrop($event)"
        class="rich-body min-h-[10rem] w-full flex-1 overflow-y-auto rounded-2xl border border-gray-100 bg-white p-4 text-sm leading-relaxed text-gray-700 focus:border-gray-300 focus:outline-none transition-colors"></div>
    </div>

    <!-- Adjuntos ya guardados en el draft + archivos nuevos -->
    <div *ngIf="keptAttachments().length > 0 || files().length > 0" class="mt-3 flex flex-wrap gap-2">
      <span *ngFor="let file of keptAttachments()"
        class="flex items-center gap-2 rounded-full border border-gray-200 bg-white py-1.5 pl-3 pr-2 text-xs text-gray-700">
        <ion-icon name="cloud-done-outline" class="text-sm text-gray-400"></ion-icon>
        <span class="max-w-[12rem] truncate font-medium">{{ file.filename }}</span>
        <span class="text-gray-400">{{ fileSize(file.sizeBytes) }}</span>
        <button type="button" (click)="removeExistingAttachment(file.fileId)" [disabled]="state.sending"
          class="flex h-5 w-5 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-700 disabled:opacity-50 transition-colors"
          [attr.aria-label]="'Remove ' + file.filename">
          <ion-icon name="close-outline" class="text-sm"></ion-icon>
        </button>
      </span>

      <span *ngFor="let file of files(); let i = index"
        class="flex items-center gap-2 rounded-full border border-gray-200 bg-white py-1.5 pl-3 pr-2 text-xs text-gray-700">
        <ion-icon name="document-outline" class="text-sm text-gray-400"></ion-icon>
        <span class="max-w-[12rem] truncate font-medium">{{ file.name }}</span>
        <span class="text-gray-400">{{ fileSize(file.size) }}</span>
        <button type="button" (click)="removeFile(i)" [disabled]="state.sending"
          class="flex h-5 w-5 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-700 disabled:opacity-50 transition-colors"
          [attr.aria-label]="'Remove ' + file.name">
          <ion-icon name="close-outline" class="text-sm"></ion-icon>
        </button>
      </span>
    </div>

    <!-- Error del envío: el draft queda vivo en la carpeta Drafts con lo autoguardado -->
    <p *ngIf="state.error as sendErr"
      class="mt-3 rounded-2xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-600">
      {{ sendErr }}
    </p>

    <!-- Footer -->
    <div class="mt-4 flex items-center justify-between gap-2 border-t border-gray-100 pt-4">
      <button type="button" (click)="discard()" [disabled]="state.sending"
        class="flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 disabled:opacity-50 transition-colors">
        <ion-icon name="trash-outline" class="text-base"></ion-icon>
        Discard
      </button>
      <button type="button" (click)="send()" [disabled]="!canSend()"
        class="flex items-center gap-2 rounded-full bg-brand-bold px-6 py-2 text-sm font-semibold text-white hover:bg-brand-ink disabled:opacity-50 disabled:hover:bg-brand-bold transition-colors">
        <ion-icon [name]="state.sending ? 'sync-outline' : 'send-outline'" class="text-base"
          [ngClass]="state.sending ? 'animate-spin' : ''"></ion-icon>
        {{ state.sending ? 'Sending…' : 'Send' }}
      </button>
    </div>
  </ng-container>
</div>

<!-- Dropdown compartido por To y Cc: el contexto trae cuál de los dos lo está usando. -->
<ng-template #recipientPicker let-field>
  <div
    class="absolute left-0 right-0 z-30 mt-1 max-h-56 overflow-y-auto rounded-2xl border border-gray-100 bg-white py-1 shadow-lg">
    <div *ngIf="recipientSearching && recipientOptions(field).length === 0"
      class="flex items-center gap-2 px-3 py-2 text-xs text-gray-400">
      <ion-icon name="sync-outline" class="animate-spin text-sm"></ion-icon> Searching clients…
    </div>

    <button *ngIf="typedEmail(field) as typed" type="button" (mousedown)="$event.preventDefault()"
      (click)="useTypedEmail(field)"
      class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm transition-colors hover:bg-gray-50">
      <ion-icon name="mail-outline" class="shrink-0 text-base text-gray-400"></ion-icon>
      <span class="min-w-0 truncate text-gray-500">Use <span class="font-medium text-gray-900">{{ typed }}</span></span>
    </button>

    <button *ngFor="let customer of recipientOptions(field)" type="button" (mousedown)="$event.preventDefault()"
      (click)="pickRecipient(field, customer)"
      class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm transition-colors hover:bg-gray-50">
      <ion-icon name="person-circle-outline" class="shrink-0 text-base text-gray-400"></ion-icon>
      <span class="min-w-0 flex-1 truncate text-gray-700">{{ customer.displayName }}</span>
      <span class="shrink-0 truncate text-[11px] text-gray-400">{{ customer.primaryEmail }}</span>
    </button>
  </div>
</ng-template>
