<div class="compose-root flex h-full flex-col">
  <!-- Header -->
  <div class="flex items-start justify-between gap-4 border-b border-gray-100 pb-4">
    <div class="min-w-0">
      <h2 class="text-xl font-bold text-gray-900">{{ state.draft ? 'Continue draft' : 'New message' }}</h2>
      <!-- Contexto real del envío: el draft cuelga de una cuenta de buzón y de un cliente. -->
      <p class="mt-1 truncate text-sm text-gray-500">
        <ng-container *ngIf="accountEmail">From {{ accountEmail }}</ng-container>
        <ng-container *ngIf="accountEmail && customerName"> · </ng-container>
        <ng-container *ngIf="customerName">Client {{ customerName }}</ng-container>
      </p>
    </div>
    <button type="button" (click)="close()" [disabled]="state.sending"
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-gray-200 text-gray-400 hover:bg-gray-50 hover:text-gray-900 disabled:opacity-50 transition-colors"
      aria-label="Close compose">
      <ion-icon name="close-outline" class="text-lg"></ion-icon>
    </button>
  </div>

  <!-- Carga del draft retomado -->
  <div *ngIf="state.loadingDraft" class="flex flex-1 items-center justify-center gap-2 text-sm text-gray-400">
    <ion-icon name="sync-outline" class="animate-spin text-base"></ion-icon>
    Loading draft…
  </div>

  <div *ngIf="state.loadError as loadErr"
    class="mt-4 flex items-center justify-between gap-3 rounded-2xl border border-red-100 bg-red-50 px-4 py-3">
    <p class="text-sm text-red-600">{{ loadErr }}</p>
    <button type="button" (click)="close()"
      class="shrink-0 text-sm font-medium text-red-700 hover:text-red-900 transition-colors">Close</button>
  </div>

  <ng-container *ngIf="!state.loadingDraft && !state.loadError">
    <!-- Recipient fields (Bcc no se expone: el store no lo incluye en su payload de envío) -->
    <div class="mt-4 flex flex-col gap-2">
      <div class="flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
        <span class="mr-2 w-14 shrink-0 text-sm text-gray-400">To</span>
        <input type="text" placeholder="recipient@email.com, other@email.com" [ngModel]="to()" name="to"
          [disabled]="state.sending" (ngModelChange)="to.set($event)"
          class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
      </div>
      <div class="flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
        <span class="mr-2 w-14 shrink-0 text-sm text-gray-400">Cc</span>
        <input type="text" placeholder="cc@email.com" [ngModel]="cc()" name="cc" [disabled]="state.sending"
          (ngModelChange)="cc.set($event)"
          class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
      </div>
      <div class="flex h-10 items-center rounded-full border border-gray-200 bg-white px-4 focus-within:border-gray-300 transition-colors">
        <span class="mr-2 w-14 shrink-0 text-sm text-gray-400">Subject</span>
        <input type="text" placeholder="Subject" [ngModel]="subject()" name="subject" [disabled]="state.sending"
          (ngModelChange)="subject.set($event)"
          class="h-full w-full bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none" />
      </div>
    </div>

    <!-- Toolbox: sólo adjuntar (los archivos suben de verdad a CloudStorage al enviar) -->
    <div class="mt-4 flex flex-wrap items-center gap-2 rounded-2xl border border-gray-100 bg-brand-white px-2 py-2">
      <label
        class="flex h-9 cursor-pointer items-center gap-2 rounded-full px-3 text-sm font-medium text-gray-500 hover:bg-white hover:text-gray-900 transition-colors"
        title="Attach files">
        <ion-icon name="attach-outline" class="text-lg"></ion-icon>
        Attach files
        <input type="file" multiple class="hidden" [disabled]="state.sending" (change)="onFilesSelected($event)" />
      </label>
      <span class="text-xs text-gray-400">Plain text message</span>
    </div>

    <!-- Body -->
    <textarea placeholder="Write your message..." [ngModel]="body()" name="body" [disabled]="state.sending"
      (ngModelChange)="body.set($event)"
      class="mt-4 min-h-[10rem] w-full flex-1 resize-none rounded-2xl border border-gray-100 bg-white p-4 text-sm leading-relaxed text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-300 disabled:opacity-60 transition-colors"></textarea>

    <!-- Adjuntos ya guardados en el draft + archivos nuevos -->
    <div *ngIf="keptAttachments().length > 0 || files().length > 0" class="mt-3 flex flex-wrap gap-2">
      <span *ngFor="let file of keptAttachments()"
        class="flex items-center gap-2 rounded-full border border-gray-200 bg-white py-1.5 pl-3 pr-2 text-xs text-gray-700">
        <ion-icon name="cloud-done-outline" class="text-sm text-gray-400"></ion-icon>
        <span class="max-w-[12rem] truncate font-medium">{{ file.filename }}</span>
        <span class="text-gray-400">{{ fileSize(file.sizeBytes) }}</span>
        <button type="button" (click)="removeExistingAttachment(file.fileId)" [disabled]="state.sending"
          class="flex h-5 w-5 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-700 disabled:opacity-50 transition-colors"
          [attr.aria-label]="'Remove ' + file.filename">
          <ion-icon name="close-outline" class="text-sm"></ion-icon>
        </button>
      </span>

      <span *ngFor="let file of files(); let i = index"
        class="flex items-center gap-2 rounded-full border border-gray-200 bg-white py-1.5 pl-3 pr-2 text-xs text-gray-700">
        <ion-icon name="document-outline" class="text-sm text-gray-400"></ion-icon>
        <span class="max-w-[12rem] truncate font-medium">{{ file.name }}</span>
        <span class="text-gray-400">{{ fileSize(file.size) }}</span>
        <button type="button" (click)="removeFile(i)" [disabled]="state.sending"
          class="flex h-5 w-5 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-700 disabled:opacity-50 transition-colors"
          [attr.aria-label]="'Remove ' + file.name">
          <ion-icon name="close-outline" class="text-sm"></ion-icon>
        </button>
      </span>
    </div>

    <!-- Error del envío: el draft queda vivo en la carpeta Drafts con lo autoguardado -->
    <p *ngIf="state.error as sendErr"
      class="mt-3 rounded-2xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-600">
      {{ sendErr }}
    </p>

    <!-- Footer -->
    <div class="mt-4 flex items-center justify-between gap-2 border-t border-gray-100 pt-4">
      <button type="button" (click)="discard()" [disabled]="state.sending"
        class="flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 disabled:opacity-50 transition-colors">
        <ion-icon name="trash-outline" class="text-base"></ion-icon>
        Discard
      </button>
      <button type="button" (click)="send()" [disabled]="!canSend()"
        class="flex items-center gap-2 rounded-full bg-brand-bold px-6 py-2 text-sm font-semibold text-white hover:bg-brand-ink disabled:opacity-50 disabled:hover:bg-brand-bold transition-colors">
        <ion-icon [name]="state.sending ? 'sync-outline' : 'send-outline'" class="text-base"
          [ngClass]="state.sending ? 'animate-spin' : ''"></ion-icon>
        {{ state.sending ? 'Sending…' : 'Send' }}
      </button>
    </div>
  </ng-container>
</div>
