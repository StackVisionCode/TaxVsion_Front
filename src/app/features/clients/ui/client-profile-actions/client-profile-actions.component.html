@if (hasAny) {
  <div role="group" aria-label="Client actions"
    class="flex flex-wrap items-center gap-1 rounded-full border border-gray-200 bg-white p-1">
    <span class="hidden px-3 text-xs font-semibold uppercase tracking-wide text-gray-400 sm:inline">Actions</span>
    @if (emailLink; as link) {
      <a [routerLink]="link.commands" [queryParams]="link.queryParams" title="Compose email"
        class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
        <ion-icon name="mail-outline" class="text-base text-brand-bold"></ion-icon> Email
      </a>
    }
    @if (canSms) {
      <button type="button" (click)="sendSms.emit()" title="Send SMS"
        class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
        <ion-icon name="chatbox-ellipses-outline" class="text-base text-brand-bold"></ion-icon> SMS
      </button>
    }
    @if (meetingLink; as link) {
      <a [routerLink]="link.commands" [queryParams]="link.queryParams" title="Schedule meeting"
        class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
        <ion-icon name="videocam-outline" class="text-base text-brand-bold"></ion-icon> Meeting
      </a>
    }
    @if (signatureLink; as link) {
      <a [routerLink]="link.commands" [queryParams]="link.queryParams" title="New signature request"
        class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
        <ion-icon name="document-text-outline" class="text-base text-brand-bold"></ion-icon> Signature
      </a>
    }
  </div>
}
