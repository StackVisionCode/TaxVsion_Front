<div class="flex flex-col gap-6">
  <!--
    Se conserva el marco de las stat cards, pero en "—": no hay servicio de mileage, así
    que ni viajes, ni millas, ni reembolso estimado pueden calcularse.
  -->
  <app-stat-cards [items]="stats"></app-stat-cards>

  <div class="bg-white rounded-[28px] p-6">
    <h2 class="text-xl font-bold text-gray-900">Trips</h2>
    <p class="mt-1 text-sm text-gray-500">Mileage logged for this client</p>

    <div class="mt-4 flex items-start gap-3 rounded-2xl border border-blue-100 bg-blue-50 px-4 py-3">
      <ion-icon name="information-circle-outline" class="mt-0.5 shrink-0 text-base text-blue-500"></ion-icon>
      <p class="text-sm text-blue-800">
        Mileage tracking <span class="font-semibold">isn't connected yet</span>: there's no service storing
        trips, vehicles or odometer readings, so no distance or deduction can be shown for this client.
      </p>
    </div>

    <app-state-block class="mt-4 block" [empty]="true" icon="car-outline"
      emptyTitle="No mileage data to show for this client"></app-state-block>
  </div>
</div>
