<div>
  <div>
    <h3 class="text-lg font-bold text-gray-900">Invoices</h3>
    <p class="mt-1 text-sm text-gray-500">Billing history for this client</p>
  </div>

  <!--
    Tarjetas de totales en "—": el listado de Billing no expone el customer de cada
    factura, así que ningún total puede atribuirse a ESTE cliente. Se conserva el marco
    para no dejar un hueco, pero sin cifra inventada.
  -->
  <div class="mt-4 grid gap-3 sm:grid-cols-3">
    <div class="rounded-2xl border border-gray-100 bg-indigo-100 p-4">
      <p class="text-xs font-medium text-gray-500">Total invoiced</p>
      <p class="mt-1 text-xl font-bold text-gray-900">—</p>
    </div>
    <div class="rounded-2xl border border-gray-100 bg-indigo-50 p-4">
      <p class="text-xs font-medium text-gray-500">Outstanding balance</p>
      <p class="mt-1 text-xl font-bold text-gray-900">—</p>
    </div>
    <div class="rounded-2xl border border-gray-100 bg-indigo-100 p-4">
      <p class="text-xs font-medium text-gray-500">Invoices paid</p>
      <p class="mt-1 text-xl font-bold text-gray-900">—</p>
    </div>
  </div>

  <!-- Estado vacío honesto: Billing aún no lista facturas por cliente (ver comentario de clase). Copy sin jerga técnica. -->
  <div class="mt-4 rounded-2xl border border-gray-100 px-4 py-12 text-center">
    <ion-icon name="receipt-outline" class="text-3xl text-gray-300"></ion-icon>
    <p class="mt-2 text-sm font-medium text-gray-700">Client invoice history is coming soon</p>
    <p class="mx-auto mt-1 max-w-md text-xs text-gray-400">
      Invoices for a single client can't be shown on this page yet. You can find and manage every invoice
      for your office in Billing.
    </p>
    <a *ngIf="canOpenBilling" routerLink="/billing"
      class="mt-4 inline-flex items-center gap-2 rounded-full border border-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
      <ion-icon name="open-outline" class="text-base"></ion-icon>
      Open Billing
    </a>
  </div>
</div>
