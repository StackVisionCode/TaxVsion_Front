<div *ngIf="loading() && !client()" class="min-h-full pt-3 pb-1">
  <div class="bg-white rounded-[28px] p-6 text-sm text-gray-400">Loading client…</div>
</div>

<div *ngIf="loadError() && !client()" class="min-h-full pt-3 pb-1">
  <div class="bg-white rounded-[28px] p-6 text-sm text-red-600">{{ loadError() }}</div>
</div>

<div class="min-h-full pt-3 pb-1 flex flex-col gap-6" *ngIf="client() as c">
  <!-- Header -->
  <div class="bg-white rounded-[28px] p-6">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <a routerLink="/clients"
          class="-ml-3 flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
          <ion-icon name="arrow-back-outline" class="text-base"></ion-icon>
          Back to clients
        </a>

        <div class="mt-3 flex items-center gap-4">
          <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full text-lg font-bold text-white"
            [ngClass]="avatarClass(c)">
            {{ initials(c) }}
          </span>
          <div>
            <h2 class="text-2xl font-bold text-gray-900">{{ c.displayName }}</h2>
            <div class="mt-2 flex flex-wrap items-center gap-2">
              <span class="inline-flex items-center rounded-full border px-3 py-1 text-xs font-medium"
                [ngClass]="typeBadgeClass(c)">
                {{ typeLabel(c) }}
              </span>
              <span class="inline-flex items-center gap-2 rounded-full border px-3 py-1 text-xs font-medium"
                [ngClass]="statusChip(c)">
                <span class="h-1.5 w-1.5 rounded-full" [ngClass]="statusDot(c)"></span>
                {{ statusLabel(c) }}
              </span>
            </div>
          </div>
        </div>
      </div>

      <button type="button" (click)="openEditPanel()"
        class="flex items-center gap-2 rounded-full border border-gray-200 px-5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
        <ion-icon name="create-outline" class="text-base"></ion-icon>
        Edit
      </button>
    </div>

    <!-- Tab nav -->
    <div class="mt-6 flex flex-wrap gap-2">
      <ng-container *ngFor="let item of navItems">
        <!-- Single tab -->
        <button *ngIf="item.kind === 'tab'" type="button" (click)="selectTab(item.id)"
          class="shrink-0 rounded-full px-4 py-2 text-sm font-medium transition-colors"
          [ngClass]="item.id === activeTab() ? 'bg-brand-bold text-white' : 'border border-gray-200 text-gray-500 hover:bg-gray-50'">
          {{ item.label }}
        </button>

        <!-- Group of tabs behind a dropdown -->
        <div *ngIf="item.kind === 'group'" class="relative shrink-0" data-dropdown="profile-tab-group">
          <button type="button" (click)="toggleGroup(item.label, $event)"
            class="flex items-center gap-1 rounded-full px-4 py-2 text-sm font-medium transition-colors"
            [ngClass]="isGroupActive(item) ? 'bg-brand-bold text-white' : 'border border-gray-200 text-gray-500 hover:bg-gray-50'">
            {{ item.label }}
            <ion-icon name="chevron-down-outline" class="text-sm"></ion-icon>
          </button>

          <div *ngIf="openGroupLabel() === item.label"
            class="absolute left-0 top-full z-20 mt-2 w-48 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
            <button *ngFor="let tab of item.tabs" type="button" (click)="selectTab(tab.id)"
              class="flex w-full items-center justify-between px-4 py-2.5 text-sm transition-colors"
              [ngClass]="tab.id === activeTab() ? 'text-gray-900 font-semibold' : 'text-gray-700 hover:bg-gray-50'">
              {{ tab.label }}
              <ion-icon *ngIf="tab.id === activeTab()" name="checkmark-outline" class="text-sm"></ion-icon>
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

  <!-- Tab content -->
  <ng-container [ngSwitch]="activeTab()">
    <app-client-profile-overview *ngSwitchCase="'overview'" [client]="c"></app-client-profile-overview>

    <app-client-profile-info *ngSwitchCase="'info'" [client]="c"></app-client-profile-info>

    <div *ngSwitchCase="'documents'" class="bg-white rounded-[28px] p-6">
      <app-client-profile-documents [clientId]="c.id"></app-client-profile-documents>
    </div>

    <div *ngSwitchCase="'invoices'" class="bg-white rounded-[28px] p-6">
      <app-client-profile-invoices [clientId]="c.id"></app-client-profile-invoices>
    </div>

    <div *ngSwitchCase="'notes'" class="bg-white rounded-[28px] p-6">
      <app-client-profile-notes [clientId]="c.id"></app-client-profile-notes>
    </div>

    <div *ngSwitchCase="'communication'" class="bg-white rounded-[28px] p-6">
      <app-client-profile-communication [clientId]="c.id"></app-client-profile-communication>
    </div>

    <app-client-profile-calls *ngSwitchCase="'calls'" [clientId]="c.id"></app-client-profile-calls>

    <div *ngSwitchCase="'bank'" class="bg-white rounded-[28px] p-6">
      <app-client-profile-bank [clientId]="c.id"></app-client-profile-bank>
    </div>

    <app-client-profile-family *ngSwitchCase="'family'" [client]="c"></app-client-profile-family>

    <div *ngSwitchCase="'reminders'" class="bg-white rounded-[28px] p-6">
      <app-client-profile-reminders [clientId]="c.id"></app-client-profile-reminders>
    </div>

    <app-client-profile-mileage *ngSwitchCase="'mileage'" [clientId]="c.id"></app-client-profile-mileage>

    <app-client-profile-permissions *ngSwitchCase="'permissions'" [clientId]="c.id"></app-client-profile-permissions>
  </ng-container>

  <!-- Edit client -->
  <app-client-form-panel [isOpen]="isEditPanelOpen()" [client]="c" (closed)="closeEditPanel()"
    (saved)="handleClientSaved($event)"></app-client-form-panel>
</div>
