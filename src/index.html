<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TaxOffix</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1E466B">

  <!-- Favicons / PWA — servidos desde public/ (angular.json assets → raíz). base href /:
       SVG nítido + .ico e PNGs de respaldo + apple-touch + manifest. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- ionicons se registra desde main.ts (ionicons/loader); los SVG se sirven
       de /ionicons/ como asset local — sin CDN externo ni <script> aquí. -->

  <!-- Estilos del splash, INLINE a propósito: tienen que pintar antes de que llegue
       cualquier CSS, que es justo el momento que este splash cubre. -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F4ED;
    }
    #app-splash svg {
      width: 88px;
      height: 44px;
      overflow: visible;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #app-splash .il-base { stroke: #057bc1; opacity: .18; }
    #app-splash .il-trail {
      stroke: #057bc1;
      opacity: .55;
      stroke-dasharray: 26 74;
      animation: app-splash-run 1.6s cubic-bezier(.45, 0, .35, 1) infinite;
    }
    #app-splash .il-head {
      stroke: #4dd8ff;
      stroke-dasharray: 8 92;
      filter: drop-shadow(0 0 3px rgba(77, 216, 255, .95));
      animation: app-splash-run 1.6s cubic-bezier(.45, 0, .35, 1) infinite;
    }
    @keyframes app-splash-run {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -100; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .il-trail, #app-splash .il-head { animation: none; stroke-dasharray: 100 0; opacity: .7; }
    }
  </style>
</head>
<body>
  <!-- Splash de arranque: provideAuthInitializer bloquea el bootstrap con GET /auth/me,
       así que sin esto una recarga completa deja la pantalla en blanco durante un
       round-trip entero. Lo retira `App` en su primer render (ver app.ts). -->
  <div id="app-splash" role="status" aria-label="Loading"><svg viewBox="0 0 64 32" aria-hidden="true"><path class="il-base" d="M32 16 C24 4 14 4 10 4 C5 4 2 9 2 16 C2 23 5 28 10 28 C14 28 24 28 32 16 C40 4 50 4 54 4 C59 4 62 9 62 16 C62 23 59 28 54 28 C50 28 40 28 32 16 Z" pathLength="100"/><path class="il-trail" d="M32 16 C24 4 14 4 10 4 C5 4 2 9 2 16 C2 23 5 28 10 28 C14 28 24 28 32 16 C40 4 50 4 54 4 C59 4 62 9 62 16 C62 23 59 28 54 28 C50 28 40 28 32 16 Z" pathLength="100"/><path class="il-head" d="M32 16 C24 4 14 4 10 4 C5 4 2 9 2 16 C2 23 5 28 10 28 C14 28 24 28 32 16 C40 4 50 4 54 4 C59 4 62 9 62 16 C62 23 59 28 54 28 C50 28 40 28 32 16 Z" pathLength="100"/></svg></div>
  <app-root></app-root>
</body>
</html>
